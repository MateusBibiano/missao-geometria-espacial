<style>
:root {
  --desk: #1E1A17; --desk2: #2A231E; --paper: #F3EAD3; --manila: #E3C98F; --manila2: #D4B573; --ink: #1F1B16; --mute: #6F6455;
  --red: #C8102E; --red2: #A00C24; --cork: #B98A5A; --blue: #2457F5; --ok: #2E7D4F;
  --ft: 'Special Elite', 'Courier New', monospace; --fc: 'Courier Prime', 'Courier New', monospace; --fb: 'Bitter', Georgia, serif; --fn: 'Abril Fatface', Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { background: #120F0D; }
body { background: radial-gradient(1100px 700px at 50% 0%, #3A302A 0%, var(--desk) 60%, #120F0D 100%) fixed, var(--desk); color: var(--paper); font-family: var(--fb); font-size: 16px; line-height: 1.55; min-height: 100vh; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 9px); z-index: 0; }
#app { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 16px 48px; }
button { font: inherit; cursor: pointer; color: inherit; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid #FFD36B; outline-offset: 2px; }
h1, h2, h3 { font-family: var(--ft); font-weight: 400; line-height: 1.15; margin: 0 0 .5em; }
.muted { color: var(--mute); }
.center { text-align: center; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.kick { margin: 0; font-family: var(--fc); font-size: 12px; letter-spacing: .14em; color: var(--mute); text-transform: uppercase; }

.btn { border: 0; border-radius: 3px; padding: 11px 18px; font-family: var(--ft); font-size: 16px; letter-spacing: .02em; transition: transform .08s, background .15s; }
.btn.red { background: var(--red); color: #fff; box-shadow: 0 3px 0 var(--red2); }
.btn.red:hover:not(:disabled) { background: #DC1A3A; }
.btn.red:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--red2); }
.btn.ghost { background: transparent; border: 2px solid currentColor; }
.btn.ghost:hover:not(:disabled) { background: rgba(243,234,211,.1); }
.btn.big { font-size: 20px; padding: 14px 26px; }
.btn.sm { padding: 6px 12px; font-size: 14px; }
.btn:disabled { opacity: .4; }
.btn small { font-family: var(--fc); opacity: .75; }
.btn.danger { color: #FF8A8A; }
.lnk { background: none; border: 0; color: var(--manila); font-family: var(--fc); text-decoration: underline; text-underline-offset: 3px; }
.lnk2 { background: none; border: 0; color: var(--red); font-weight: 700; text-decoration: underline; padding: 0; }

/* barra */
.top { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px dashed rgba(243,234,211,.25); margin-bottom: 18px; flex-wrap: wrap; }
.top .logo { height: 30px; width: auto; filter: brightness(0) invert(.92) sepia(.3); }
.case-no { font-family: var(--ft); letter-spacing: .1em; color: var(--manila); margin-right: auto; }
.tabs-top { display: flex; gap: 4px; margin-right: auto; }
.tabb { background: none; border: 0; padding: 6px 12px; font-family: var(--ft); color: #CDBFA6; border-bottom: 3px solid transparent; }
.tabb.on { color: #fff; border-color: var(--red); }
.tabb:hover { color: #fff; }
.who { font-family: var(--fc); font-size: 14px; color: #CDBFA6; }
.who b { color: #FFD36B; }

/* capa */
.folder { position: relative; background: linear-gradient(170deg, var(--manila) 0%, var(--manila2) 100%); color: var(--ink); border-radius: 4px 10px 10px 10px; padding: 46px clamp(18px, 5vw, 60px) 36px; margin: 34px 0 24px; box-shadow: 0 30px 60px rgba(0,0,0,.5), inset 0 0 80px rgba(120,80,20,.25); animation: drop .7s cubic-bezier(.2,.8,.3,1); }
@keyframes drop { from { transform: translateY(-30px) rotate(-2deg); opacity: 0; } }
.tabtag { position: absolute; top: -26px; left: 0; background: var(--manila); padding: 4px 20px 8px; border-radius: 8px 8px 0 0; font-family: var(--ft); letter-spacing: .2em; font-size: 13px; color: var(--red2); }
.stamp-top { position: absolute; right: 28px; top: 24px; border: 3px solid var(--red); color: var(--red); font-family: var(--ft); padding: 4px 12px; transform: rotate(8deg); letter-spacing: .14em; opacity: .85; }
.folder h1 { font-size: clamp(30px, 5.5vw, 58px); margin-bottom: 14px; }
.folder h1 span { font-family: var(--fn); font-size: 1.15em; color: var(--red2); letter-spacing: .01em; }
.type { font-family: var(--fc); font-size: 18px; max-width: 60ch; }
.sheet { margin-top: 22px; background: var(--paper); border-radius: 2px; padding: 18px; width: min(460px, 100%); display: grid; gap: 12px; box-shadow: 0 8px 20px rgba(0,0,0,.18); transform: rotate(-1deg); background-image: repeating-linear-gradient(0deg, transparent 0 27px, rgba(36,87,245,.12) 27px 28px); }
.sheet-h { margin: 0; font-family: var(--ft); letter-spacing: .14em; color: var(--red2); }
.sheet label { display: grid; gap: 4px; font-family: var(--fc); font-weight: 700; }
input:not([type=radio]):not([type=range]) { font-family: var(--ft); font-size: 20px; padding: 8px 4px; border: 0; border-bottom: 2px solid var(--ink); background: transparent; color: var(--ink); border-radius: 0; }
input:focus { outline: none; border-color: var(--red); }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-family: var(--fc); font-weight: 700; margin-bottom: 4px; }
.seg { display: flex; gap: 8px; }
.seg label { flex: 1; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: block; text-align: center; padding: 8px; border: 2px solid var(--ink); font-family: var(--ft); color: var(--ink); }
.seg input:checked + span { background: var(--ink); color: var(--paper); }
.seg input:focus-visible + span { outline: 3px solid var(--red); }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; padding: 0; list-style: none; counter-reset: h; }
.how li { counter-increment: h; background: rgba(243,234,211,.06); border: 1px dashed rgba(243,234,211,.25); padding: 12px 14px 12px 50px; position: relative; color: #E3D7BE; }
.how li::before { content: counter(h); position: absolute; left: 12px; top: 10px; font-family: var(--fn); font-size: 28px; color: var(--red); }
.how b { color: #fff; }

/* memorando */
.memo { background: var(--paper); color: var(--ink); padding: clamp(18px, 4vw, 40px); border-radius: 2px; box-shadow: 0 30px 60px rgba(0,0,0,.5); transform: rotate(.4deg); position: relative; }
.memo::before { content: ''; position: absolute; top: -14px; left: 50%; width: 120px; height: 30px; background: rgba(240,230,190,.7); transform: translateX(-50%) rotate(-3deg); box-shadow: 0 2px 4px rgba(0,0,0,.1); }
.memo-h { font-family: var(--ft); color: var(--red2); letter-spacing: .16em; margin: 0 0 10px; }
.memo-t { font-family: var(--fc); font-size: 19px; min-height: 8em; }
.typing::after { content: '▌'; animation: blink .8s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.suspects-row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 14px 0 22px; }
.suspects-row figure { margin: 0; background: #fff; padding: 6px 6px 10px; box-shadow: 0 6px 14px rgba(0,0,0,.2); text-align: center; width: 112px; transform: rotate(var(--r, -2deg)); }
.suspects-row figure:nth-child(even) { --r: 2deg; }
.suspects-row figcaption { font-family: var(--ft); font-size: 13px; line-height: 1.2; margin-top: 4px; }
.suspects-row small { display: block; font-family: var(--fb); font-size: 10px; color: var(--mute); }
.avatar { display: block; }

/* cena */
.scene-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.scene-box { position: relative; border: 10px solid #0E0C0A; border-radius: 6px; box-shadow: 0 20px 50px rgba(0,0,0,.6); background: #000; }
svg.scene { width: 100%; height: auto; display: block; cursor: crosshair; touch-action: manipulation; }
.scene .hot { cursor: crosshair; }
.scene .hc { fill: transparent; }
.scene .hot.got .hc { stroke: #FFD36B; stroke-width: 2; stroke-dasharray: 4 5; }
.scene .decoy { fill: transparent; cursor: crosshair; }
.scene-tip { position: absolute; left: 10px; bottom: 8px; margin: 0; font-family: var(--fc); font-size: 13px; color: #CDBFA6; background: rgba(0,0,0,.55); padding: 3px 8px; pointer-events: none; }
.toast { position: absolute; left: 50%; top: 12px; transform: translate(-50%, -8px); background: var(--paper); color: var(--ink); font-family: var(--fc); padding: 8px 14px; box-shadow: 0 8px 20px rgba(0,0,0,.4); opacity: 0; transition: .25s; pointer-events: none; max-width: 90%; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.checklist { background: var(--paper); color: var(--ink); padding: 16px; box-shadow: 0 16px 30px rgba(0,0,0,.4); transform: rotate(1deg); background-image: repeating-linear-gradient(0deg, transparent 0 25px, rgba(36,87,245,.14) 25px 26px); }
.cl-h { font-family: var(--ft); color: var(--red2); margin: 0 0 8px; letter-spacing: .08em; }
.checklist ol { list-style: none; padding: 0; margin: 0 0 12px; font-family: var(--fc); }
.checklist li { padding: 2px 0; }
.checklist li span { color: #A99C85; letter-spacing: .2em; }
.checklist li.ok { text-decoration: none; }
.cl-tip { font-size: 13px; color: var(--mute); font-style: italic; }

/* quadro */
.board-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; color: #CDBFA6; }
.board-head p { margin: 0; max-width: 70ch; font-size: 14px; }
.miss { font-family: var(--fc); color: #FFD36B; margin: 0 0 8px; }
.cork { position: relative; height: 680px; border: 14px solid #5A3B22; border-radius: 6px; background-color: var(--cork); background-image: radial-gradient(rgba(80,50,20,.35) 1px, transparent 1.5px), radial-gradient(rgba(255,230,190,.25) 1px, transparent 1.5px); background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 5px; box-shadow: inset 0 0 60px rgba(60,30,10,.6), 0 20px 50px rgba(0,0,0,.5); overflow: hidden; }
.yarn { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.yarn path { fill: none; stroke-width: 2.6; stroke-linecap: round; filter: drop-shadow(0 2px 1px rgba(0,0,0,.35)); }
.yarn-in { stroke: var(--red); }
.yarn-out { stroke: #F3EAD3; stroke-dasharray: 6 6; opacity: .8; }
.yarn-note { stroke: #2C5BB8; stroke-dasharray: 2 5; }
.pin-card { position: absolute; width: 15.5%; min-width: 128px; transform: rotate(var(--rot)); transition: transform .12s, box-shadow .12s; cursor: grab; user-select: none; touch-action: none; z-index: 2; color: var(--ink); }
.pin-card:hover { transform: rotate(0) scale(1.03); z-index: 4; }
.pin-card.drag { cursor: grabbing; transform: rotate(0) scale(1.06); z-index: 5; box-shadow: 0 18px 30px rgba(0,0,0,.45) !important; }
.pushpin { position: absolute; top: -8px; left: 50%; width: 18px; height: 18px; border-radius: 50%; transform: translateX(-50%); background: radial-gradient(circle at 35% 35%, #FF6B6B, #A00C24 70%); box-shadow: 0 3px 3px rgba(0,0,0,.4); z-index: 2; }
.polaroid { background: #FBF8F1; padding: 8px 8px 10px; box-shadow: 0 8px 16px rgba(0,0,0,.35); text-align: center; }
.polaroid .avatar { width: 100%; height: auto; }
.polaroid b { display: block; font-family: var(--ft); font-weight: 400; font-size: 15px; margin-top: 6px; line-height: 1.15; }
.polaroid small { display: block; font-size: 11px; color: var(--mute); line-height: 1.25; }
.st { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%) rotate(-14deg); font-family: var(--ft); font-size: 15px; letter-spacing: .1em; padding: 3px 8px; border: 3px solid; background: rgba(255,255,255,.75); animation: stamp .35s cubic-bezier(.2,1.6,.4,1); }
@keyframes stamp { from { transform: translate(-50%, -50%) rotate(-14deg) scale(2.2); opacity: 0; } }
.st.out { color: #555; border-color: #555; }
.st.hot { color: var(--red); border-color: var(--red); }
.polaroid.out .avatar { filter: grayscale(1) contrast(.8); opacity: .7; }
.index { background: #FFFDF6; padding: 12px 10px 10px; box-shadow: 0 8px 16px rgba(0,0,0,.35); background-image: linear-gradient(180deg, transparent 26px, rgba(200,16,46,.5) 26px, rgba(200,16,46,.5) 27.5px, transparent 27.5px), repeating-linear-gradient(0deg, transparent 0 17px, rgba(36,87,245,.15) 17px 18px); }
.index .num { font-family: var(--fc); font-size: 11px; letter-spacing: .12em; color: var(--red2); }
.index b { display: block; font-family: var(--ft); font-weight: 400; font-size: 16px; margin-top: 6px; line-height: 1.15; }
.index small { display: block; font-size: 12px; color: var(--mute); }
.lst { display: inline-block; margin-top: 6px; font-family: var(--fc); font-size: 12px; background: var(--ink); color: #FFD36B; padding: 1px 6px; }
.lst.ok { background: var(--ok); color: #fff; } .lst.no { background: #7A6A55; color: #fff; }

/* caderno */
.notebook { background: var(--paper); color: var(--ink); padding: clamp(18px, 4vw, 40px) clamp(18px, 4vw, 40px) clamp(18px, 4vw, 40px) 70px; box-shadow: 0 30px 60px rgba(0,0,0,.5); position: relative; background-image: linear-gradient(90deg, transparent 52px, rgba(200,16,46,.45) 52px, rgba(200,16,46,.45) 54px, transparent 54px), repeating-linear-gradient(0deg, transparent 0 27px, rgba(36,87,245,.14) 27px 28px); font-family: var(--fc); }
.notebook h2 { font-size: 30px; }
.notebook h3 { color: var(--red2); margin-top: 18px; }
.notebook li { margin: 6px 0; }
.notebook em { font-style: normal; font-weight: 700; } .notebook em.out { color: #555; } .notebook em.hot { color: var(--red); }

/* laboratório */
.lab-h { display: flex; gap: 14px; align-items: center; }
.lab-h h2 { margin: 0; font-size: clamp(22px, 3vw, 30px); }
.evid { font-family: var(--fc); color: #E3D7BE; background: rgba(243,234,211,.06); border-left: 4px solid var(--manila); padding: 8px 12px; margin: 12px 0; }
.lab { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
.stage { position: relative; height: min(64vh, 560px); min-height: 330px; border-radius: 4px; overflow: hidden; border: 1px solid #000; background: radial-gradient(circle at 50% 35%, #F2EEE4, #CFC7B4 80%); box-shadow: 0 20px 40px rgba(0,0,0,.45); }
.stage::after { content: 'LAB. PERÍCIA G9'; position: absolute; right: 10px; top: 8px; font-family: var(--fc); font-size: 11px; letter-spacing: .14em; color: rgba(31,27,22,.4); pointer-events: none; }
.stage.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.v3d canvas { width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
.v3d-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; background: var(--ink); color: #fff; font-family: var(--fc); font-size: 13px; font-weight: 700; padding: 2px 7px; border-radius: 2px; white-space: nowrap; }
.lbl.r { background: var(--red); } .lbl.b { background: var(--blue); }
.lbl.fade { opacity: 0; transition: opacity .3s; } .lbl.fade.on { opacity: 1; }
.v3d-tip { position: absolute; left: 10px; bottom: 8px; font-family: var(--fc); font-size: 12px; color: var(--mute); pointer-events: none; transition: opacity .4s; }
.v3d-tip.gone { opacity: 0; }
.panel { background: var(--paper); color: var(--ink); padding: 16px; display: grid; gap: 12px; box-shadow: 0 20px 40px rgba(0,0,0,.45); }
.prompt { font-size: 16.5px; }
.hintbox { background: #FFF3C4; border-left: 4px solid #E0A21B; padding: 8px 12px; }
.fb:empty { display: none; }
.fb { padding: 12px 14px; border: 2px solid; }
.fb.warn { border-color: #CDBFA6; }
.fb.no { border-color: var(--red); background: #FCE9EA; }
.fb.ok { border-color: var(--ok); background: #E7F4EC; }
.fb small { display: block; color: var(--mute); margin-top: 4px; }
.fb-h b { font-family: var(--ft); font-weight: 400; font-size: 18px; }
.fb.ok .fb-h b { color: var(--ok); }
.steps { margin: 8px 0; padding-left: 22px; }
.concl { margin: 8px 0 0; font-family: var(--fc); font-weight: 700; }
.gact { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.gact .btn.red { margin-left: auto; }
.gact .btn.ghost { color: var(--ink); }

/* teclado */
.kp { display: grid; gap: 8px; }
.kp-screen { background: #121010; color: #fff; padding: 8px 14px; border-radius: 3px; }
.kp-l { font-family: var(--fc); font-size: 11px; letter-spacing: .12em; color: #9A8E7A; text-transform: uppercase; }
.kp-v { display: flex; align-items: baseline; gap: 4px; font-family: var(--fc); min-height: 44px; }
.kp-num { font-size: 32px; color: #FFD36B; font-weight: 700; }
.kp-num.empty { width: 18px; border-bottom: 3px solid #FFD36B; animation: blink 1s steps(2) infinite; }
.kp-pi { font-size: 28px; color: #FFD36B; font-style: normal; }
.kp-u { color: #CDBFA6; font-size: 18px; margin-left: 6px; }
.kp-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.kp-keys button { padding: 9px 0; font-family: var(--fc); font-size: 21px; font-weight: 700; border: 2px solid var(--ink); background: #FFFDF6; color: var(--ink); border-radius: 3px; box-shadow: 0 3px 0 var(--ink); }
.kp-keys button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.locked .kp-keys button, .locked button { pointer-events: none; opacity: .5; }

/* encaixe */
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tab { position: relative; display: grid; justify-items: center; gap: 4px; padding: 6px 2px; border: 2px solid #CDBFA6; background: #FFFDF6; font-size: 11px; line-height: 1.15; text-align: center; color: var(--ink); }
.tab.on { border-color: var(--ink); background: #FFF3C4; }
.tab .avatar { border-radius: 50%; }
.mk { position: absolute; top: -8px; right: -6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 700; color: #fff; font-size: 13px; }
.mk.y { background: var(--ok); } .mk.n { background: var(--red); }
.viewbtns { display: flex; gap: 6px; }
.vb { flex: 1; padding: 8px; border: 2px solid var(--ink); background: #fff; font-family: var(--fc); font-weight: 700; color: var(--ink); }
.vb.on { background: var(--ink); color: #FFD36B; }
.boxtxt { margin: 0; font-size: 15px; }
.fitq { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; font-weight: 700; }
.fit { padding: 10px 16px; border: 2px solid var(--ink); background: #fff; font-family: var(--ft); color: var(--ink); }
.fit.on { background: var(--ink); color: #FFD36B; }
.btn.play { background: var(--ink); color: #FFD36B; width: 100%; }
.range { display: grid; gap: 4px; font-weight: 700; }
.range input { width: 100%; accent-color: var(--red); height: 30px; }

/* acusação */
.court { background: var(--paper); color: var(--ink); padding: clamp(18px, 4vw, 36px); box-shadow: 0 30px 60px rgba(0,0,0,.5); }
.court h2 { font-size: clamp(24px, 3.4vw, 36px); }
.acc-sus { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 18px; }
.acc-p { background: #fff; border: 3px solid transparent; padding: 6px; display: grid; justify-items: center; gap: 4px; box-shadow: 0 6px 12px rgba(0,0,0,.15); font-family: var(--ft); color: var(--ink); }
.acc-p .avatar { width: 100%; height: auto; }
.acc-p.out { opacity: .55; }
.acc-p.on { border-color: var(--red); transform: translateY(-4px); opacity: 1; }
.acc-ev { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
.acc-e { text-align: left; background: #FFFDF6; border: 2px dashed #A99C85; padding: 10px; font-family: var(--ft); color: var(--ink); line-height: 1.2; }
.acc-e span { display: block; font-family: var(--fc); font-size: 11px; color: var(--red2); letter-spacing: .1em; }
.acc-e.on { border: 2px solid var(--red); background: #FCE9EA; }

/* jornal */
.paper { background: #F1ECDF; color: #161412; padding: clamp(16px, 4vw, 40px); box-shadow: 0 30px 60px rgba(0,0,0,.55); transform: rotate(-.6deg); animation: spinin .9s cubic-bezier(.2,.9,.3,1); background-image: radial-gradient(rgba(0,0,0,.04) 1px, transparent 1px); background-size: 4px 4px; }
@keyframes spinin { from { transform: rotate(-200deg) scale(.2); opacity: 0; } }
.mast { text-align: center; border-bottom: 4px double #161412; margin-bottom: 12px; }
.mast p { margin: 0; font-family: var(--fc); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; border-bottom: 1px solid #161412; padding-bottom: 6px; }
.mast h1 { font-family: var(--fn); font-size: clamp(44px, 9vw, 92px); margin: 6px 0 4px; letter-spacing: .01em; }
.headline { font-family: var(--fn); font-size: clamp(26px, 4.6vw, 46px); line-height: 1.05; margin: 8px 0; }
.deck { font-style: italic; font-size: 18px; border-bottom: 1px solid #161412; padding-bottom: 10px; }
.cols { display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px; }
.col { column-count: 2; column-gap: 22px; text-align: justify; hyphens: auto; }
.drop::first-letter { font-family: var(--fn); float: left; font-size: 58px; line-height: .9; margin: 4px 8px 0 0; }
.box { border: 2px solid #161412; padding: 12px; }
.trophy { width: 90px; display: block; margin: 0 auto 8px; }
.box dl { margin: 0; display: grid; gap: 6px; }
.box dl div { display: flex; justify-content: space-between; border-bottom: 1px dotted #161412; gap: 8px; }
.box dt { font-family: var(--fc); font-size: 13px; } .box dd { margin: 0; font-weight: 700; text-align: right; }
.code { font-family: var(--fc); text-align: center; margin: 10px 0 0; }
.closedscr > .row { margin-top: 26px; }

/* páginas */
.page h2 { font-size: 30px; }
.hall { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 6px; }
.hall li { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 12px; align-items: center; padding: 8px 12px; background: var(--paper); color: var(--ink); font-family: var(--fc); }
.hall .pos { color: var(--red); font-weight: 700; } .hall small { color: var(--mute); } .hall .dt { font-size: 12px; color: var(--mute); }
.tcards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
.tcards section { background: rgba(243,234,211,.06); border: 1px dashed rgba(243,234,211,.3); padding: 16px; }
.tcards p { color: #CDBFA6; margin-top: 0; }
.gab { background: var(--paper); color: var(--ink); padding: 12px 16px; margin: 18px 0; }
.gab summary { font-family: var(--ft); cursor: pointer; }

/* modal */
.veil { position: fixed; inset: 0; background: rgba(8,6,5,.7); display: grid; place-items: center; padding: 16px; z-index: 30; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(520px, 100%); background: var(--paper); color: var(--ink); padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.6); max-height: 90vh; overflow: auto; animation: drop .3s; }
.modal h3 { font-size: 26px; margin: 2px 0 6px; }
.modal form { display: grid; gap: 12px; }
.modal label { display: grid; gap: 4px; font-family: var(--fc); font-weight: 700; }
.modal .btn.ghost { color: var(--ink); }
.evid-big { font-family: var(--fc); font-size: 17px; background: #FFFDF6; border: 1px dashed #A99C85; padding: 10px 12px; }
.dep { display: flex; gap: 14px; align-items: center; }
.dep .avatar { border: 6px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.2); transform: rotate(-3deg); }
.quote { font-family: var(--fc); font-size: 17px; min-height: 5.5em; }
.carry { background: #FFFDF6; border-left: 4px solid var(--manila2); padding: 8px 10px; }
.st-line { font-family: var(--ft); } .st-line.out { color: #555; } .st-line.hot { color: var(--red); }
.err { color: var(--red); margin: 0; }

body.proj #app { max-width: 1560px; }
body.proj .prompt { font-size: 21px; }
body.proj .stage { height: 70vh; }

@media (max-width: 980px) {
  .scene-grid, .lab { grid-template-columns: 1fr; }
  .checklist { transform: none; }
  .cols { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .cork { height: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 22px 14px; padding: 22px 12px; }
  .pin-card { position: relative !important; left: auto !important; top: auto !important; width: auto; min-width: 0; cursor: pointer; }
  .yarn { display: none; }
  .tabs-top { order: 3; width: 100%; }
  .who { margin-left: auto; }
  .acc-sus { grid-template-columns: repeat(3, 1fr); }
  .acc-ev { grid-template-columns: 1fr 1fr; }
  .tabs { grid-template-columns: repeat(5, 1fr); }
  .tab span { display: none; }
  .col { column-count: 1; }
  .tcards { grid-template-columns: 1fr; }
  .stage { height: 46vh; min-height: 280px; }
  .stamp-top { top: 10px; right: 10px; font-size: 12px; }
  .folder { padding-top: 54px; }
  .hall li { grid-template-columns: 34px 1fr auto; } .hall .dt { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

[hidden]{display:none!important}

/* =========================================================
   MOTOR 3D — sólidos giráveis, clicáveis e com cotas
   ========================================================= */
const C3 = {
  ink: 0x15161A, yellow: 0xFFD21F, red: 0xE5322D, blue: 0x2457F5, green: 0x18A058,
  face: 0xF2EEE3, faceB: 0xDDE6F5, faceC: 0xFBE3C8, faceD: 0xD9F0E3, water: 0x4FA3E8,
};
function M(color, opacity, extra) {
  return new THREE.MeshStandardMaterial(Object.assign({
    color, roughness: 0.6, metalness: 0.02, transparent: opacity < 1, opacity: opacity == null ? 1 : opacity,
    side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
  }, extra || {}));
}
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

class Viewer {
  constructor(host, opts) {
    const o = Object.assign({ yaw: 0.65, tilt: 0.42, auto: true, fit: 1.0 }, opts || {});
    this.o = o; this.host = host;
    host.classList.add('v3d');
    host.innerHTML = '';
    this.canvas = document.createElement('canvas');
    this.labels = document.createElement('div'); this.labels.className = 'v3d-labels';
    this.tip = document.createElement('div'); this.tip.className = 'v3d-tip'; this.tip.textContent = '↔ arraste para girar';
    host.append(this.canvas, this.labels, this.tip);
    let ok = true;
    try { this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, alpha: true }); } catch (e) { ok = false; }
    if (!ok) { host.classList.add('nogl'); host.insertAdjacentHTML('beforeend', '<p class="nogl-msg">Seu navegador não conseguiu abrir o modo 3D.</p>'); this.dead = true; return; }
    this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(32, 1, 0.05, 500);
    this.pivot = new THREE.Group(); this.scene.add(this.pivot);
    this.pivot.rotation.set(o.tilt, o.yaw, 0);
    this.target = null;
    this.scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f9c, 1.6));
    const d = new THREE.DirectionalLight(0xffffff, 1.5); d.position.set(3, 6, 5); this.scene.add(d);
    const d2 = new THREE.DirectionalLight(0xffffff, 0.5); d2.position.set(-4, -2, -3); this.scene.add(d2);
    this.lab = []; this.picks = []; this.frame = []; this.auto = o.auto;
    this.onPick = null;
    this._bind();
    this.ro = new ResizeObserver(() => this.resize()); this.ro.observe(host);
    this.resize();
    const loop = () => { if (this.dead) return; this.raf = requestAnimationFrame(loop); this.tick(); };
    loop();
    Viewer.all.add(this);
  }
  _bind() {
    let down = null; let moved = 0;
    this.canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; moved = 0; this.auto = false; this.target = null; this.tip.classList.add('gone'); try { this.canvas.setPointerCapture(e.pointerId); } catch (_) { /* */ } });
    this.canvas.addEventListener('pointermove', (e) => {
      if (!down) { this.hover(e); return; }
      const dx = e.clientX - down.x; const dy = e.clientY - down.y; moved += Math.abs(dx) + Math.abs(dy);
      this.pivot.rotation.y += dx * 0.011;
      this.pivot.rotation.x = Math.max(-1.3, Math.min(1.3, this.pivot.rotation.x + dy * 0.009));
      down = { x: e.clientX, y: e.clientY };
    });
    const up = (e) => { if (down && moved < 6) this.pick(e); down = null; };
    this.canvas.addEventListener('pointerup', up);
    this.canvas.addEventListener('pointercancel', () => { down = null; });
    this.canvas.addEventListener('pointerleave', () => { this.canvas.style.cursor = ''; });
  }
  ray(e) {
    const r = this.canvas.getBoundingClientRect();
    const m = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    const rc = new THREE.Raycaster(); rc.setFromCamera(m, this.camera);
    const hit = rc.intersectObjects(this.picks, false)[0];
    return hit ? hit.object : null;
  }
  hover(e) { if (!this.picks.length) return; this.canvas.style.cursor = this.ray(e) ? 'pointer' : 'grab'; }
  pick(e) { if (!this.onPick || !this.picks.length) return; const o = this.ray(e); if (o) this.onPick(o.userData.pick, o); }
  set(obj) {
    // limpa
    while (this.pivot.children.length) { const c = this.pivot.children.pop(); disposeDeep(c); }
    this.labels.innerHTML = ''; this.lab = []; this.picks = [];
    this.pivot.add(obj.group);
    (obj.picks || []).forEach((p) => this.picks.push(p));
    (obj.labels || []).forEach((l) => this.label(l.text, l.pos, l.cls));
    this.fitTo(obj.group);
    return this;
  }
  fitTo(g) {
    const box = new THREE.Box3().setFromObject(g); const s = box.getBoundingSphere(new THREE.Sphere());
    this.radius = s.radius > 0 ? s.radius : 1;
    this.place();
  }
  place() {
    const fov = (this.camera.fov * Math.PI) / 180;
    const aspect = Math.max(0.6, this.w / this.h || 1);
    const dist = (this.radius / Math.sin(fov / 2)) * this.o.fit / Math.min(1, aspect);
    this.camera.position.set(0, 0, dist); this.camera.lookAt(0, 0, 0);
    this.camera.near = dist / 50; this.camera.far = dist * 10; this.camera.updateProjectionMatrix();
  }
  label(text, pos, cls) {
    const el = document.createElement('span'); el.className = 'lbl ' + (cls || ''); el.innerHTML = text;
    this.labels.appendChild(el); const L = { el, pos: pos.clone() }; this.lab.push(L); return L;
  }
  face(yaw, tilt) { this.target = { y: yaw, x: tilt }; this.auto = false; }
  resize() {
    const r = this.host.getBoundingClientRect(); this.w = Math.max(10, r.width); this.h = Math.max(10, r.height);
    if (this.dead) return;
    this.renderer.setSize(this.w, this.h, false); this.camera.aspect = this.w / this.h; this.camera.updateProjectionMatrix();
    if (this.radius) this.place();
  }
  tick() {
    if (this.auto) this.pivot.rotation.y += 0.004;
    if (this.target) {
      this.pivot.rotation.y += (this.target.y - this.pivot.rotation.y) * 0.08;
      this.pivot.rotation.x += (this.target.x - this.pivot.rotation.x) * 0.08;
    }
    this.frame.forEach((f) => f());
    this.renderer.render(this.scene, this.camera);
    this.pivot.updateMatrixWorld();
    const v = new THREE.Vector3();
    this.lab.forEach((L) => {
      v.copy(L.pos).applyMatrix4(this.pivot.matrixWorld).project(this.camera);
      const x = ((v.x + 1) / 2) * this.w; const y = ((1 - v.y) / 2) * this.h;
      L.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -50%)`;
    });
  }
  dispose() {
    this.dead = true; cancelAnimationFrame(this.raf);
    try { this.ro.disconnect(); } catch (e) { /* */ }
    if (this.pivot) while (this.pivot.children.length) disposeDeep(this.pivot.children.pop());
    if (this.renderer) { this.renderer.dispose(); this.renderer.forceContextLoss && this.renderer.forceContextLoss(); }

  }
}
Viewer.all = new Set();
function disposeDeep(o) { o.traverse((c) => { if (c.geometry) c.geometry.dispose(); if (c.material) (Array.isArray(c.material) ? c.material : [c.material]).forEach((m) => m.dispose()); }); }

/* ---------- peças ---------- */
function rod(a, b, r, mat) {
  const d = b.clone().sub(a); const len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10, 1), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(V3(0, 1, 0), d.normalize());
  return m;
}
function ball(p, r, mat) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat); m.position.copy(p); return m; }
function ring(r, y, tube, mat, horiz) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 8, 72), mat);
  if (!horiz) { m.rotation.x = Math.PI / 2; m.position.y = y; } else { m.rotation.y = Math.PI / 2; m.position.x = y; }
  return m;
}
/* cota: linha com pontas, rótulo no meio deslocado */
function dim(g, labels, a, b, text, color, off, dashed) {
  const s = a.distanceTo(b);
  const mat = new THREE.MeshBasicMaterial({ color });
  const r = Math.max(0.008, s * 0.012);
  if (dashed) {
    const n = Math.max(4, Math.round(s / (r * 9)));
    for (let i = 0; i < n; i += 2) { const p = a.clone().lerp(b, i / n); const q = a.clone().lerp(b, Math.min(1, (i + 1) / n)); g.add(rod(p, q, r, mat)); }
  } else g.add(rod(a, b, r, mat));
  g.add(ball(a, r * 2.2, mat)); g.add(ball(b, r * 2.2, mat));
  if (text) labels.push({ text, pos: a.clone().add(b).multiplyScalar(0.5).add(off || V3(0, 0, 0)), cls: color === C3.blue ? 'b' : color === C3.red ? 'r' : '' });
  return mat;
}

/* poliedro genérico: vértices + faces (listas de índices) */
function poly(verts, faces, o) {
  const opt = Object.assign({ color: C3.face, opacity: 0.9, edge: C3.ink, size: 1 }, o || {});
  const g = new THREE.Group(); const picks = []; const faceMeshes = []; const edgeMeshes = [];
  faces.forEach((f, i) => {
    const pos = [];
    for (let k = 1; k < f.length - 1; k++) [f[0], f[k], f[k + 1]].forEach((j) => pos.push(verts[j].x, verts[j].y, verts[j].z));
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, M(opt.faceColors ? opt.faceColors[i] : opt.color, opt.opacity));
    m.userData.pick = 'f' + i; m.userData.face = i; g.add(m); faceMeshes.push(m);
  });
  const seen = new Set(); const edges = [];
  faces.forEach((f) => f.forEach((a, k) => { const b = f[(k + 1) % f.length]; const key = a < b ? a + '-' + b : b + '-' + a; if (!seen.has(key)) { seen.add(key); edges.push([a, b]); } }));
  const er = opt.size * 0.014;
  edges.forEach(([a, b], i) => {
    const m = rod(verts[a], verts[b], er, new THREE.MeshStandardMaterial({ color: opt.edge, roughness: 0.4 }));
    m.userData.pick = 'e' + i; m.userData.edge = i; g.add(m); edgeMeshes.push(m);
    // alvo de clique mais gordo e invisível
    const hit = rod(verts[a], verts[b], er * 4, new THREE.MeshBasicMaterial({ visible: false }));
    hit.userData.pick = 'e' + i; hit.userData.edge = i; g.add(hit);
  });
  verts.forEach((v) => g.add(ball(v, er * 1.6, new THREE.MeshStandardMaterial({ color: opt.edge }))));

/* =========================================================
   LABORATÓRIO DE PERÍCIA — cada laudo devolve
   { check(): {ok,msg,soft}, reveal(), lock() }
   ========================================================= */
const GOLD = 0xE2B33C;
const trophySpec = (extra) => Object.assign({ k: 'pyr', n: 4, R: TROFEU.l / Math.SQRT2, H: TROFEU.h, rot: Math.PI / 4, color: GOLD, opacity: 1 }, extra || {});

function numLab(ctrl, c) {
  const kp = keypad(ctrl, { unit: c.unit });
  return {
    check: () => {
      const x = kp.get();
      if (Number.isNaN(x)) return { ok: false, soft: true, msg: 'Digite o resultado no teclado.' };
      return Math.abs(x - c.ans) <= c.tol ? { ok: true } : { ok: false, msg: 'O laudo não fecha. Refaça a conta.' };
    },
    reveal: () => kp.set(String(c.ans)),
    lock: () => kp.lock(),
  };
}

function labP1(stage, ctrl, c) {
  const v = new Viewer(stage, { tilt: 0.35 }); v.set(buildSolid(trophySpec({ ledge: '10 cm', lh: '12 cm' })));

}

/* perícia 2: teste do encaixe */
function labP2(stage, ctrl, c) {
  const v = new Viewer(stage, { yaw: 0.6, tilt: 0.45, auto: false, fit: 0.95 });
  const marks = {}; let cur = SUSPECTS[0].id; let top = false; let locked = false;
  const build = (s) => {
    const g = new THREE.Group(); const b = s.box; let H; let lab = [];
    if (b.k === 'box') {
      H = b.c; const sol = buildSolid({ k: 'box', a: b.a, b: b.b, c: b.c, color: 0x9FC3E8, opacity: 0.28, la: `${b.a} cm`, lb: `${b.b} cm`, lc: `${b.c} cm` });
      g.add(sol.group); lab = sol.labels;
    } else {
      H = b.h; const sol = buildSolid({ k: 'cyl', r: b.r, h: b.h, color: 0x9FC3E8, opacity: 0.28, ld: `⌀ ${numFmt(2 * b.r)} cm`, lh: `${b.h} cm` });
      g.add(sol.group); lab = sol.labels;
    }
    const t = buildSolid(trophySpec()); t.group.position.y = -H / 2 + TROFEU.h / 2 + 0.05; g.add(t.group);
    // contorno da base do troféu, sempre visível por cima
    const om = new THREE.MeshBasicMaterial({ color: C3.red, depthTest: false, transparent: true });
    const q = TROFEU.l / 2; const y0 = -H / 2 + 0.06; const P4 = [V3(-q, y0, -q), V3(q, y0, -q), V3(q, y0, q), V3(-q, y0, q)];
    P4.forEach((p, i) => { const r = rod(p, P4[(i + 1) % 4], 0.12, om); r.renderOrder = 10; g.add(r); });
    return { group: g, labels: lab, picks: [] };
  };
  ctrl.innerHTML = `<div class="tabs">${SUSPECTS.map((s) => `<button type="button" class="tab" data-s="${s.id}">${avatar(s.av, 34)}<span>${s.item}</span><i class="mk" data-m="${s.id}"></i></button>`).join('')}</div>
    <div class="viewbtns"><button type="button" class="vb on" data-v="3d">Vista 3D</button><button type="button" class="vb" data-v="top">Vista de cima</button></div>
    <p class="boxtxt"></p>
    <div class="fitq"><span>O troféu cabe em pé?</span><button type="button" class="fit" data-f="1">Cabe</button><button type="button" class="fit" data-f="0">Não cabe</button></div>`;
  const show = () => {
    const s = SUSPECTS.find((x) => x.id === cur);
    v.set(build(s)); if (top) v.face(0, Math.PI / 2 - 0.02); else v.face(0.6, 0.45);
    ctrl.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.s === cur));
    ctrl.querySelector('.boxtxt').innerHTML = `<b>${s.nome}</b> levou: ${s.item}, ${s.boxTxt}.`;
    ctrl.querySelectorAll('.fit').forEach((f) => f.classList.toggle('on', marks[cur] != null && String(+marks[cur]) === f.dataset.f));
    ctrl.querySelectorAll('.mk').forEach((m) => { const k = marks[m.dataset.m]; m.textContent = k == null ? '' : k ? '✓' : '✗'; m.className = 'mk ' + (k == null ? '' : k ? 'y' : 'n'); });
  };
  ctrl.addEventListener('click', (e) => {
    const t = e.target.closest('[data-s]'); if (t) { cur = t.dataset.s; show(); return; }
    const vb = e.target.closest('[data-v]'); if (vb) { top = vb.dataset.v === 'top'; ctrl.querySelectorAll('.vb').forEach((x) => x.classList.toggle('on', x === vb)); v.face(top ? 0 : 0.6, top ? Math.PI / 2 - 0.02 : 0.45); return; }
    const f = e.target.closest('[data-f]'); if (f && !locked) {
      marks[cur] = f.dataset.f === '1'; buzz();
      const i = SUSPECTS.findIndex((x) => x.id === cur); const next = SUSPECTS.slice(i + 1).concat(SUSPECTS.slice(0, i)).find((x) => marks[x.id] == null);
      if (next) cur = next.id; show();
    }
  });
  show();
  const fits = (s) => (s.box.k === 'box' ? TROFEU.l <= Math.min(s.box.a, s.box.b) && TROFEU.h <= s.box.c : TROFEU.l * Math.SQRT2 <= 2 * s.box.r && TROFEU.h <= s.box.h);
  return {
    check: () => {
      const miss = SUSPECTS.filter((s) => marks[s.id] == null);
      if (miss.length) return { ok: false, soft: true, msg: `Falta examinar: ${miss.map((s) => s.item).join(', ')}.` };
      const wrong = SUSPECTS.filter((s) => marks[s.id] !== fits(s));
      return wrong.length ? { ok: false, msg: `${wrong.length === 1 ? 'Um recipiente está' : wrong.length + ' recipientes estão'} com a conclusão errada. Use a vista de cima para os cilindros.` } : { ok: true };
    },
    reveal: () => { SUSPECTS.forEach((s) => { marks[s.id] = fits(s); }); show(); },
    lock: () => { locked = true; ctrl.querySelector('.fitq').classList.add('locked'); },
  };
}

/* perícia 3: o balde na câmera */
function labP3(stage, ctrl, c) {
  const v = new Viewer(stage, { yaw: 0.4, tilt: 0.35, auto: false });
  const g = new THREE.Group(); const R = 12; const H = 30;
  const b = buildSolid({ k: 'cyl', r: R, h: H, color: 0xB8C2CF, opacity: 0.3, lr: '12 cm' }); g.add(b.group);
  const water = new THREE.Mesh(new THREE.CylinderGeometry(R - 0.15, R - 0.15, 1, 64), M(0x3D8FD8, 0.75)); g.add(water);
  const ringM = new THREE.MeshBasicMaterial({ color: C3.red }); const mark = ring(R + 0.05, 0, 0.12, ringM); g.add(mark);
  const pano = new THREE.Mesh(new THREE.SphereGeometry(4.2, 20, 14), M(0x7A6A52, 1)); pano.scale.set(1.3, 0.6, 1.1); g.add(pano);
  const labels = b.labels.slice(); v.set({ group: g, labels, picks: [] });
  const tag = v.label('+2 cm', V3(R + 3, 0, 0), 'r fade');
  let lvl = 14;
  const setL = (L) => { water.scale.y = L; water.position.y = -H / 2 + L / 2; mark.position.y = -H / 2 + L; };
  setL(lvl); mark.visible = false; pano.position.set(0, H / 2 + 8, 0);
  ctrl.innerHTML = '<button type="button" class="btn play" data-play>▶ Ver a gravação das 19h02</button><div class="kpw"></div>';
  const lab = numLab(ctrl.querySelector('.kpw'), c);
  ctrl.querySelector('[data-play]').onclick = () => {
    const t0 = performance.now(); mark.visible = true; setL(14); mark.position.y = -H / 2 + 14; tag.el.classList.remove('on');
    const step = (now) => {
      const t = Math.min(1, (now - t0) / 2600);
      const py = H / 2 + 8 - Math.min(1, t * 1.6) * (H / 2 + 8 - (-H / 2 + 6)); pano.position.y = py;
      const L = t < 0.5 ? 14 : 14 + 2 * Math.min(1, (t - 0.5) / 0.4); setL(L); mark.position.y = -H / 2 + 14;
      if (t >= 0.9) { tag.pos.set(R + 3, -H / 2 + 15, 0); tag.el.classList.add('on'); }
      if (t < 1 && !v.dead) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  return lab;
}

/* perícia 5: planificação da pirâmide */
function labP5(stage, ctrl, c) {
  const v = new Viewer(stage, { yaw: 0.5, tilt: 0.55, auto: false, fit: 0.85 });
  const a = TROFEU.l / 2; const h = TROFEU.h; const g = TROFEU.g; const phi0 = Math.atan2(h, a);
  const grp = new THREE.Group();
  const base = new THREE.Mesh(new THREE.PlaneGeometry(TROFEU.l, TROFEU.l), M(0xC79A2E, 1)); base.rotation.x = -Math.PI / 2; base.position.y = -h / 2; grp.add(base);
  const sides = [];
  const corners = [V3(-a, -h / 2, a), V3(a, -h / 2, a), V3(a, -h / 2, -a), V3(-a, -h / 2, -a)];
  for (let i = 0; i < 4; i++) {
    const A = corners[i]; const B = corners[(i + 1) % 4]; const Mm = A.clone().add(B).multiplyScalar(0.5);
    const out = V3(Mm.x, 0, Mm.z).normalize();
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(9), 3));
    const mesh = new THREE.Mesh(geo, M(i === 0 ? 0xF2CF63 : GOLD, 1)); grp.add(mesh);
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(12), 3));
    const ln = new THREE.Line(lg, new THREE.LineBasicMaterial({ color: C3.ink })); grp.add(ln);
    sides.push({ A, B, Mm, out, geo, lg });
  }
  const apo = new THREE.BufferGeometry(); apo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(6), 3));
  grp.add(new THREE.Line(apo, new THREE.LineBasicMaterial({ color: C3.blue })));
  const set = (t) => {
    const al = (Math.PI - phi0) * (1 - t); let front = null;
    sides.forEach((s, i) => {
      const P = s.Mm.clone().add(s.out.clone().multiplyScalar(g * Math.cos(al))).add(V3(0, g * Math.sin(al), 0));
      const p = s.geo.attributes.position; p.setXYZ(0, s.A.x, s.A.y, s.A.z); p.setXYZ(1, s.B.x, s.B.y, s.B.z); p.setXYZ(2, P.x, P.y, P.z); p.needsUpdate = true; s.geo.computeVertexNormals(); s.geo.computeBoundingSphere();
      const q = s.lg.attributes.position; [s.A, s.B, P, s.A].forEach((X, k) => q.setXYZ(k, X.x, X.y, X.z)); q.needsUpdate = true;
      if (i === 0) front = P;
    });
    const s0 = sides[0]; const q = apo.attributes.position; q.setXYZ(0, s0.Mm.x, s0.Mm.y + 0.02, s0.Mm.z); q.setXYZ(1, front.x, front.y + 0.02, front.z); q.needsUpdate = true;
    lg1.pos.copy(s0.Mm.clone().add(front).multiplyScalar(0.5)).add(V3(1.6, 0.3, 0.6));
  };
  // enquadra a planificação aberta
  const frame = new THREE.Mesh(new THREE.BoxGeometry(TROFEU.l + 2 * g, 2, TROFEU.l + 2 * g), new THREE.MeshBasicMaterial({ visible: false })); frame.position.y = -h / 2; grp.add(frame);
  v.set({ group: grp, picks: [], labels: [{ text: '10 cm', pos: V3(-a - 1.6, -h / 2, 0), cls: 'r' }] });
  const lg1 = v.label('g', V3(0, 0, 0), 'b');
  set(0);
  ctrl.innerHTML = '<label class="range"><span>Abrir a pirâmide</span><input type="range" min="0" max="100" value="0"></label><div class="kpw"></div>';
  ctrl.querySelector('input').addEventListener('input', (e) => { const t = e.target.value / 100; set(t); if (t > 0.5) v.face(0.25, 1.0); });
  return numLab(ctrl.querySelector('.kpw'), c);
}

/* ---------- máquina de escrever ---------- */
function typewrite(el, text, speed) {
  if (!el) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = text; return; }
  let i = 0; el.textContent = ''; el.classList.add('typing');
  const iv = setInterval(() => { if (!el.isConnected) { clearInterval(iv); return; } i += 2; el.textContent = text.slice(0, i); if (i >= text.length) { clearInterval(iv); el.classList.remove('typing'); } }, speed || 18);
  el.addEventListener('click', () => { i = text.length; }, { once: true });
}

function teacherView() {
  return `<main class="page">${topbar()}<h2>Área do professor</h2>
    <div class="tcards"><section><h3>Modo projeção</h3><p>Letras e laboratório maiores para investigar com a turma no projetor.</p><button class="btn red" data-act="proj">${projection ? 'Desligar' : 'Ligar'}</button></section>
    <section><h3>Investigação da turma</h3><p>Começa um caso coletivo com o nome “Turma”.</p><div class="row">${TURMAS.map((t) => `<button class="btn ghost" data-act="classcase" data-t="${t}">Com a ${t}</button>`).join('')}</div></section></div>
    ${TURMAS.map((t) => `<h3>${t}</h3>${hallList(sortedHall().filter((h) => h.turma === t))}`).join('')}
    <details class="gab"><summary>Gabarito do caso</summary><ol>${CLUES.map((c) => `<li><b>${esc(c.titulo)}:</b> ${c.sol.join(' ')}</li>`).join('')}<li><b>Acusação:</b> Dani Freitas, com as provas 2 (teste do encaixe) e 5 (papel dourado).</li></ol></details>
    <p><button class="btn ghost" data-act="${S ? (S.finished ? 'closed' : 'board') : 'cover'}">← Voltar</button> <button class="btn ghost danger" data-act="wipe">Apagar caso atual e destaques deste computador</button></p></main>`;
}

function modalView() {
  if (!modal) return '';
  let inner = '';
  if (modal.type === 'found') { const c = CL[modal.id]; inner = `<p class="kick">PROVA ${c.n} ENCONTRADA</p><h3>${esc(c.nome)}</h3><p class="evid-big">${esc(c.texto)}</p><div class="row"><button class="btn red" data-act="close">Guardar no dossiê</button>${S.found.length === 5 ? '<button class="btn ghost" data-act="board">Ir para o quadro →</button>' : ''}</div>`; }
  if (modal.type === 'dep') { const s = SUS[modal.id]; const st = status(s.id); inner = `<div class="dep">${avatar(s.av, 110)}<div><p class="kick">DEPOIMENTO</p><h3>${esc(s.nome)}</h3><p class="muted">${esc(s.papel)} · saiu às ${s.saida}</p></div></div><p class="quote" id="quote"></p><p class="carry">🧳 Levava: <b>${esc(s.item)}</b>, ${esc(s.boxTxt)}.</p>${st ? `<p class="st-line ${st.k}">${st.t}: ${st.why}</p>` : ''}<div class="row"><button class="btn red" data-act="close">Fechar</button></div>`; }
  if (modal.type === 'pin') inner = `<h3>Área do professor</h3><form data-form="pin" autocomplete="off"><label>Senha<input name="pin" type="password" required></label>${modal.err ? '<p class="err">Senha incorreta.</p>' : ''}<div class="row"><button class="btn red" type="submit">Entrar</button><button class="btn ghost" type="button" data-act="close">Cancelar</button></div></form>`;
  return `<div class="veil" data-act="veil"><div class="modal ${modal.type}" role="dialog" aria-modal="true">${inner}</div></div>`;
}

const CLEANUP = [];
function render() {
  Viewer.all.forEach((v) => v.dispose()); clearKeyHandlers(); while (CLEANUP.length) CLEANUP.pop()(); lab = null;
  document.body.classList.toggle('proj', projection);
  const V = { cover: coverView, brief: briefView, scene: sceneView, board: boardView, notes: notesView, lab: labView, accuse: accuseView, closed: closedView, hall: hallView, teacher: teacherView }[screen];
  $app.innerHTML = V() + modalView();
  if (screen === 'brief') typewrite(document.getElementById('brief'), BRIEF, 16);
  if (screen === 'scene') bindLamp();
  if (screen === 'board') bindBoard();
  if (screen === 'lab') mountLab();
  afterModal();
}
function afterModal() {
  const f = $app.querySelector('.modal input'); if (f) f.focus();
  if (modal && modal.type === 'dep') typewrite(document.getElementById('quote'), `“${SUS[modal.id].dep}”`, 14);
}
function renderModal() { const o = $app.querySelector('.veil'); if (o) o.remove(); if (modal) { $app.insertAdjacentHTML('beforeend', modalView()); afterModal(); } }
const go = (s) => { screen = s; modal = null; render(); window.scrollTo(0, 0); };

function copyText() {
  const t = `O Caso da Pirâmide Dourada · Geometria Espacial\nDetetive: ${S.name} (${S.turma})\n${score()} de ${MAXPTS} pts · ${rank(score())}\nAcusação: ${S.acc.ok ? 'certa' : 'não sustentada'}\nCódigo: ${certCode()}\n${new Date().toLocaleString('pt-BR')}`;
  const done = () => { const b = $app.querySelector('[data-act="copy"]'); if (b) b.textContent = 'Copiado!'; };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => window.prompt('Copie o resultado:', t)); else window.prompt('Copie o resultado:', t);
}
function act(a, el, e) {
  switch (a) {
    case 'veil': if (e && e.target === el) { modal = null; renderModal(); } break;
    case 'close': modal = null; if (screen === 'scene') render(); else renderModal(); break;
    case 'teacher': modal = { type: 'pin' }; renderModal(); break;
    case 'hall': go('hall'); break;
    case 'cover': go('cover'); break;
    case 'scene': if (S) go('scene'); break;
    case 'board': if (S) go(S.finished ? 'closed' : 'board'); break;
    case 'notes': if (S) go('notes'); break;
    case 'closed': go('closed'); break;
    case 'find': { const id = el.dataset.id; if (!S.found.includes(id)) { S.found.push(id); save(); buzz(); } modal = { type: 'found', id }; render(); break; }
    case 'decoy': toast(DECOYS[+el.dataset.i].t); break;
    case 'dep': if (bindBoard.block) return; modal = { type: 'dep', id: el.dataset.id }; renderModal(); break;
    case 'lab': if (bindBoard.block) return; labId = el.dataset.id; go('lab'); break;
    case 'hint': { const r = cs(labId); r.hint = true; save(); document.getElementById('hintbox').hidden = false; el.disabled = true; break; }
    case 'check': doCheck(); break;
    case 'accuse': accSel = { s: null, e: new Set() }; go('accuse'); break;
    case 'accS': accSel.s = el.dataset.id; $app.querySelectorAll('.acc-p').forEach((b) => b.classList.toggle('on', b === el)); buzz(); break;
    case 'accE': { const id = el.dataset.id; if (accSel.e.has(id)) accSel.e.delete(id); else accSel.e.add(id); el.classList.toggle('on'); buzz(); break; }
    case 'judge': judge(); break;
    case 'copy': copyText(); break;
    case 'newcase': DB.cur = null; S = null; save(); go('cover'); break;
    case 'proj': projection = !projection; render(); break;
    case 'classcase': newCase('Turma', el.dataset.t); projection = true; go('brief'); break;
    case 'wipe': if (window.confirm('Apagar o caso atual e todos os destaques deste computador?')) { DB = { cur: null, hall: [] }; S = null; save(); go('cover'); } break;
    default: break;
  }
}
$app.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (el && !el.disabled && el.dataset.act) act(el.dataset.act, el, e); });
$app.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.pin-card, g[data-act]')) { e.preventDefault(); act(e.target.dataset.act, e.target, e); } });
$app.addEventListener('submit', (e) => {
  e.preventDefault(); const f = e.target;
  if (f.dataset.form === 'start') { const name = f.nome.value.trim().replace(/\s+/g, ' '); const tr = f.querySelector('input[name="turma"]:checked'); if (!name || !tr) return; DB.last = { name, turma: tr.value }; newCase(name, tr.value); go('brief'); }
  if (f.dataset.form === 'pin') { if (fnv('missao:' + norm(f.pin.value)) === PIN_HASH) go('teacher'); else { modal = { type: 'pin', err: true }; renderModal(); } }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal) { modal = null; renderModal(); } });
render();

</script>
</body>
</html>
