<style>
:root {
  --ink: #15161A; --ink2: #2A2C33; --y: #FFD21F; --y2: #FFE680; --bg: #ECEAE4; --card: #FAF9F6; --line: #D5D1C7; --mute: #6A6C74;
  --red: #E5322D; --blue: #2457F5; --green: #18A058;
  --gold: #D4A017; --silver: #8E97A6; --bronze: #B8733C;
  --fd: 'Archivo', system-ui, sans-serif; --fm: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--fd); font-size: 16px; line-height: 1.5; min-height: 100vh; font-stretch: 100%; }
button { font: inherit; cursor: pointer; color: inherit; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
#app { max-width: 1240px; margin: 0 auto; padding: 0 16px 40px; }
h2, h3, h4 { font-stretch: 85%; font-weight: 800; line-height: 1.1; margin: 0 0 .5em; letter-spacing: -.01em; }
.mono { font-family: var(--fm); }
.center { text-align: center; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }

.btn { border: 0; border-radius: 6px; padding: 12px 20px; font-weight: 800; font-stretch: 90%; letter-spacing: .01em; transition: transform .08s, background .15s; }
.btn.y { background: var(--y); color: var(--ink); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.btn.y:hover:not(:disabled) { background: var(--y2); }
.btn.y:active:not(:disabled) { transform: translateY(1px); }
.btn.ghost { background: transparent; border: 2px solid var(--ink); }
.btn.ghost:hover:not(:disabled) { background: var(--ink); color: var(--y); }
.btn.sm { padding: 6px 12px; font-size: 14px; }
.btn.big { font-size: 19px; padding: 15px 26px; }
.btn:disabled { opacity: .45; }
.btn small { font-family: var(--fm); font-weight: 500; opacity: .7; }
.btn.danger { border-color: var(--red); color: var(--red); margin-top: 24px; }
.lnk { background: none; border: 0; color: var(--y); font-weight: 700; display: inline-flex; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 6px; }
.lnk:hover { background: rgba(255,210,31,.12); }
.pict { width: 1.15em; height: 1.15em; vertical-align: -.2em; flex: none; }

/* placa do aeroporto */
.sign { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; background: var(--ink); color: #fff; margin: 0 -16px 18px; padding: 10px 16px; }
.sign .logo { height: 30px; width: auto; filter: brightness(0) invert(1); }
.sg { display: inline-flex; gap: 8px; align-items: center; background: var(--y); color: var(--ink); font-weight: 900; font-stretch: 80%; text-transform: uppercase; letter-spacing: .04em; padding: 4px 10px; border-radius: 3px; font-size: 14px; }
.sg-r { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }

/* split-flap */
.flaps { display: inline-flex; gap: 2px; }
.fl { display: inline-grid; place-items: center; width: 1.05em; height: 1.45em; background: linear-gradient(180deg, #23252B 0 49%, #15161A 51% 100%); color: #F4F2EC; font-family: var(--fm); font-weight: 700; border-radius: 3px; position: relative; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.fl::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.65); }
.fl.flip { animation: flip .055s linear; }
@keyframes flip { 0% { transform: scaleY(1); } 50% { transform: scaleY(.15); } 100% { transform: scaleY(1); } }
.flaps.big { font-size: clamp(30px, 7.2vw, 78px); gap: .06em; }
.flaps.big .fl { border-radius: .08em; }
.flaps.y .fl { color: var(--y); }

/* check-in */
.ck-hero { padding: 16px 0 10px; }
.ck-title { line-height: 1.12; }
.ck-lead { font-size: clamp(17px, 2vw, 20px); color: var(--ink2); max-width: 60ch; margin: 16px 0 0; }
.kiosk { margin: 26px 0; display: grid; justify-items: start; }
.k-screen { width: min(520px, 100%); background: var(--ink); color: #fff; border-radius: 16px; padding: 20px; border: 8px solid #2D2F36; box-shadow: 0 20px 40px rgba(0,0,0,.18); }
.k-h { margin: 0 0 14px; font-weight: 900; color: var(--y); text-transform: uppercase; letter-spacing: .08em; font-stretch: 80%; display: flex; gap: 8px; align-items: center; }
.k-screen form { display: grid; gap: 14px; }
.k-screen label { display: grid; gap: 6px; font-weight: 700; font-size: 14px; color: #CFCFD6; }
input:not([type=radio]):not([type=range]) { font: inherit; padding: 13px 14px; border-radius: 8px; border: 2px solid #3A3D45; background: #0E0F12; color: #fff; font-size: 18px; }
input:not([type=radio]):not([type=range]):focus { border-color: var(--y); outline: none; }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-weight: 700; font-size: 14px; margin-bottom: 6px; color: #CFCFD6; }
.seg { display: flex; gap: 8px; }
.seg label { flex: 1; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: block; text-align: center; padding: 12px; border-radius: 8px; border: 2px solid #3A3D45; font-family: var(--fm); font-weight: 700; color: #fff; }
.seg input:checked + span { background: var(--y); color: var(--ink); border-color: var(--y); }
.seg input:focus-visible + span { outline: 3px solid var(--blue); }
.k-slot { width: min(520px, 100%); height: 14px; background: #2D2F36; border-radius: 0 0 10px 10px; margin-top: -2px; }
.rules { list-style: none; padding: 0; margin: 0 0 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.rules li { background: var(--card); border-left: 6px solid var(--y); padding: 12px 14px; border-radius: 4px; color: var(--ink2); }
.rules b { font-family: var(--fm); display: block; color: var(--mute); font-size: 13px; }

/* cartão de embarque */
.printed .slot-wrap { position: relative; display: grid; justify-items: center; padding-top: 10px; overflow: hidden; }
.slot-mouth { width: min(700px, 96%); height: 16px; background: var(--ink); border-radius: 10px; position: relative; z-index: 2; }
.bpass { width: min(680px, 92%); display: grid; grid-template-columns: 1fr 150px; background: var(--card); border-radius: 0 0 14px 14px; box-shadow: 0 20px 40px rgba(0,0,0,.15); position: relative; margin-bottom: 24px; }
.bpass.print { animation: printout 2.2s cubic-bezier(.3,.7,.3,1) both; }
@keyframes printout { 0% { transform: translateY(-105%); } 100% { transform: translateY(0); } }
.bp-main { padding: 18px 20px; border-right: 2px dashed var(--line); }
.bp-air { margin: 0 0 10px; font-weight: 900; font-stretch: 80%; text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 8px; align-items: center; color: var(--blue); }
.bp-route { display: flex; align-items: center; gap: 16px; }
.bp-route > div { display: grid; }
.bp-route small, .bp-f dt, .bp-stub small { font-family: var(--fm); font-size: 11px; color: var(--mute); letter-spacing: .1em; }
.bp-route b { font-size: 48px; font-weight: 900; font-stretch: 75%; line-height: 1; }
.bp-route span { color: var(--mute); font-size: 14px; }
.bp-pl { font-size: 28px; color: var(--ink); flex: 1; text-align: center; border-bottom: 2px dotted var(--line); }
.bp-pl .pict { transform: rotate(90deg); }
.bp-f { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; margin: 16px 0 0; }
.bp-f dd { margin: 0; font-weight: 800; font-size: 17px; overflow-wrap: anywhere; }
.bp-stub { padding: 18px 14px; display: grid; align-content: start; gap: 4px; }
.bp-stub b { font-size: 34px; font-weight: 900; font-stretch: 75%; }
.bars { display: flex; gap: 2px; height: 56px; margin-top: 8px; }
.bars i { background: var(--ink); display: block; }

/* saguão */
.hud { display: grid; grid-template-columns: 2fr repeat(3, 1fr) 1.4fr; gap: 2px; background: var(--ink); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
.hud > div { background: var(--card); padding: 10px 14px; display: grid; }
.hud small { font-family: var(--fm); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.hud b { font-size: 22px; font-weight: 900; font-stretch: 85%; line-height: 1.15; }
.hud .tg { font-family: var(--fm); font-size: 12px; color: var(--mute); }
.hud .here-box { background: var(--y); }
.hud .here-box small { color: var(--ink2); }
.hub-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 16px; align-items: start; }
.board { background: #0C0D10; border-radius: 12px; padding: 14px; color: #fff; box-shadow: 0 16px 36px rgba(0,0,0,.2); }
.bhead { display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-stretch: 80%; letter-spacing: .1em; color: var(--y); margin-bottom: 10px; font-size: 20px; }
.bhead span:first-child { display: flex; gap: 8px; align-items: center; }
.clock { color: #fff; font-size: 16px; }
.bcols, .brow { display: grid; grid-template-columns: 6.6em minmax(0, 1fr) auto auto; gap: 10px; align-items: center; }
.c-dst { overflow: hidden; }
.bcols span:nth-child(3) { width: 2.3em; } .bcols span:nth-child(4) { width: 10.4em; }
.bcols { font-family: var(--fm); font-size: 11px; color: #8D909A; letter-spacing: .12em; padding: 0 8px 6px; border-bottom: 1px solid #23252B; }
.brows { display: grid; }
.brow { background: none; border: 0; padding: 7px 8px; font-size: 14px !important; border-bottom: 1px solid #1B1D22; text-align: left; font-size: 15px; border-left: 4px solid var(--rc, transparent); border-radius: 2px; }
.brow:hover { background: #17181D; }
.brow .fl { width: 1.04em; height: 1.5em; }
.c-dst .flaps, .c-st .flaps { flex-wrap: nowrap; }
.c-st.go .fl { color: var(--y); }
.c-st.cur .fl { color: #7FB2FF; }
.c-st.t3 .fl { color: #FFD76A; }
.c-st.t2 .fl { color: #D8DCE3; }
.c-st.t1 .fl { color: #E7A673; }
.c-st.t0 .fl { color: #9A9DA6; }
.brow.home { margin-top: 10px; border: 2px solid var(--y); border-radius: 6px; }
.mapcard { background: #DCE7F2; border-radius: 12px; padding: 10px; }
.brmap { width: 100%; height: auto; display: block; }
.brmap .st { fill: color-mix(in srgb, var(--rc) 22%, #fff); stroke: #fff; stroke-width: 1.2; transition: fill .2s; }
.brmap .st:hover { fill: color-mix(in srgb, var(--rc) 38%, #fff); }
.brmap .route { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 1 6; stroke-linecap: round; }
.brmap .hp circle { fill: var(--ink); stroke: var(--y); stroke-width: 3; }
.brmap .hp text, .brmap .mpt { font-family: var(--fm); font-size: 12px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 3px; }
.mp { cursor: pointer; }
.mp .mpc { fill: #fff; stroke: var(--ink); stroke-width: 2.5; transition: r .15s; }
.mp .mpi { color: var(--ink); }
.mp:hover .mpc, .mp:focus-visible .mpc { r: 17; fill: var(--y); }
.mp:focus { outline: none; }
.mp.done .mpc { fill: var(--ink); }
.mp.done .mpi { color: var(--y); }
.mp.done.t3 .mpc { stroke: var(--gold); stroke-width: 4; }
.mp.done.t2 .mpc { stroke: var(--silver); stroke-width: 4; }
.mp.done.t1 .mpc { stroke: var(--bronze); stroke-width: 4; }
.here { fill: none; stroke: var(--red); stroke-width: 3; stroke-dasharray: 5 5; animation: spin 7s linear infinite; transform-box: fill-box; transform-origin: center; pointer-events: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 13px; color: var(--ink2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
.credit { margin: 4px 0 0; text-align: right; font-size: 11px; color: var(--mute); }

/* voo */
.flight { position: fixed; inset: 0; z-index: 30; overflow: hidden; padding: 16px; background: radial-gradient(900px 500px at 50% 0%, #1F2A44, #0B0E16); color: #fff; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; }
.fl-hud { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; font-family: var(--fm); }
.fl-hud > div { display: grid; }
.fl-hud small { color: #8D9BB8; font-size: 11px; letter-spacing: .14em; }
.fl-hud b { font-size: 20px; color: var(--y); }
.fl-hud .btn { margin-left: auto; color: #fff; border-color: #fff; }
.fl-stage { perspective: 1100px; display: grid; place-items: center; overflow: hidden; }
.brmap.tilt { max-width: 640px; transform: rotateX(38deg) scale(1.02); transform-origin: 50% 60%; filter: drop-shadow(0 30px 40px rgba(0,0,0,.5)); }
.brmap.tilt .st { fill: #2A3550; stroke: #4A5A80; }
.fpath { fill: none; stroke: var(--y); stroke-width: 3; stroke-linecap: round; }
.fdot { fill: #fff; } .fdot.to { fill: var(--y); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { r: 13; } }
.fplane { color: #fff; }
.fplane path { fill: #fff; }
.fl-cap { text-align: center; font-size: 18px; color: #C9D3E8; }

/* portão */
.gsign { display: grid; grid-template-columns: auto auto 1fr auto; gap: 12px; align-items: center; background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 10px; border-bottom: 6px solid var(--rc); }
.gback { width: 40px; height: 40px; border-radius: 6px; background: #2A2C33; border: 0; color: #fff; font-size: 20px; }
.gpict { width: 52px; height: 52px; display: grid; place-items: center; background: var(--y); color: var(--ink); border-radius: 6px; font-size: 32px; }
.gname small { display: block; font-family: var(--fm); font-size: 12px; letter-spacing: .12em; color: #A9ACB5; }
.gname b { font-size: clamp(26px, 4vw, 40px); font-weight: 900; font-stretch: 78%; line-height: 1; text-transform: uppercase; }
.gsteps { list-style: none; display: flex; gap: 6px; margin: 0; padding: 0; }
.gsteps li { display: flex; align-items: center; gap: 6px; background: #22242A; padding: 5px 10px 5px 5px; border-radius: 999px; font-size: 13px; color: #A9ACB5; }
.gsteps span { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: #3A3D45; font-family: var(--fm); font-weight: 700; color: #fff; }
.gsteps em { font-style: normal; white-space: nowrap; }
.gsteps li.cur { background: #fff; color: var(--ink); }
.gsteps li.cur span { background: var(--y); color: var(--ink); }
.gsteps li.ok span { background: var(--green); }
.gsteps li.no span { background: var(--red); }
.postal { margin: 12px 0; color: var(--ink2); display: flex; gap: 8px; align-items: baseline; }
.lab { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, .95fr); gap: 16px; align-items: start; }
.stage { position: relative; height: min(64vh, 560px); min-height: 340px; background: radial-gradient(circle at 50% 40%, #FFFFFF, #E4E1D8 75%); border-radius: 14px; border: 2px solid var(--ink); overflow: hidden; background-image: radial-gradient(circle at 50% 40%, rgba(255,255,255,.95), rgba(228,225,216,.95) 75%), repeating-linear-gradient(0deg, transparent 0 31px, rgba(21,22,26,.05) 31px 32px), repeating-linear-gradient(90deg, transparent 0 31px, rgba(21,22,26,.05) 31px 32px); }
.stage.empty { display: none; }
.stage.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.v3d canvas { width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
.v3d canvas:active { cursor: grabbing; }
.v3d-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; background: var(--ink); color: #fff; font-family: var(--fm); font-size: 13px; font-weight: 700; padding: 2px 7px; border-radius: 4px; white-space: nowrap; will-change: transform; }
.lbl.r { background: var(--red); }
.lbl.b { background: var(--blue); }
.lbl.big { font-size: 18px; padding: 4px 10px; background: var(--y); color: var(--ink); border: 2px solid var(--ink); }
.lbl.fade { opacity: 0; transition: opacity .3s; }
.lbl.fade.on { opacity: 1; }
.v3d-tip { position: absolute; left: 12px; bottom: 10px; font-family: var(--fm); font-size: 12px; color: var(--mute); background: rgba(255,255,255,.8); padding: 3px 8px; border-radius: 4px; pointer-events: none; transition: opacity .4s; }
.v3d-tip.gone { opacity: 0; }
.nogl-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); padding: 20px; text-align: center; }
.panel { background: var(--card); border-radius: 14px; padding: 16px; border: 2px solid var(--line); display: grid; gap: 12px; }
.kick { margin: 0; font-family: var(--fm); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.prompt { font-size: 17px; }
.hintbox { background: #FFF6CC; border-left: 5px solid var(--y); padding: 10px 12px; border-radius: 4px; }
.fb:empty { display: none; }
.fb { border-radius: 8px; padding: 12px 14px; border: 2px solid; }
.fb.warn { border-color: var(--line); background: #fff; }
.fb.no { border-color: var(--red); background: #FFF0EF; }
.fb.ok { border-color: var(--green); background: #EAF8F0; }
.fb small { display: block; color: var(--mute); margin-top: 4px; }
.fb-h b { font-stretch: 85%; font-size: 18px; margin-right: 4px; }
.fb.ok .fb-h b { color: var(--green); }
.steps { margin: 8px 0 0; padding-left: 22px; }
.steps li { margin: 3px 0; }
.gact { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.gact .btn.y { margin-left: auto; min-width: 150px; }

/* teclado */
.kp { display: grid; gap: 8px; }
.kp-screen { background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 14px; }
.kp-l { font-family: var(--fm); font-size: 11px; letter-spacing: .12em; color: #8D909A; text-transform: uppercase; }
.kp-v { display: flex; align-items: baseline; gap: 4px; font-family: var(--fm); min-height: 46px; }
.kp-num { font-size: 34px; color: var(--y); font-weight: 700; }
.kp-num.empty { width: 18px; border-bottom: 3px solid var(--y); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.kp-pi { font-size: 30px; color: var(--y); font-style: normal; }
.kp-u { color: #CFCFD6; font-size: 18px; margin-left: 6px; }
.kp-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.kp-keys button { padding: 10px 0; font-family: var(--fm); font-size: 22px; font-weight: 700; border-radius: 6px; border: 2px solid var(--line); background: #fff; box-shadow: inset 0 -3px 0 var(--line); }
.kp-keys button:hover { border-color: var(--ink); }
.kp-keys button:active { transform: translateY(2px); box-shadow: none; }
.locked .kp-keys button, .locked button { pointer-events: none; opacity: .55; }

.counter { display: flex; align-items: baseline; gap: 10px; background: var(--ink); color: #fff; border-radius: 8px; padding: 10px 14px; }
.counter b { font-family: var(--fm); font-size: 40px; color: var(--y); line-height: 1; }
.counter.small { padding: 12px 14px; font-weight: 700; }
.swatch { display: flex; gap: 8px; align-items: center; color: var(--mute); font-size: 14px; }
.swatch i { width: 18px; height: 18px; background: var(--y); border: 2px solid var(--ink); border-radius: 3px; }
.steppers { display: grid; gap: 8px; }
.stp { display: grid; grid-template-columns: 1fr 44px 64px 44px; align-items: center; gap: 6px; }
.stp span { font-weight: 700; }
.stp button { height: 44px; border-radius: 6px; border: 2px solid var(--ink); background: #fff; font-size: 22px; font-weight: 800; }
.stp button:hover { background: var(--y); }
.stp b { font-family: var(--fm); font-size: 26px; text-align: center; }
.packinfo { font-weight: 700; }
.packinfo b { font-family: var(--fm); font-size: 24px; }
.pk-w.bad { color: var(--red); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--fm); font-size: 22px; font-weight: 700; background: var(--ink); color: #fff; padding: 12px; border-radius: 8px; }
.eq-op { color: var(--y); }
.slot { min-width: 64px; height: 48px; border-radius: 6px; border: 2px dashed #6A6C74; background: transparent; color: #fff; font-family: var(--fm); font-size: 22px; font-weight: 700; }
.slot.full { border: 2px solid var(--y); background: var(--y); color: var(--ink); }
.tray { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { min-width: 60px; height: 48px; padding: 0 12px; border-radius: 6px; border: 2px solid var(--ink); background: #fff; font-family: var(--fm); font-size: 21px; font-weight: 700; box-shadow: 0 3px 0 var(--ink); touch-action: none; user-select: none; }
.tile:hover:not(:disabled) { background: var(--y2); }
.tile.used { opacity: .25; box-shadow: none; }
.tile.ghost { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; display: grid; place-items: center; background: var(--y); }
.eq-tip { margin: 0; font-size: 13px; color: var(--mute); }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg2 button { padding: 10px; border: 2px solid var(--ink); background: #fff; border-radius: 6px; font-weight: 700; font-size: 14px; }
.seg2 button.on { background: var(--ink); color: var(--y); }
.range { display: grid; gap: 4px; font-weight: 700; }
.range input { width: 100%; accent-color: var(--ink); height: 28px; }
.range.big input { height: 36px; }
.readout { font-family: var(--fm); font-size: 18px; background: var(--ink); color: #fff; padding: 10px 12px; border-radius: 8px; }
.readout b { color: var(--y); }
.q-sub { margin: 4px 0 0; }
.shapes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.shape { display: grid; justify-items: center; gap: 4px; padding: 10px 4px; border: 2px solid var(--line); background: #fff; border-radius: 8px; font-size: 13px; font-weight: 700; }
.shape svg { width: 46px; height: 46px; fill: #EFEADF; stroke: var(--ink); stroke-width: 3; }
.shape:hover { border-color: var(--ink); }
.shape.on { border-color: var(--ink); background: var(--y); }
.shape.on svg { fill: #fff; }
.shapes.locked { pointer-events: none; }

svg.pour { width: 100%; height: 100%; display: block; }
.pour .pl { font-family: var(--fm); font-size: 13px; font-weight: 700; fill: var(--ink); }
.pour .pc { font-family: var(--fm); font-size: 15px; font-weight: 700; fill: var(--ink); }
.pour #cnt { fill: var(--red); font-size: 20px; }
.pour .vessel { fill: #fff; } .pour .vessel-o { fill: none; stroke: var(--ink); stroke-width: 3; }
.pour .water { fill: #6E3B8E; }
.pour .liq { fill: #6E3B8E; }
.pour .cupo { fill: none; stroke: var(--ink); stroke-width: 2; }
.pour .cup.full .cupo { stroke: var(--green); stroke-width: 2.6; }
.pour .cal { fill: #fff; stroke: var(--ink); stroke-width: 2; }
.pour .calt { fill: var(--ink); }
.pour .caln { font-family: var(--fm); font-size: 13px; font-weight: 700; fill: var(--ink); }
.pour .calx { fill: transparent; }
.pour .cup.used .calx { fill: rgba(36,87,245,.35); }
.pour .cup.part .calx { fill: rgba(229,50,45,.18); }

.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -10px; width: 9px; height: 14px; border-radius: 2px; animation: fall 1.6s cubic-bezier(.2,.6,.4,1) forwards; }
@keyframes fall { to { transform: translate(var(--x), 620px) rotate(var(--r)); opacity: .2; } }

/* carimbo */
.ppage { display: grid; grid-template-columns: 1fr 1fr; background: #F4EFE2; border-radius: 16px; border: 2px solid var(--ink); overflow: hidden; position: relative; background-image: repeating-linear-gradient(0deg, transparent 0 27px, rgba(21,22,26,.05) 27px 28px); }
.ppage::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 2px dashed var(--line); }
.pp-l, .pp-r { padding: 24px; position: relative; }
.pp-l h2 { font-size: 44px; text-transform: uppercase; font-stretch: 75%; }
.mini { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 4px; }
.mini li { display: flex; justify-content: space-between; border-bottom: 1px dotted var(--line); padding: 4px 0; }
.mini li.ok b { color: var(--green); } .mini li.no b { color: var(--red); }
.mini b { font-family: var(--fm); }
.pp-r { display: grid; place-items: center; min-height: 300px; }
.inkstamp { --c: var(--rc, var(--ink)); width: 230px; height: 230px; border-radius: 50%; border: 5px double var(--c); color: var(--c); display: grid; place-items: center; align-content: center; gap: 2px; text-align: center; transform: rotate(var(--rot, -10deg)); font-weight: 900; font-stretch: 75%; mix-blend-mode: multiply; animation: slam .5s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes slam { 0% { transform: rotate(var(--rot, -10deg)) scale(2.4); opacity: 0; } 100% { transform: rotate(var(--rot, -10deg)) scale(1); opacity: .92; } }
.inkstamp .is-ic { width: 54px; height: 54px; }
.inkstamp b { font-size: 26px; letter-spacing: .04em; line-height: 1; padding: 0 12px; }
.inkstamp .is-top, .inkstamp .is-bot { font-family: var(--fm); font-size: 12px; letter-spacing: .14em; font-weight: 700; }
.inkstamp.t3 { box-shadow: 0 0 0 7px rgba(212,160,23,.25); }
.inkstamp.t0 { filter: grayscale(1); opacity: .6; }
.inkstamp.sm { width: 132px; height: 132px; border-width: 4px; animation-duration: .45s; }
.inkstamp.sm b { font-size: 15px; } .inkstamp.sm .is-ic { width: 30px; height: 30px; } .inkstamp.sm .is-top, .inkstamp.sm .is-bot { font-size: 10px; }
.inkstamp.empty { border: 2px dashed var(--line); color: var(--mute); transform: none; animation: none; mix-blend-mode: normal; }
.stampwall { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; padding: 10px; }
.stampwall .inkstamp { animation-delay: calc(var(--i, 0) * 60ms); }

/* desembarque */
.arr-head { padding: 10px 0; }
.cert { background: #F4EFE2; border: 2px solid var(--ink); border-radius: 16px; padding: 20px; margin: 16px 0; }
.cert-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: var(--ink); border-radius: 8px; overflow: hidden; }
.cert-stats div { background: var(--card); padding: 10px; display: grid; text-align: center; }
.cert-stats small { font-family: var(--fm); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.cert-stats b { font-size: 30px; font-weight: 900; font-stretch: 80%; }
.cert-stats span { font-size: 12px; color: var(--mute); }
.code { text-align: center; font-family: var(--fm); color: var(--mute); }

/* páginas */
.page { max-width: 820px; margin: 0 auto; }
.note, .empty { color: var(--mute); }
.hall { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 2px; background: #0C0D10; border-radius: 10px; padding: 8px; }
.hall li { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 12px; align-items: center; padding: 8px 10px; color: #fff; border-bottom: 1px solid #1B1D22; }
.hall .pos { font-family: var(--fm); color: var(--y); font-weight: 700; }
.hall small { font-family: var(--fm); color: #8D909A; margin-left: 6px; }
.hall .pz { font-family: var(--fm); font-weight: 700; color: var(--y); }
.hall .dt { font-family: var(--fm); font-size: 12px; color: #8D909A; }
.tcards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
.tcards section { background: var(--card); border-radius: 10px; padding: 16px; border: 2px solid var(--line); }
.tcards p { color: var(--mute); margin-top: 0; }
.th { margin-top: 18px; }
.gab { margin-top: 18px; background: var(--card); border-radius: 10px; padding: 12px 16px; border: 2px solid var(--line); }
.gab summary { font-weight: 800; cursor: pointer; }
.gab h4 { margin: 14px 0 4px; }
.gab ol { margin: 0; padding-left: 22px; color: var(--ink2); }

/* modal */
.veil { position: fixed; inset: 0; background: rgba(12,13,16,.6); display: grid; place-items: center; padding: 16px; z-index: 20; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(460px, 100%); background: var(--card); border-radius: 14px; padding: 20px; box-shadow: 0 30px 80px rgba(0,0,0,.35); max-height: 90vh; overflow: auto; }
.modal.passport { width: min(760px, 100%); background: #F4EFE2; }
.modal h3 { font-size: 24px; display: flex; gap: 8px; align-items: center; }
.modal form { display: grid; gap: 12px; }
.modal label { display: grid; gap: 6px; font-weight: 700; }
.modal input:not([type=radio]) { background: #fff; color: var(--ink); border-color: var(--line); }
.err { color: var(--red); margin: 0; }
.mini-pass { background: var(--ink); color: #fff; border-radius: 10px; padding: 16px; margin-bottom: 14px; display: grid; gap: 4px; border-left: 10px solid var(--y); }
.mini-pass small { font-family: var(--fm); color: #A9ACB5; letter-spacing: .1em; }
.mini-pass b { font-size: 40px; font-weight: 900; font-stretch: 75%; display: flex; gap: 14px; align-items: center; color: var(--y); }
.mini-pass b .pict { transform: rotate(90deg); color: #fff; }
.mini-pass span { font-weight: 700; }

/* projeção */
body.proj #app { max-width: 1600px; }
body.proj .prompt { font-size: 22px; }
body.proj .stage { height: 70vh; }
body.proj .lbl { font-size: 18px; }

@media (max-width: 980px) {
  .hub-grid, .lab { grid-template-columns: 1fr; }
  .hud { grid-template-columns: 1fr 1fr 1fr; }
  .hud > div:first-child, .hud .here-box { grid-column: span 3; }
  .gsign { grid-template-columns: auto auto 1fr; }
  .gsteps { grid-column: 1 / -1; overflow-x: auto; }
  .stage { height: 52vh; min-height: 300px; }
}
@media (max-width: 600px) {
  .sign { flex-wrap: wrap; gap: 8px; }
  .sg { font-size: 12px; }
  .sg-r { width: 100%; justify-content: flex-start; margin-left: 0; }
  .bcols, .brow { grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; }
  .c-voo, .bcols span:first-child { display: none; }
  .brow { font-size: 11px !important; padding: 6px 4px; }
  .bcols span:nth-child(3) { width: 2.2em; } .bcols span:nth-child(4) { width: 9.2em; }
  .flaps { gap: 1px; }
  .bpass { grid-template-columns: 1fr; }
  .bp-main { border-right: 0; border-bottom: 2px dashed var(--line); }
  .bp-f { grid-template-columns: 1fr 1fr; }
  .bp-route b { font-size: 38px; }
  .ppage { grid-template-columns: 1fr; }
  .ppage::after { display: none; }
  .pp-l h2 { font-size: 34px; }
  .cert-stats { grid-template-columns: repeat(2, 1fr); }
  .cert-stats div:first-child { grid-column: span 2; }
  .tcards { grid-template-columns: 1fr; }
  .gsteps em { display: none; }
  .gsteps li { padding: 4px; }
  .shapes { grid-template-columns: repeat(2, 1fr); }
  .stage { height: 46vh; min-height: 280px; }
  .hall li { grid-template-columns: 30px 1fr auto; } .hall .dt { display: none; }
  .inkstamp { width: 190px; height: 190px; }
  .inkstamp.sm { width: 110px; height: 110px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .bpass.print { transform: none; } }

[hidden]{display:none!important}

/* =========================================================
   DESAFIOS INTERATIVOS
   Cada widget recebe (stage, ctrl, ch) e devolve
   { check(): {ok, msg, soft} | Promise, reveal(), lock() }
   ========================================================= */
const numFmt = (v, d) => Number(v).toLocaleString('pt-BR', { maximumFractionDigits: d == null ? 2 : d });
const parseBR = (s) => { const t = String(s).replace(/\s/g, '').replace(',', '.'); return t === '' || t === '.' ? NaN : Number(t); };

/* ---------- teclado numérico ---------- */
function keypad(host, o) {
  const opt = Object.assign({ unit: '', pi: false, int: false, label: 'Sua resposta' }, o || {});
  let val = ''; let locked = false;
  host.innerHTML = `<div class="kp">
    <div class="kp-screen"><span class="kp-l">${opt.label}</span><div class="kp-v"><b class="kp-num">&nbsp;</b>${opt.pi ? '<i class="kp-pi">π</i>' : ''}<span class="kp-u">${opt.unit}</span></div></div>
    <div class="kp-keys">${['7', '8', '9', '4', '5', '6', '1', '2', '3', opt.int ? '' : ',', '0', '⌫'].map((k) => (k ? `<button type="button" data-k="${k}" ${k === '⌫' ? 'aria-label="Apagar"' : ''}>${k}</button>` : '<span></span>')).join('')}</div>
  </div>`;
  const num = host.querySelector('.kp-num');
  const show = () => { num.textContent = val || ' '; num.classList.toggle('empty', !val); };
  const press = (k) => {
    if (locked) return;
    if (k === '⌫') val = val.slice(0, -1);
    else if (k === ',') { if (!val.includes(',')) val = (val || '0') + ','; } else if (val.replace(',', '').length < 9) val = val === '0' ? k : val + k;
    show(); if (opt.onChange) opt.onChange(val);
  };
  host.querySelector('.kp-keys').addEventListener('click', (e) => { const b = e.target.closest('button[data-k]'); if (b) press(b.dataset.k); });
  const kb = (e) => {
    if (locked || e.target.tagName === 'INPUT' || document.querySelector('.veil')) return;
    if (/^[0-9]$/.test(e.key)) press(e.key); else if ((e.key === ',' || e.key === '.') && !opt.int) press(','); else if (e.key === 'Backspace') press('⌫'); else return;
    e.preventDefault();
  };
  document.addEventListener('keydown', kb);
  KEYHANDLERS.push(() => document.removeEventListener('keydown', kb));
  show();
  return { get: () => parseBR(val), raw: () => val, set: (v) => { val = String(v).replace('.', ','); show(); }, lock: () => { locked = true; host.classList.add('locked'); }, unlock: () => { locked = false; host.classList.remove('locked'); }, clear: () => { val = ''; show(); } };
}
const KEYHANDLERS = [];
function clearKeyHandlers() { while (KEYHANDLERS.length) KEYHANDLERS.pop()(); }

/* ---------- 1. contar arestas ---------- */
function wCount(stage, ctrl, ch) {
  const v = new Viewer(stage); const sol = buildSolid(ch.solid); v.set(sol);
  const hits = []; sol.group.traverse((m) => { if (m.isMesh && m.userData.edge != null && m.material.visible === false) hits.push(m); });
  v.picks = hits;
  const marked = new Set();
  ctrl.innerHTML = `<div class="counter"><b class="cn">0</b><span>arestas marcadas</span></div><button type="button" class="btn ghost sm" data-w="clear">Desmarcar todas</button>`;
  const paint = () => {
    sol.edgeMeshes.forEach((m, i) => { const on = marked.has(i); m.material.color.setHex(on ? C3.yellow : C3.ink); m.scale.set(on ? 2 : 1, 1, on ? 2 : 1); });
    ctrl.querySelector('.cn').textContent = marked.size;
  };
  let locked = false;
  v.onPick = (id, o) => { if (locked) return; const i = o.userData.edge; if (marked.has(i)) marked.delete(i); else marked.add(i); paint(); buzz(); };
  ctrl.querySelector('[data-w="clear"]').onclick = () => { if (!locked) { marked.clear(); paint(); } };
  return {
    check: () => (marked.size === ch.total ? { ok: true } : { ok: false, msg: marked.size === 0 ? 'Toque nas arestas para marcá-las.' : 'Ainda falta aresta! Gire o sólido e procure as escondidas atrás.', soft: marked.size === 0 }),
    reveal: () => { sol.edges.forEach((_, i) => marked.add(i)); paint(); },
    lock: () => { locked = true; },
  };
}

/* ---------- 2. resposta numérica ---------- */
function wNum(stage, ctrl, ch) {
  if (ch.solid) { const v = new Viewer(stage); v.set(buildSolid(ch.solid)); } else stage.classList.add('empty');
  const kp = keypad(ctrl, { unit: ch.unit, pi: ch.pi });
  return {
    check: () => {
      const x = kp.get();
      if (Number.isNaN(x)) return { ok: false, soft: true, msg: 'Digite um número no teclado.' };
      if (Math.abs(x - ch.ans) <= ch.tol) return { ok: true };
      if (ch.pi && Math.abs(x - ch.ans * 3.14) < 0.6) return { ok: false, soft: true, msg: 'A resposta é em função de π: digite só o número que multiplica o π (o π já está na tela).' };
      return { ok: false, msg: 'Não confere. Revise a conta e tente de novo.' };
    },
    reveal: () => kp.set(String(ch.ans)),
    lock: () => kp.lock(),
  };
}

/* ---------- 3. carregar o contêiner ---------- */
function wPack(stage, ctrl, ch) {
  const [Lx, Ly, Lz] = ch.box; const c = ch.cube;
  const v = new Viewer(stage, { yaw: 0.55, tilt: 0.5, auto: false });
  const g = new THREE.Group();
  const shell = poly([V3(-Lx / 2, -Lz / 2, -Ly / 2), V3(Lx / 2, -Lz / 2, -Ly / 2), V3(Lx / 2, -Lz / 2, Ly / 2), V3(-Lx / 2, -Lz / 2, Ly / 2), V3(-Lx / 2, Lz / 2, -Ly / 2), V3(Lx / 2, Lz / 2, -Ly / 2), V3(Lx / 2, Lz / 2, Ly / 2), V3(-Lx / 2, Lz / 2, Ly / 2)],
    [[0, 1, 2, 3], [0, 1, 5, 4], [3, 0, 4, 7]], { color: 0xF7B38A, opacity: 0.35, size: 3 });
  g.add(shell.group);
  // arestas da frente (contorno completo)
  const em = new THREE.MeshStandardMaterial({ color: C3.ink });
  [[V3(-Lx / 2, Lz / 2, Ly / 2), V3(Lx / 2, Lz / 2, Ly / 2)], [V3(Lx / 2, -Lz / 2, Ly / 2), V3(Lx / 2, Lz / 2, Ly / 2)], [V3(Lx / 2, Lz / 2, -Ly / 2), V3(Lx / 2, Lz / 2, Ly / 2)], [V3(Lx / 2, -Lz / 2, -Ly / 2), V3(Lx / 2, Lz / 2, -Ly / 2)], [V3(-Lx / 2, Lz / 2, -Ly / 2), V3(Lx / 2, Lz / 2, -Ly / 2)]].forEach(([a, b]) => g.add(rod(a, b, 0.04, em)));
  const MAX = 30 * 10 * 10;
  const im = new THREE.InstancedMesh(new THREE.BoxGeometry(c * 0.9, c * 0.9, c * 0.9), new THREE.MeshStandardMaterial({ roughness: 0.5 }), MAX);
  im.count = 0; g.add(im);
  const labels = [{ text: '12 m', pos: V3(0, -Lz / 2 - 0.5, Ly / 2 + 0.3) }, { text: '2,4 m', pos: V3(Lx / 2 + 0.9, -Lz / 2, 0) }, { text: '2,5 m', pos: V3(-Lx / 2 - 0.8, 0, Ly / 2) }];
  v.set({ group: g, labels, picks: [] });
  const n = { x: 4, y: 2, z: 2 };
  const lim = { x: 30, y: 10, z: 10 };
  const names = { x: 'Comprimento', y: 'Largura', z: 'Altura' };
  ctrl.innerHTML = `<div class="steppers">${['x', 'y', 'z'].map((k) => `<div class="stp"><span>${names[k]}</span><button type="button" data-s="${k}" data-d="-1" aria-label="Menos">−</button><b data-v="${k}">${n[k]}</b><button type="button" data-s="${k}" data-d="1" aria-label="Mais">+</button></div>`).join('')}</div>
    <div class="packinfo"><b class="pk-n">0</b> caixas <span class="pk-w"></span></div>`;
  const m4 = new THREE.Matrix4(); const col = new THREE.Color();
  const eps = 1e-9; let locked = false;
  const draw = () => {
    let k = 0; let out = false;
    for (let i = 0; i < n.x; i++) for (let j = 0; j < n.y; j++) for (let l = 0; l < n.z; l++) {
      const ox = (i + 1) * c > Lx + eps; const oy = (j + 1) * c > Ly + eps; const oz = (l + 1) * c > Lz + eps;
      m4.makeTranslation(-Lx / 2 + c / 2 + i * c, -Lz / 2 + c / 2 + l * c, -Ly / 2 + c / 2 + j * c);
      im.setMatrixAt(k, m4);
      const bad = ox || oy || oz; if (bad) out = true;
      im.setColorAt(k, col.setHex(bad ? C3.red : ((i + j + l) % 2 ? 0xC98A3E : 0xDDA35A)));
      k++;
    }
    im.count = k; im.instanceMatrix.needsUpdate = true; if (im.instanceColor) im.instanceColor.needsUpdate = true;
    ['x', 'y', 'z'].forEach((q) => { ctrl.querySelector(`[data-v="${q}"]`).textContent = n[q]; });
    ctrl.querySelector('.pk-n').textContent = numFmt(k);
    ctrl.querySelector('.pk-w').textContent = out ? '· tem caixa para fora!' : '';
    ctrl.querySelector('.pk-w').classList.toggle('bad', out);
    return out;
  };
  ctrl.querySelector('.steppers').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-s]'); if (!b || locked) return;
    const q = b.dataset.s; n[q] = Math.max(0, Math.min(lim[q], n[q] + +b.dataset.d)); draw(); buzz();
  });
  draw();
  return {
    check: () => {
      const out = (n.x * c > Lx + eps) || (n.y * c > Ly + eps) || (n.z * c > Lz + eps);
      if (out) return { ok: false, msg: 'Tem caixa para fora do contêiner (em vermelho)! Ajuste as quantidades.' };
      if (n.x === ch.ans[0] && n.y === ch.ans[1] && n.z === ch.ans[2]) return { ok: true, msg: `${numFmt(n.x * n.y * n.z)} caixas no contêiner!` };
      return { ok: false, msg: 'Tudo cabe, mas ainda dá para colocar mais caixas em alguma direção.' };
    },
    reveal: () => { n.x = ch.ans[0]; n.y = ch.ans[1]; n.z = ch.ans[2]; draw(); },
    lock: () => { locked = true; ctrl.classList.add('locked'); },
  };
}

/* ---------- 4. prever e simular (encher recipientes) ---------- */
function wPour(stage, ctrl, ch) {
  const total = ch.from.cap; const each = ch.to.cap; const full = Math.floor(total / each + 1e-9); const rest = total / each - full;
  const days = ch.to.mode === 'days';
  const cups = full + (rest > 0.001 ? 1 : 0);
  const cols = cups <= 12 ? Math.min(6, cups) : cups <= 30 ? 8 : 12;
  const rows = Math.ceil(cups / cols);
  const area = { x: 250, y: 64, w: 330, h: 270 };
  const cw = Math.min(56, area.w / cols); const chh = Math.min(64, area.h / rows); const s = Math.min(cw, chh * 0.85);
  let cupsSvg = '';
  for (let i = 0; i < cups; i++) {
    const cx = area.x + (i % cols) * cw + cw / 2; const cy = area.y + Math.floor(i / cols) * chh + chh / 2;
    const w = s * 0.78; const h = s * 0.9; const x0 = cx - w / 2; const y0 = cy - h / 2;
    if (days) {
      cupsSvg += `<g class="cup" data-i="${i}"><rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="4" class="cal"/><rect x="${x0}" y="${y0}" width="${w}" height="${h * 0.24}" rx="3" class="calt"/><text x="${cx}" y="${y0 + h * 0.72}" text-anchor="middle" class="caln">${i + 1}</text><rect class="calx" x="${x0}" y="${y0}" width="${w}" height="${h}" rx="4"/></g>`;
    } else {
      const p = `M${x0},${y0} L${x0 + w},${y0} L${x0 + w * 0.86},${y0 + h} L${x0 + w * 0.14},${y0 + h} Z`;
      cupsSvg += `<g class="cup" data-i="${i}"><clipPath id="cc${i}"><path d="${p}"/></clipPath><rect class="liq" clip-path="url(#cc${i})" x="${x0 - 2}" y="${y0 + h}" width="${w + 4}" height="0" data-y="${y0}" data-h="${h}"/><path d="${p}" class="cupo"/></g>`;
    }
  }
  const vx = 40; const vy = 70; const vw = 160; const vh = 240;
  stage.innerHTML = `<svg class="pour" viewBox="0 0 600 360" role="img" aria-label="Simulação de enchimento">
    <text x="${vx + vw / 2}" y="40" text-anchor="middle" class="pl">${ch.from.nome.toUpperCase()} · ${ch.from.label}</text>
    <clipPath id="vclip"><rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" rx="18"/></clipPath>
    <rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" rx="18" class="vessel"/>
    <rect id="water" clip-path="url(#vclip)" x="${vx}" y="${vy + 10}" width="${vw}" height="${vh - 10}" class="water"/>
    <rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" rx="18" class="vessel-o"/>
    <text x="${area.x}" y="40" class="pl">${days ? 'DIAS DE CONSUMO' : ch.to.nome.toUpperCase()} · ${ch.to.label}</text>
    <text x="580" y="40" text-anchor="end" class="pc">${days ? 'dias completos' : 'cheios'}: <tspan id="cnt">0</tspan></text>
    ${cupsSvg}
    <path id="stream" d="" class="stream"/>
  </svg>`;
  const kp = keypad(ctrl, { unit: days ? 'dias' : ch.to.nome, int: true, label: 'Sua previsão' });
  const run = () => new Promise((res) => {
    const water = stage.querySelector('#water'); const cnt = stage.querySelector('#cnt');
    const per = Math.max(60, Math.min(420, 3600 / cups)); const T = per * (full + rest) + 200;
    const t0 = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - t0) / T); const used = t * (full + rest);
      water.setAttribute('y', vy + 10 + (vh - 10) * (used / (total / each))); water.setAttribute('height', (vh - 10) * (1 - used / (total / each)));
      let done = 0;
      stage.querySelectorAll('.cup').forEach((g, i) => {
        const f = Math.max(0, Math.min(1, used - i)); if (f >= 0.999) done++;
        if (days) { g.classList.toggle('used', f >= 0.999); g.classList.toggle('part', f > 0 && f < 0.999); } else {
          const r = g.querySelector('.liq'); const y = +r.dataset.y; const h = +r.dataset.h; r.setAttribute('y', y + h * (1 - f)); r.setAttribute('height', h * f);
          g.classList.toggle('full', f >= 0.999);
        }
      });
      cnt.textContent = done;
      if (t < 1) requestAnimationFrame(step); else setTimeout(res, 350);
    };
    requestAnimationFrame(step);
  });
  return {
    single: true,
    check: async () => {
      const x = kp.get();
      if (Number.isNaN(x)) return { ok: false, soft: true, msg: 'Faça sua previsão no teclado antes de ver a simulação.' };
      kp.lock(); await run();
      return x === ch.ans ? { ok: true, msg: `A simulação confirmou: ${ch.ans} ${days ? 'dias' : ch.to.nome}!` } : { ok: false, msg: `A simulação mostrou ${ch.ans} ${days ? 'dias completos' : ch.to.nome + ' cheios'}, e você previu ${x}.` };
    },
    reveal: () => {},
    lock: () => kp.lock(),
  };
}

/* ---------- 5. montar a fórmula ---------- */
function wFormula(stage, ctrl, ch) {
  if (ch.solid) { const v = new Viewer(stage); v.set(buildSolid(ch.solid)); }
  const slots = Array(ch.slots).fill(null);
  const tiles = ch.tiles.map((t, i) => ({ t, i, used: false }));
  let locked = false;
  const render = () => {
    ctrl.innerHTML = `<div class="eq"><span class="eq-l">${ch.lhs} =</span>${slots.map((s, k) => `${k ? `<span class="eq-op">${ch.op}</span>` : ''}<button type="button" class="slot ${s != null ? 'full' : ''}" data-slot="${k}">${s != null ? tiles[s].t : ''}</button>`).join('')}${ch.tail ? `<span class="eq-op">${ch.tail}</span>` : ''}</div>
      <div class="tray">${tiles.map((x) => `<button type="button" class="tile ${x.used ? 'used' : ''}" data-tile="${x.i}" ${x.used ? 'disabled' : ''}>${x.t}</button>`).join('')}</div>
      <p class="eq-tip">Arraste as peças para os espaços ou toque nelas.</p>`;
  };
  render();
  const place = (ti, k) => {
    if (locked || tiles[ti].used) return;
    if (k == null) k = slots.findIndex((s) => s == null);
    if (k < 0) return;
    if (slots[k] != null) tiles[slots[k]].used = false;
    slots[k] = ti; tiles[ti].used = true; render(); buzz();
  };
  // a primeira posição fica com índice 0, então use null para vazio
  ctrl.addEventListener('click', (e) => {
    if (locked || drag.moved) return;
    const s = e.target.closest('[data-slot]'); if (s) { const k = +s.dataset.slot; if (slots[k] != null) { tiles[slots[k]].used = false; slots[k] = null; render(); } return; }
    const t = e.target.closest('[data-tile]'); if (t) place(+t.dataset.tile);
  });
  const drag = { el: null, ti: null, moved: false };
  ctrl.addEventListener('pointerdown', (e) => {
    const t = e.target.closest('[data-tile]'); if (!t || locked || t.disabled) return;
    drag.ti = +t.dataset.tile; drag.moved = false; drag.x = e.clientX; drag.y = e.clientY;
  });
  window.addEventListener('pointermove', drag.mv = (e) => {
    if (drag.ti == null) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) {
      drag.moved = true; drag.el = document.createElement('div'); drag.el.className = 'tile ghost'; drag.el.textContent = tiles[drag.ti].t; document.body.appendChild(drag.el);
    }
    if (drag.el) drag.el.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;
  });
  window.addEventListener('pointerup', drag.up = (e) => {
    if (drag.ti == null) return;
    if (drag.el) { drag.el.remove(); drag.el = null; const under = document.elementFromPoint(e.clientX, e.clientY); const s = under && under.closest('[data-slot]'); if (s) place(drag.ti, +s.dataset.slot); }
    drag.ti = null; setTimeout(() => { drag.moved = false; }, 0);
  });
  KEYHANDLERS.push(() => { window.removeEventListener('pointermove', drag.mv); window.removeEventListener('pointerup', drag.up); });
  return {
    check: () => {
      if (slots.some((s) => s == null)) return { ok: false, soft: true, msg: 'Complete todos os espaços da conta.' };
      const a = slots.map((s) => tiles[s].t).sort().join('|'); const b = ch.ans.slice().sort().join('|');
      return a === b ? { ok: true, msg: `${ch.lhs} = ${ch.result}` } : { ok: false, msg: 'Essa conta não dá o volume. Reveja as medidas escolhidas.' };
    },
    reveal: () => {
      tiles.forEach((x) => { x.used = false; }); const pool = tiles.slice();
      ch.ans.forEach((t, k) => { const x = pool.find((p) => p.t === t && !p.used); x.used = true; slots[k] = x.i; });
      render();
    },
    lock: () => { locked = true; ctrl.classList.add('locked'); },
  };
}

/* ---------- 6. pintar faces ---------- */
function wPaint(stage, ctrl, ch) {
  const v = new Viewer(stage, { tilt: 0.25 }); const sol = buildSolid(ch.solid); v.set(sol);
  v.picks = sol.faceMeshes;
  const on = new Set(); let locked = false;
  const base = new THREE.Color(ch.solid.color);
  ctrl.innerHTML = '<div class="counter"><b class="cn">0</b><span>faces pintadas</span></div><div class="swatch"><i></i> toque numa face para pintar ou despintar</div>';
  const paint = () => { sol.faceMeshes.forEach((m, i) => { m.material.color.copy(on.has(i) ? new THREE.Color(C3.yellow) : base); m.material.opacity = on.has(i) ? 1 : 0.9; }); ctrl.querySelector('.cn').textContent = on.size; };
  v.onPick = (id, o) => { if (locked) return; const i = o.userData.face; if (on.has(i)) on.delete(i); else on.add(i); paint(); buzz(); };
  paint();
  return {
    check: () => {
      if (!on.size) return { ok: false, soft: true, msg: 'Toque nas faces para pintá-las.' };
      const need = new Set(ch.need);
      if (on.has(0)) return { ok: false, msg: 'A face de baixo está colada na mesa: ela não recebe tinta.' };
      if (on.size === need.size && [...on].every((x) => need.has(x))) return { ok: true, msg: '5 faces pintadas: topo e 4 laterais.' };
      return { ok: false, msg: 'Ainda falta face para pintar. Gire a torre e confira.' };
    },
    reveal: () => { on.clear(); ch.need.forEach((x) => on.add(x)); paint(); },
    lock: () => { locked = true; },
  };
}

/* ---------- ícones de formas ---------- */
const SHAPES = {
  circulo: ['Círculo', '<circle cx="30" cy="30" r="22"/>'],
  retangulo: ['Retângulo', '<rect x="6" y="14" width="48" height="32" rx="2"/>'],
  triangulo: ['Triângulo', '<path d="M30 7 L54 51 L6 51 Z"/>'],
  quadrado: ['Quadrado', '<rect x="10" y="10" width="40" height="40" rx="2"/>'],
  setor: ['Setor circular', '<path d="M30 32 L50 12 A26 26 0 1 1 10 12 Z"/>'],
};
function choicesHTML(list) {
  return `<div class="shapes" role="radiogroup">${list.map((k) => `<button type="button" class="shape" data-shape="${k}" role="radio" aria-checked="false"><svg viewBox="0 0 60 60" aria-hidden="true">${SHAPES[k][1]}</svg><span>${SHAPES[k][0]}</span></button>`).join('')}</div>`;
}
function bindChoices(host) {
  let sel = null;
  host.addEventListener('click', (e) => { const b = e.target.closest('[data-shape]'); if (!b || host.classList.contains('locked')) return; sel = b.dataset.shape; host.querySelectorAll('[data-shape]').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b); }); buzz(); });
  return { get: () => sel, set: (k) => { sel = k; host.querySelectorAll('[data-shape]').forEach((x) => x.classList.toggle('on', x.dataset.shape === k)); } };
}

/* ---------- 7. fatiar ---------- */
function wSlice(stage, ctrl, ch) {
  const v = new Viewer(stage, { yaw: 0.5, tilt: 0.35 });
  const r = ch.solid.r; const h = ch.solid.h; const g = new THREE.Group();
  const body = new THREE.Group(); g.add(body);
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 72, 1, true), M(0xE9B27A, 0.55)); cyl.rotation.z = Math.PI / 2; body.add(cyl);
  const capM = M(0xB5452F, 0.9);
  [-1, 1].forEach((s) => { const cp = new THREE.Mesh(new THREE.CircleGeometry(r, 72), capM); cp.rotation.y = s * Math.PI / 2; cp.position.x = s * h / 2; body.add(cp); body.add(ring(r, s * h / 2, 0.02, new THREE.MeshStandardMaterial({ color: C3.ink }), true)); });
  // espiral do bolo de rolo nas pontas (decoração)
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0x2457F5, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false })); g.add(plane);
  const secM = new THREE.MeshBasicMaterial({ color: C3.yellow }); const sec = new THREE.Group(); g.add(sec);
  v.set({ group: g, picks: [], labels: [] });
  let mode = 'cross'; let p = 0.3;
  ctrl.innerHTML = `<div class="seg2"><button type="button" data-m="cross" class="on">Corte paralelo às bases</button><button type="button" data-m="long">Corte no comprimento</button></div>
    <label class="range"><span>Posição da faca</span><input type="range" min="-100" max="100" value="30"></label>
    <p class="q-sub">Que forma tem a face cortada <b>quando o corte é paralelo às bases</b>?</p>${choicesHTML(ch.choices)}`;
  const choice = bindChoices(ctrl.querySelector('.shapes'));
  const update = () => {
    while (sec.children.length) disposeDeep(sec.children.pop());
    if (mode === 'cross') {
      const x = p * (h / 2) * 0.95;
      plane.scale.set(r * 3, r * 3, 1); plane.rotation.set(0, Math.PI / 2, 0); plane.position.set(x, 0, 0);
      const disc = new THREE.Mesh(new THREE.CircleGeometry(r, 64), new THREE.MeshBasicMaterial({ color: C3.yellow, transparent: true, opacity: 0.85, side: THREE.DoubleSide }));
      disc.rotation.y = Math.PI / 2; disc.position.x = x; sec.add(disc); sec.add(ring(r, x, 0.035, secM, true));
    } else {
      const y = p * r * 0.9; const w = Math.sqrt(r * r - y * y);
      plane.scale.set(h * 1.25, r * 3, 1); plane.rotation.set(-Math.PI / 2, 0, 0); plane.position.set(0, y, 0);
      const rect = new THREE.Mesh(new THREE.PlaneGeometry(h, 2 * w), new THREE.MeshBasicMaterial({ color: C3.yellow, transparent: true, opacity: 0.85, side: THREE.DoubleSide }));
      rect.rotation.x = -Math.PI / 2; rect.position.y = y; sec.add(rect);
      [[V3(-h / 2, y, -w), V3(h / 2, y, -w)], [V3(-h / 2, y, w), V3(h / 2, y, w)], [V3(-h / 2, y, -w), V3(-h / 2, y, w)], [V3(h / 2, y, -w), V3(h / 2, y, w)]].forEach(([a, b]) => sec.add(rod(a, b, 0.035, secM)));
    }
  };
  ctrl.querySelector('.seg2').addEventListener('click', (e) => { const b = e.target.closest('[data-m]'); if (!b) return; mode = b.dataset.m; ctrl.querySelectorAll('[data-m]').forEach((x) => x.classList.toggle('on', x === b)); update(); });
  ctrl.querySelector('input[type=range]').addEventListener('input', (e) => { p = e.target.value / 100; update(); });
  update();
  return {
    check: () => { const s = choice.get(); if (!s) return { ok: false, soft: true, msg: 'Escolha uma das formas.' }; return s === ch.ans ? { ok: true } : { ok: false, msg: 'Não é essa. Use o corte paralelo às bases e observe a face amarela.' }; },
    reveal: () => choice.set(ch.ans),
    lock: () => { ctrl.querySelector('.shapes').classList.add('locked'); },
  };
}

/* ---------- 8. planificar (desenrolar) ---------- */
function wUnfold(stage, ctrl, ch) {
  const v = new Viewer(stage, { yaw: 0.35, tilt: 0.3, auto: false, fit: 0.9 });
  const u = ch.shape === 'cyl' ? unrollCylinder(ch.r, ch.h, ch.color) : unrollCone(ch.r, ch.h);
  u.set(1); v.set(u); u.set(0);
  let dl = [];
  if (ch.dims) {
    dl = [v.label(ch.dims[0], V3(0, -ch.h / 2 + Math.max(ch.r, ch.h) * 0.07, ch.r + 0.01), 'r fade'), v.label(ch.dims[1], V3(Math.PI * ch.r + Math.max(ch.r, ch.h) * 0.1, 0, ch.r), 'r fade')];
  }
  ctrl.innerHTML = `<label class="range big"><span>${ch.shape === 'cyl' ? 'Desenrolar a lateral' : 'Abrir a lona'}</span><input type="range" min="0" max="100" value="0"></label><div class="w-sub"></div>`;
  const sub = ctrl.querySelector('.w-sub');
  let kp = null; let choice = null;
  if (ch.choices) { sub.innerHTML = `<p class="q-sub">Planificada, a lateral forma um:</p>${choicesHTML(ch.choices)}`; choice = bindChoices(sub.querySelector('.shapes')); } else kp = keypad(sub, { unit: ch.unit, label: 'Área lateral' });
  ctrl.querySelector('input[type=range]').addEventListener('input', (e) => {
    const t = e.target.value / 100; u.set(t); v.face(0, 0.12 * (1 - t)); dl.forEach((L) => L.el.classList.toggle('on', t > 0.9));
  });
  return {
    check: () => {
      if (choice) { const s = choice.get(); if (!s) return { ok: false, soft: true, msg: 'Escolha uma das figuras.' }; return s === ch.ans ? { ok: true } : { ok: false, msg: 'Não é essa. Abra a lona até o fim e observe a figura.' }; }
      const x = kp.get(); if (Number.isNaN(x)) return { ok: false, soft: true, msg: 'Digite a área no teclado.' };
      return Math.abs(x - ch.ans) <= ch.tol ? { ok: true } : { ok: false, msg: 'Não confere. Desenrole até o fim: a lateral é um retângulo de 2πr por h.' };
    },
    reveal: () => { if (choice) choice.set(ch.ans); else kp.set(String(ch.ans)); const r = ctrl.querySelector('input[type=range]'); r.value = 100; r.dispatchEvent(new Event('input')); },
    lock: () => { if (kp) kp.lock(); if (choice) ctrl.querySelector('.shapes').classList.add('locked'); },
  };
}

/* ---------- 9. escolher o sólido ---------- */
function wPick3d(stage, ctrl, ch) {
  const v = new Viewer(stage, { yaw: 0, tilt: 0.35, auto: false, fit: 1.0 });
  const kinds = [{ k: 'cone', r: 0.8, h: 2, color: 0xF6C9C0 }, { k: 'cyl', r: 0.45, h: 2.2, color: 0xBFD9F7 }, { k: 'pyr', n: 4, R: 0.95, H: 1.9, rot: Math.PI / 4, color: 0xD7DCF7 }, { k: 'prism', n: 6, R: 0.75, H: 2, color: 0xD9F0E3 }];
  const ansIdx = 1;
  const g = new THREE.Group(); const items = [];
  kinds.forEach((sp, i) => {
    const s = buildSolid(sp); const holder = new THREE.Group(); holder.add(s.group); holder.position.x = (i - 1.5) * 2.3; g.add(holder);
    s.group.traverse((m) => { if (m.isMesh) { m.userData.pick = 's' + i; m.userData.item = i; } });
    items.push(holder);
  });
  const picks = []; g.traverse((m) => { if (m.isMesh && m.material.visible !== false) picks.push(m); });
  v.set({ group: g, picks, labels: [] });
  const marker = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.05, 8, 64), new THREE.MeshBasicMaterial({ color: C3.yellow })); marker.rotation.x = Math.PI / 2; marker.visible = false; g.add(marker);
  let sel = null; let locked = false;
  v.frame.push(() => { items.forEach((h, i) => { h.rotation.y += i === sel ? 0.03 : 0.008; }); });
  ctrl.innerHTML = '<div class="counter small"><span class="pk">Nenhum sólido escolhido</span></div><p class="eq-tip">Toque em um dos quatro sólidos.</p>';
  const names = ['o cone', 'o cilindro', 'a pirâmide', 'o prisma'];
  v.onPick = (id, o) => { if (locked) return; sel = o.userData.item; marker.visible = true; marker.position.set(items[sel].position.x, -1.15, 0); ctrl.querySelector('.pk').textContent = `Você escolheu ${names[sel]}`; buzz(); };
  return {
    check: () => (sel == null ? { ok: false, soft: true, msg: 'Toque em um dos sólidos.' } : sel === ansIdx ? { ok: true, msg: 'Isso: o cilindro.' } : { ok: false, msg: `Não é ${names[sel]}. Observe: a bomba tem a mesma seção circular do começo ao fim.` }),
    reveal: () => { sel = ansIdx; marker.visible = true; marker.position.set(items[sel].position.x, -1.15, 0); },
    lock: () => { locked = true; },
  };
}

/* ---------- 10. qual medida é a altura ---------- */
function wMeasure(stage, ctrl) {
  const v = new Viewer(stage, { yaw: 0.45, tilt: 0.3 });
  const r = 1.5; const h = 10;
  const s = buildSolid({ k: 'cyl', r, h, color: 0xB9D7F7, opacity: 0.45, horiz: true });
  const g = new THREE.Group(); g.add(s.group);
  const defs = [
    { name: 'o diâmetro', a: V3(h / 2 + 0.6, -r, 0), b: V3(h / 2 + 0.6, r, 0), lab: V3(h / 2 + 1.3, 0, 0) },
    { name: 'o comprimento', a: V3(-h / 2, -r - 0.6, 0.6), b: V3(h / 2, -r - 0.6, 0.6), lab: V3(0, -r - 1.25, 0.6) },
    { name: 'o raio', a: V3(-h / 2, 0, 0), b: V3(-h / 2, r, 0), lab: V3(-h / 2 - 0.9, r / 2, 0) },
  ];
  const ansIdx = 1; const mats = []; const picks = [];
  defs.forEach((d, i) => {
    const m = new THREE.MeshStandardMaterial({ color: C3.red }); mats.push(m);
    g.add(rod(d.a, d.b, 0.07, m)); g.add(ball(d.a, 0.13, m)); g.add(ball(d.b, 0.13, m));
    const hit = rod(d.a, d.b, 0.45, new THREE.MeshBasicMaterial({ visible: false })); hit.userData.pick = 'm' + i; hit.userData.item = i; g.add(hit); picks.push(hit);
  });
  v.set({ group: g, picks, labels: defs.map((d, i) => ({ text: 'ABC'[i], pos: d.lab, cls: 'big' })) });
  let sel = null; let locked = false;
  ctrl.innerHTML = '<div class="counter small"><span class="pk">Toque em uma das medidas A, B ou C</span></div>';
  const show = () => mats.forEach((m, i) => m.color.setHex(i === sel ? C3.yellow : C3.red));
  v.onPick = (id, o) => { if (locked) return; sel = o.userData.item; show(); ctrl.querySelector('.pk').textContent = `Medida ${'ABC'[sel]}: ${defs[sel].name}`; buzz(); };
  return {
    check: () => (sel == null ? { ok: false, soft: true, msg: 'Toque em uma das medidas.' } : sel === ansIdx ? { ok: true } : { ok: false, msg: `${defs[sel].name[0].toUpperCase() + defs[sel].name.slice(1)} não liga as duas bases circulares.` }),
    reveal: () => { sel = ansIdx; show(); },
    lock: () => { locked = true; },
  };
}

/* ---------- 11. projetar o silo ---------- */
function wBuild(stage, ctrl, ch) {
  const v = new Viewer(stage, { yaw: 0.5, tilt: 0.3, auto: false, fit: 0.66 });
  const g = new THREE.Group(); const unit = cylinder({ r: 1, h: 1, color: 0xF5D9A8 }, []); g.add(unit.group);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 64), new THREE.MeshBasicMaterial({ color: 0xE3DED2 })); floor.rotation.x = -Math.PI / 2; g.add(floor);

  cityId = id; const R = resOf(id); const ci = R.findIndex((r) => !r.done);
  if (ci < 0) { go('stamp'); return; }
  gate = { ci, busy: false }; save(); go('gate');
}
const ptsFor = (r) => Math.max(30, 100 - 35 * r.wrong - (r.hint ? 20 : 0));
async function doCheck() {
  if (!gate || gate.busy || !gate.w) return;
  const R = resOf(cityId); const r = R[gate.ci]; const ch = CITY[cityId].ch[gate.ci];
  const fb = document.getElementById('fb'); const act = document.getElementById('gact');
  gate.busy = true; act.querySelectorAll('button').forEach((b) => { b.disabled = true; });
  let res;
  try { res = await gate.w.check(); } catch (e) { res = { ok: false, soft: true, msg: 'Algo deu errado. Tente de novo.' }; }
  gate.busy = false;
  if (!res.ok && res.soft) { fb.className = 'fb warn'; fb.innerHTML = res.msg; act.querySelectorAll('button').forEach((b) => { b.disabled = false; }); return; }
  if (res.ok) {
    r.pts = ptsFor(r); r.solved = true; r.done = true; save();
    gate.w.lock(); showSolution(true, res.msg, r.pts, ch);
  } else {
    r.wrong++;
    if (gate.w.single || r.wrong >= 3) { r.done = true; r.pts = 0; save(); gate.w.lock(); gate.w.reveal(); showSolution(false, res.msg, 0, ch); } else {
      save(); fb.className = 'fb no'; fb.innerHTML = `${res.msg} <small>Tentativas restantes: ${3 - r.wrong}. Este acerto agora vale ${ptsFor(r)} milhas.</small>`;
      const st = document.getElementById('stage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake');
      act.querySelectorAll('button').forEach((b) => { b.disabled = false; });
      if (r.hint) act.querySelector('[data-act=hint]').disabled = true;
    }
  }
}
function showSolution(ok, msg, pts, ch) {
  const fb = document.getElementById('fb'); const act = document.getElementById('gact');
  const last = gate.ci === CITY[cityId].ch.length - 1 || resOf(cityId).every((x) => x.done);
  fb.className = 'fb ' + (ok ? 'ok' : 'no');
  fb.innerHTML = `<div class="fb-h">${ok ? `<b>+${pts} milhas</b> ${msg || 'Resposta certa!'}` : `<b>Sem milhas desta vez.</b> ${msg || ''}`}</div><ol class="steps">${ch.sol.map((s) => `<li>${s}</li>`).join('')}</ol>`;
  act.innerHTML = `<button class="btn y" data-act="nextch">${last ? 'Carimbar o passaporte →' : 'Próximo desafio →'}</button>`;
  if (ok) confetti(document.getElementById('stage'));
  fb.scrollIntoView && fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  document.querySelector('.gsteps li.cur')?.classList.add(ok ? 'ok' : 'no');
}
function confetti(host) {
  if (!host || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#FFD21F', '#E5322D', '#2457F5', '#18A058', '#15161A'];
  box.innerHTML = [...Array(36)].map((_, i) => `<i style="left:${Math.random() * 100}%;background:${cols[i % 5]};animation-delay:${Math.random() * 0.25}s;--x:${(Math.random() - 0.5) * 160}px;--r:${Math.random() * 720}deg"></i>`).join('');
  host.appendChild(box); setTimeout(() => box.remove(), 1800);
}

function stampView() {
  const c = CITY[cityId]; const t = tier(cityId); const p = cityPts(cityId);
  return `<main class="stampscreen" style="--rc:${REGIONS[c.reg].cor}">
    ${signBar()}
    <section class="ppage">
      <div class="pp-l"><p class="kick">Passaporte · ${esc(S.name)}</p><h2>${esc(c.nome)}</h2><p>${p} de ${c.ch.length * 100} milhas neste portão.</p>
        <ul class="mini">${c.ch.map((x, k) => { const r = resOf(cityId)[k]; return `<li class="${r.solved ? 'ok' : 'no'}">${esc(x.titulo)}<b>${r.pts}</b></li>`; }).join('')}</ul>
        <button class="btn y" data-act="hub">Voltar ao saguão →</button></div>
      <div class="pp-r"><div class="inkstamp t${t}"><span class="is-top">${c.iata} · ${c.uf}</span>${pict(c.icon, 'is-ic')}<b>${esc(c.nome.toUpperCase())}</b><span class="is-bot">${TIER[t]} · ${new Date().toLocaleDateString('pt-BR')}</span></div></div>
    </section>
  </main>`;
}

function certCode() { const base = `${norm(S.name)}|${S.turma}|${total()}|g9-volta-aero`; return (fnv(base) % 46656).toString(36).toUpperCase().padStart(3, '0') + '-' + (fnv(base + '#') % 46656).toString(36).toUpperCase().padStart(3, '0'); }
function arrivalView() {
  const per = [0, 0, 0, 0]; CITIES.forEach((c) => { per[tier(c.id)]++; });
  return `<main class="arrival">
    ${signBar()}
    <section class="arr-head">${flap('DESEMBARQUE', 11, 'big')}<p class="ck-lead">${esc(S.name)} completou a Volta ao Brasil e voltou para Itajubá.</p></section>
    <section class="cert">
      <div class="cert-stats"><div><small>Milhas</small><b>${fmt(total())}</b><span>de ${fmt(MAXPTS)}</span></div><div><small>Voados</small><b>${fmt(S.km)}</b><span>km</span></div><div><small>Ouro</small><b>${per[3]}</b></div><div><small>Prata</small><b>${per[2]}</b></div><div><small>Bronze</small><b>${per[1]}</b></div></div>
      <div class="stampwall">${CITIES.map((c, i) => { const t = tier(c.id); return `<div class="inkstamp sm t${t}" style="--rc:${REGIONS[c.reg].cor};--rot:${((fnv(c.id) % 24) - 12)}deg"><span class="is-top">${c.iata}</span>${pict(c.icon, 'is-ic')}<b>${esc(c.nome.toUpperCase())}</b><span class="is-bot">${TIER[t]}</span></div>`; }).join('')}</div>
      <p class="code">Turma ${esc(S.turma)} · assento ${S.seat} · código <b>${certCode()}</b></p>
    </section>
    <p class="center row"><button class="btn y" data-act="copy">Copiar resultado</button><button class="btn ghost" data-act="hall">Passageiros de destaque</button><button class="btn ghost" data-act="hubview">Rever o saguão</button><button class="btn ghost" data-act="newtrip">Nova viagem</button></p>
  </main>`;
}

const sortedHall = () => DB.hall.slice().sort((a, b) => b.pts - a.pts || a.t - b.t);
function hallList(rows) {
  if (!rows.length) return '<p class="empty">Nenhum passageiro desembarcou neste computador ainda.</p>';
  return `<ol class="hall">${rows.map((h, k) => `<li><span class="pos">${String(k + 1).padStart(2, '0')}</span><span class="nm">${esc(h.name)} <small>${esc(h.turma)}</small></span><span class="pz">${fmt(h.pts)} mi</span><span class="dt">${esc(h.date)}</span></li>`).join('')}</ol>`;
}
function hallView() { return `<main class="page">${signBar(`<button class="lnk" data-act="${S ? 'hub' : 'checkin'}">← Voltar</button>`)}<h2>Passageiros de destaque</h2><p class="note">Quem completou a viagem neste computador.</p>${hallList(sortedHall().slice(0, 20))}</main>`; }
function teacherView() {
  return `<main class="page">${signBar(`<button class="lnk" data-act="${S ? 'hub' : 'checkin'}">← Voltar</button>`)}
    <h2>Área do professor</h2>
    <div class="tcards">
      <section><h3>Modo projeção</h3><p>Letras e laboratório 3D maiores para resolver no projetor.</p><button class="btn y" data-act="proj">${projection ? 'Desligar' : 'Ligar'}</button></section>
      <section><h3>Viagem da turma</h3><p>Começa uma viagem coletiva com o nome “Turma”.</p><div class="row">${TURMAS.map((t) => `<button class="btn ghost" data-act="classtrip" data-t="${t}">Com a ${t}</button>`).join('')}</div></section>
    </div>
    ${TURMAS.map((t) => `<h3 class="th">${t}</h3>${hallList(sortedHall().filter((h) => h.turma === t))}`).join('')}
    <details class="gab"><summary>Gabarito dos 30 desafios</summary>${CITIES.map((c) => `<h4>${c.nome}</h4><ol>${c.ch.map((x) => `<li><b>${esc(x.titulo)}:</b> ${x.sol[x.sol.length - 1]}</li>`).join('')}</ol>`).join('')}</details>
    <button class="btn ghost danger" data-act="wipe">Apagar viagem atual e destaques deste computador</button>
  </main>`;
}
function passportModal() {
  return `<h3>${pict('pass')} Passaporte de ${esc(S.name)}</h3><div class="stampwall in-modal">${CITIES.map((c) => { const d = cityDone(c.id); const t = tier(c.id); return d ? `<div class="inkstamp sm t${t}" style="--rc:${REGIONS[c.reg].cor};--rot:${((fnv(c.id) % 24) - 12)}deg"><span class="is-top">${c.iata}</span>${pict(c.icon, 'is-ic')}<b>${esc(c.nome.toUpperCase())}</b><span class="is-bot">${TIER[t]}</span></div>` : `<div class="inkstamp sm empty"><b>${esc(c.nome)}</b><span class="is-bot">${cityStarted(c.id) ? 'em curso' : 'a visitar'}</span></div>`; }).join('')}</div><p class="center"><button class="btn y" data-act="close">Fechar</button></p>`;
}
function modalView() {
  if (!modal) return '';
  let inner = '';
  if (modal.type === 'board') {
    const to = placeOf(modal.to); const d = km(placeOf(S.at), to); const here = S.at === modal.to;
    inner = `<div class="mini-pass"><small>${to.voo || 'G9999'} · ${here ? 'você já está aqui' : `${fmt(d)} km`}</small><b>${placeOf(S.at).iata} ${pict('plane')} ${to.iata}</b><span>${esc(to.nome)} · ${to.uf}</span></div>
      <div class="row center"><button class="btn y" data-act="fly">${here ? 'Ir ao portão' : 'Embarcar agora'}</button><button class="btn ghost" data-act="close">Ainda não</button></div>`;
  }
  if (modal.type === 'passport') inner = passportModal();
  if (modal.type === 'pin') inner = `<h3>Área do professor</h3><form data-form="pin" autocomplete="off"><label>Senha<input name="pin" type="password" required></label>${modal.err ? '<p class="err">Senha incorreta.</p>' : ''}<div class="row"><button class="btn y" type="submit">Entrar</button><button class="btn ghost" type="button" data-act="close">Cancelar</button></div></form>`;
  if (modal.type === 'switch') inner = `<h3>Trocar de passageiro?</h3><p>A viagem de <b>${esc(S.name)}</b> será encerrada neste computador.${S.finished ? '' : ' Ela ainda não terminou e não entra nos destaques.'}</p><div class="row"><button class="btn y" data-act="switchYes">Trocar</button><button class="btn ghost" data-act="close">Cancelar</button></div>`;
  return `<div class="veil" data-act="veil"><div class="modal ${modal.type}" role="dialog" aria-modal="true">${inner}</div></div>`;
}

/* ---------- render ---------- */
function render() {
  Viewer.all.forEach((v) => v.dispose()); clearKeyHandlers();
  document.body.classList.toggle('proj', projection);
  const V = { checkin: checkinView, printed: printedView, hub: hubView, flight: flightView, gate: gateView, stamp: stampView, arrival: arrivalView, hall: hallView, teacher: teacherView }[screen];
  $app.innerHTML = V() + modalView();
  if (screen === 'checkin' || screen === 'hub' || screen === 'arrival') animateFlaps($app);
  if (screen === 'gate') mountGate();
  if (screen === 'flight') runFlight();
  if (screen === 'stamp') confetti(document.querySelector('.pp-r'));
  const f = $app.querySelector('.modal input'); if (f) f.focus();
}
function renderModal() {
  const old = $app.querySelector('.veil'); if (old) old.remove();
  if (modal) { $app.insertAdjacentHTML('beforeend', modalView()); const f = $app.querySelector('.modal input'); if (f) f.focus(); }
}
const go = (s) => { screen = s; modal = null; render(); window.scrollTo(0, 0); };

function flyTo(id) {
  modal = null;
  if (S.at === id) { openGate(id); return; }
  const d = km(placeOf(S.at), placeOf(id));
  flight = { from: S.at, to: id, km: d };
  S.km += d; S.route.push(id); S.at = id; save();
  go('flight');
}
function finishTrip() {
  S.finished = true; const d = new Date();
  DB.hall = DB.hall.filter((h) => h.id !== S.t0);
  DB.hall.push({ id: S.t0, name: S.name, turma: S.turma, pts: total(), km: Math.round(S.km), t: d.getTime(), date: d.toLocaleDateString('pt-BR') });
  save(); go('arrival');
}
function copyText() {
  const t = `Volta ao Brasil · Geometria Espacial\n${S.name} (${S.turma})\n${fmt(total())} milhas · ${fmt(S.km)} km · ${doneCount()}/10 destinos\nCódigo: ${certCode()}\n${new Date().toLocaleString('pt-BR')}`;
  const done = () => { const b = $app.querySelector('[data-act="copy"]'); if (b) b.textContent = 'Copiado!'; };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => window.prompt('Copie o resultado:', t)); else window.prompt('Copie o resultado:', t);
}

function act(a, el, e) {
  switch (a) {
    case 'veil': if (e && e.target === el) { modal = null; renderModal(); } break;
    case 'close': modal = null; renderModal(); break;
    case 'teacher': modal = { type: 'pin' }; renderModal(); break;
    case 'hall': go('hall'); break;
    case 'checkin': go('checkin'); break;
    case 'hub': if (S) go(S.finished && screen !== 'arrival' ? 'arrival' : 'hub'); else go('checkin'); break;
    case 'hubview': go('hub'); break;
    case 'passport': modal = { type: 'passport' }; renderModal(); break;
    case 'board': if (!S) return; modal = { type: 'board', to: el.dataset.id }; renderModal(); break;
    case 'gohome': modal = { type: 'board', to: HOME.id }; renderModal(); break;
    case 'fly': flyTo(modal.to); break;
    case 'skip': landed(); break;
    case 'hint': { const r = resOf(cityId)[gate.ci]; r.hint = true; save(); document.getElementById('hintbox').hidden = false; el.disabled = true; break; }
    case 'check': doCheck(); break;
    case 'nextch': openGate(cityId); break;
    case 'switch': modal = { type: 'switch' }; renderModal(); break;
    case 'switchYes': case 'newtrip': DB.cur = null; S = null; save(); go('checkin'); break;
    case 'copy': copyText(); break;
    case 'proj': projection = !projection; render(); break;
    case 'classtrip': newProfile('Turma', el.dataset.t); projection = true; go('hub'); break;
    case 'wipe': if (window.confirm('Apagar a viagem atual e todos os destaques deste computador?')) { DB = { cur: null, hall: [] }; S = null; save(); go('checkin'); } break;
    default: break;
  }
}
$app.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el.dataset.act, el, e); });
$app.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g[data-act]')) { e.preventDefault(); act(e.target.dataset.act, e.target, e); } });
$app.addEventListener('submit', (e) => {
  e.preventDefault(); const f = e.target;
  if (f.dataset.form === 'start') {
    const name = f.nome.value.trim().replace(/\s+/g, ' '); const tr = f.querySelector('input[name="turma"]:checked');
    if (!name || !tr) return;
    DB.last = { name, turma: tr.value }; newProfile(name, tr.value); go('printed');
  }
  if (f.dataset.form === 'pin') { if (fnv('missao:' + norm(f.pin.value)) === PIN_HASH) go('teacher'); else { modal = { type: 'pin', err: true }; renderModal(); } }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modal) { modal = null; renderModal(); return; }
  if (e.key === 'Enter' && screen === 'gate' && !modal && !e.target.closest('input, button')) { const b = document.querySelector('[data-act=check], [data-act=nextch]'); if (b && !b.disabled) b.click(); }
});
setInterval(() => { const c = document.getElementById('clock'); if (c) c.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }, 1000);
render();

</script>
</body>
</html>
