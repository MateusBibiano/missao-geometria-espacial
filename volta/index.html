<meta property="og:description" content="Volta ao Brasil: viaje por 10 cidades resolvendo desafios de prismas, pirâmides, cilindros e cones. Turmas F91 e F92 · Prof. Mateus Bibiano.">
<meta property="og:url" content="https://mateusbibiano.github.io/missao-geometria-espacial/volta/">

<style>
:root {
  --ink: #14213D; --mute: #5B6478; --paper: #FBF7EE; --sand: #F1E9D6; --line: #DCCFB3;
  --green: #0E5E4A; --green2: #13805F; --yellow: #F2B705; --sky: #DCEBF5;
  --ok: #16A34A; --no: #DC2626;
  --gold: #D4A017; --silver: #9AA3B2; --bronze: #B8733C;
  --fd: 'Bricolage Grotesque', system-ui, sans-serif;
  --fb: 'Plus Jakarta Sans', system-ui, sans-serif;
  --fm: 'DM Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--sand);
  background-image: radial-gradient(circle at 1px 1px, rgba(20,33,61,.08) 1px, transparent 0);
  background-size: 22px 22px;
  color: var(--ink); font-family: var(--fb); font-size: 16px; line-height: 1.5; min-height: 100vh;
}
button { font: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
#app { max-width: 1180px; margin: 0 auto; padding: 16px; }
h1, h2, h3, h4 { font-family: var(--fd); line-height: 1.1; margin: 0 0 .4em; }
.kicker { font-family: var(--fm); text-transform: uppercase; letter-spacing: .14em; font-size: 12px; color: var(--green2); margin: 0 0 6px; }
.lead { color: var(--mute); font-size: 18px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.center { text-align: center; justify-content: center; }

.go { background: var(--green); color: #fff; border: 0; border-radius: 14px; padding: 12px 20px; font-weight: 800; box-shadow: 0 4px 0 #083B2E; transition: transform .08s; }
.go:hover:not(:disabled) { background: var(--green2); }
.go:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #083B2E; }
.go:disabled { opacity: .45; }
.go.big { font-size: 19px; padding: 14px 28px; }
.ghost { background: var(--paper); color: var(--ink); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 16px; font-weight: 700; }
.ghost:hover:not(:disabled) { border-color: var(--ink); }
.ghost:disabled { opacity: .5; }
.ghost.sm { padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.ghost.danger { color: var(--no); border-color: #F3B4B4; margin-top: 24px; }
.tag { font-family: var(--fm); font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 4px; color: var(--mute); }

/* home */
.top { display: flex; justify-content: space-between; align-items: center; }
.logo { height: 40px; width: auto; }
.hero { display: grid; grid-template-columns: 1.2fr .8fr; gap: 28px; align-items: center; margin: 24px 0; }
.hero h1 { font-size: clamp(52px, 9vw, 104px); letter-spacing: -.035em; font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--green); position: relative; }
.hero h1 em::after { content: ''; position: absolute; left: 0; right: 0; bottom: .06em; height: .16em; background: var(--yellow); z-index: -1; border-radius: 4px; }
.enter { margin-top: 18px; max-width: 420px; display: grid; gap: 14px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: 0 10px 30px rgba(20,33,61,.08); }
.enter label { display: grid; gap: 6px; font-weight: 700; font-size: 14px; }
input:not([type=radio]) { font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
.seg { display: flex; gap: 8px; }
.seg label { flex: 1; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: block; text-align: center; padding: 10px; border-radius: 12px; border: 1.5px solid var(--line); font-weight: 800; font-family: var(--fm); background: #fff; }
.seg input:checked + span { background: var(--ink); color: #fff; border-color: var(--ink); }
.seg input:focus-visible + span { outline: 3px solid var(--yellow); }
.howto { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.howto li { background: var(--paper); border: 1.5px dashed var(--line); border-radius: 16px; padding: 12px 14px; color: var(--mute); }
.howto b { color: var(--ink); }

/* mapa */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.bar h2 { margin: 0; }
.kpis { display: flex; gap: 8px; flex-wrap: wrap; }
.kpis span { background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; color: var(--mute); }
.kpis b { color: var(--ink); font-family: var(--fd); font-size: 16px; }
.mapgrid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: start; }
.mapbox { background: var(--sky); border-radius: 24px; padding: 12px; border: 1.5px solid #B9D3E6; }
.map { width: 100%; max-width: 520px; height: auto; display: block; margin: 0 auto; }
.map .uf { font-family: var(--fm); font-size: 11px; font-weight: 500; }
.map .route { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; opacity: .55; }
.map .trip { stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: 6 6; animation: dash 1.3s linear; }
@keyframes dash { from { stroke-dashoffset: 120; } }
.pin { cursor: pointer; }
.pin .pc { fill: #fff; stroke: var(--rc); stroke-width: 3; transition: r .15s; }
.pin:hover .pc, .pin:focus .pc { r: 21; }
.pin:focus { outline: none; }
.pin:focus-visible .pc { stroke: var(--ink); }
.pin.done .pc { fill: #FFFBEA; }
.pin .badge { fill: var(--silver); stroke: #fff; stroke-width: 1.5; }
.pin.st3 .badge { fill: var(--gold); }
.pin.st1 .badge { fill: var(--bronze); }
.pin.st0 .badge { fill: #9CA3AF; }
.pin .bt { fill: #fff; font-family: var(--fm); font-weight: 700; }
.you { fill: none; stroke: var(--yellow); stroke-width: 3; stroke-dasharray: 4 4; animation: spin 6s linear infinite; transform-box: fill-box; transform-origin: center; pointer-events: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 13px; color: var(--mute); padding: 6px 0 2px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
.side { display: grid; gap: 14px; }
.where { background: var(--paper); border-radius: 20px; padding: 16px; border: 1.5px solid var(--line); }
.where h2 { font-size: 28px; margin-bottom: 4px; }
.where h2 small { font-family: var(--fm); font-size: 14px; color: var(--mute); }
.where p { margin: 0 0 10px; color: var(--mute); }
.pass { background: #13294B; color: #fff; border-radius: 20px; padding: 14px; box-shadow: 0 12px 30px rgba(19,41,75,.25); }
.pass header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.pass header span { font-family: var(--fm); letter-spacing: .2em; font-size: 12px; color: var(--yellow); }
.pass header small { font-family: var(--fm); color: #A9B7D0; }
.stamps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stamp { display: grid; grid-template-columns: 30px 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left; padding: 8px 10px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1.5px dashed rgba(255,255,255,.25); color: #fff; }
.stamp .e { grid-row: span 2; font-size: 22px; filter: grayscale(1); opacity: .6; }
.stamp .c { font-weight: 700; font-size: 14px; line-height: 1.2; }
.stamp .m { font-family: var(--fm); font-size: 11px; color: #A9B7D0; }
.stamp:hover { border-color: var(--yellow); }
.stamp.on { border-style: solid; border-color: var(--rc); background: rgba(255,255,255,.1); }
.stamp.on .e { filter: none; opacity: 1; }
.stamp.st3 .m { color: #FCD34D; }
.stamp.st2 .m { color: #E5E7EB; }
.stamp.st1 .m { color: #F0B27A; }

/* cidade */
.crumbs { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-family: var(--fm); font-size: 13px; color: var(--mute); }
.city { max-width: 860px; margin: 0 auto; }
.postal { background: var(--paper); border-radius: 22px; padding: 16px 18px; border: 1.5px solid var(--line); border-top: 8px solid var(--rc); position: relative; }
.postal .pt { display: flex; gap: 12px; align-items: center; }
.postal .pt .e { font-size: 40px; }
.postal h1 { font-size: 34px; margin: 0; }
.postal .kicker { color: var(--rc); }
.postal > p { margin: 8px 0 0; color: var(--mute); }
.dots { position: absolute; top: 16px; right: 16px; display: flex; gap: 6px; }
.dots span { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--fm); font-size: 13px; border: 1.5px solid var(--line); background: #fff; color: var(--mute); }
.dots .cur { border-color: var(--ink); color: var(--ink); font-weight: 700; }
.dots .ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.dots .no { background: var(--no); border-color: var(--no); color: #fff; }
.qcard { margin-top: 14px; background: #fff; border-radius: 22px; padding: 18px 20px; border: 1.5px solid var(--line); font-size: 18px; box-shadow: 0 10px 30px rgba(20,33,61,.06); }
.qcard p { margin: 0 0 8px; }
.qcard .ask { font-family: var(--fd); font-weight: 700; font-size: 22px; margin: 8px 0 0; }
.fig { margin: 6px auto; max-width: 330px; }
.fig svg { width: 100%; height: auto; display: block; font-family: var(--fb); }
.solid text { fill: #1B1D2E; }
.hint { margin-top: 12px; background: #FFF6D6; border: 1.5px solid #F2D27A; border-radius: 16px; padding: 10px 14px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border-radius: 16px; background: var(--paper); border: 2px solid var(--line); color: var(--ink); font-size: 18px; font-weight: 600; transition: border-color .15s, transform .1s; }
.opt:hover:not(:disabled) { border-color: var(--ink); transform: translateY(-1px); }
.opt .let { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--ink); color: #fff; font-family: var(--fd); font-weight: 800; }
.opt.sel { border-color: var(--green); background: #E3F4EC; }
.opt.sel .let { background: var(--green); }
.opt.right { border-color: var(--ok); background: #DCFCE7; }
.opt.right .let { background: var(--ok); }
.opt.wrong { border-color: var(--no); background: #FEE2E2; }
.opt.wrong .let { background: var(--no); }
.opt:disabled { opacity: 1; }
.actions { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.verdict { margin-top: 14px; border-radius: 20px; padding: 14px 18px; background: var(--paper); border: 2px solid; }
.verdict.ok { border-color: var(--ok); }
.verdict.no { border-color: var(--no); }
.verdict h3 { font-size: 22px; }
.steps { margin: 6px 0 14px; padding-left: 22px; }
.steps li { margin: 3px 0; }

.sum { margin-top: 18px; display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; background: var(--paper); border-radius: 22px; padding: 20px; border: 1.5px solid var(--line); }
.sum p { color: var(--mute); }
.bigstamp { width: 170px; height: 170px; border-radius: 50%; border: 5px double var(--rc); color: var(--rc); display: grid; place-items: center; align-content: center; gap: 2px; text-align: center; transform: rotate(-9deg); animation: stampin .45s cubic-bezier(.2,1.6,.4,1); background: rgba(255,255,255,.6); }
.bigstamp .e { font-size: 42px; }
.bigstamp b { font-family: var(--fd); font-size: 17px; letter-spacing: .06em; }
.bigstamp small { font-family: var(--fm); font-size: 12px; text-transform: uppercase; }
.bigstamp.st3 { box-shadow: 0 0 0 6px #FCE7A6; }
.bigstamp.st0 { filter: grayscale(1); opacity: .7; }
@keyframes stampin { from { transform: rotate(-9deg) scale(2.2); opacity: 0; } }

/* fim */
.end { max-width: 820px; margin: 0 auto; }
.cert { margin: 20px 0; background: var(--paper); border-radius: 26px; padding: 28px; text-align: center; border: 2px solid var(--ink); outline: 6px double var(--line); outline-offset: -14px; }
.cert h1 { font-size: clamp(34px, 6vw, 56px); color: var(--green); }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 18px 0 8px; }
.stats div { background: #fff; border-radius: 14px; padding: 8px; border: 1.5px solid var(--line); }
.stats dt { font-family: var(--fm); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); }
.stats dd { margin: 2px 0 0; font-family: var(--fd); font-weight: 800; font-size: 20px; }
.code { font-family: var(--fm); color: var(--mute); }

/* páginas */
.page { max-width: 760px; margin: 0 auto; }
.note, .empty { color: var(--mute); }
.hall { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 6px; }
.hall li { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 14px; background: var(--paper); border: 1.5px solid var(--line); }
.hall .pos { font-family: var(--fd); font-weight: 800; color: var(--green); }
.hall small { font-family: var(--fm); color: var(--mute); margin-left: 6px; }
.hall .pz { font-family: var(--fd); font-weight: 800; }
.hall .dt { font-family: var(--fm); font-size: 12px; color: var(--mute); }
.tcards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
.tcards section { background: var(--paper); border-radius: 18px; padding: 16px; border: 1.5px solid var(--line); }
.tcards p { color: var(--mute); margin-top: 0; }
.th { margin-top: 18px; }
.gab { margin-top: 18px; background: var(--paper); border-radius: 16px; padding: 12px 16px; border: 1.5px solid var(--line); }
.gab summary { font-weight: 700; cursor: pointer; }
.gab h4 { margin: 14px 0 4px; }
.gab ol { margin: 0; padding-left: 22px; color: var(--mute); }
.gab b { color: var(--ink); }

/* modal */
.veil { position: fixed; inset: 0; background: rgba(20,33,61,.5); display: grid; place-items: center; padding: 16px; z-index: 10; }
.modal { width: min(460px, 100%); background: var(--paper); border-radius: 22px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.3); }
.modal h3 { font-size: 24px; }
.modal p { color: var(--mute); }
.modal form { display: grid; gap: 12px; }
.modal label { display: grid; gap: 6px; font-weight: 700; }
.err { color: var(--no) !important; margin: 0; }

/* projeção */
body.proj #app { max-width: 1500px; }
body.proj .city { max-width: 1200px; }
body.proj .qcard { font-size: 24px; }
body.proj .qcard .ask { font-size: 30px; }
body.proj .fig { max-width: 440px; }
body.proj .opt { font-size: 24px; }

@media (max-width: 900px) {
  .hero, .mapgrid { grid-template-columns: 1fr; }
  .tcards { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .opts { grid-template-columns: 1fr; }
  .qcard { padding: 16px; font-size: 16px; }
  .qcard .ask { font-size: 19px; }
  .opt { font-size: 16px; }
  .postal h1 { font-size: 26px; }
  .dots { position: static; margin-top: 10px; }
  .sum { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .sum .row { justify-content: center; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .hall li { grid-template-columns: 34px 1fr auto; }
  .hall .dt { display: none; }
  .cert { padding: 22px 16px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

[hidden]{display:none!important}
</style>
</head>

/* ---------- Desenho dos sólidos (SVG, fora de escala) ---------- */
const SOLID = {
  a: { f: '#D6F3EE', t: '#B4E9E0', s: '#0B7C70' },
  b: { f: '#FFE3DE', t: '#FFC9BF', s: '#C2372A' },
  c: { f: '#E3E4FC', t: '#C9CBF8', s: '#4338CA' },
  d: { f: '#FFEFD2', t: '#FFE0A6', s: '#B86E00' },

const RED = '#E0322B';
const BLUE = '#2563EB';
const n1 = (v) => (Math.round(v * 10) / 10).toString();
const pt = (p) => `${n1(p[0])},${n1(p[1])}`;
function hull(points) {

  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);

const ROT = { 3: (3 * Math.PI) / 2, 4: Math.PI / 4 + 0.35, 5: (3 * Math.PI) / 2 + 0.2, 6: 0.26, 8: 0.2 };

const backEdge = (P, i) => { const a = P[i][2]; const b = P[(i + 1) % P.length][2]; let m = (a + b) / 2; if (b < a) m += Math.PI; return Math.sin(m) < -0.02; };

const label = (x, y, txt, anchor, color, size) => `<text x="${n1(x)}" y="${n1(y)}" text-anchor="${anchor || 'middle'}" font-size="${size || 13}" font-weight="700" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"${color ? ` style="fill:${color}"` : ''}>${txt}</text>`;
const tagTxt = (W, txt, col) => (txt ? `<g><rect x="${W - 8 - txt.length * 6.6 - 16}" y="6" rx="10" width="${txt.length * 6.6 + 16}" height="20" fill="${col.t}"/><text x="${W - 16}" y="20.5" text-anchor="end" font-size="11" font-weight="700" style="fill:${col.s}">${txt}</text></g>` : '');

/* prisma reto de base regular */
function prismBody(o) {
  const { n, cx = 130, cy = 186, R = 66, k = 0.36, H = 110, col, edge, height, edgeColor } = o;
  const B = basePts(n, cx, cy, R, k);
  const T = B.map((p) => [p[0], p[1] - H, p[2]]);
  let s = `<polygon points="${hull(B.concat(T)).map(pt).join(' ')}" fill="${col.f}" stroke="none"/>`;
  s += `<polygon points="${T.map(pt).join(' ')}" fill="${col.t}" stroke="${col.s}" stroke-width="2" stroke-linejoin="round"/>`;

  let fi = 0; let best = -9;

  const a = B[fi]; const b = B[(fi + 1) % n];

/* pirâmide reta de base regular */
function pyrBody(o) {

  B.forEach((p, i) => { const hid = backEdge(B, i) && backEdge(B, (i - 1 + n) % n); s += line(A, p, col.s, 2, hid); });

/* paralelepípedo em perspectiva (a = largura, b = profundidade, c = altura) */
function BOX(o) {
  const { W = 170, H = 90, D = 60, a, b, c, ph = 'a', tag } = o;
  const col = SOLID[ph];
  const x0 = 40; const y0 = 50 + D * 0.55; const dx = D; const dy = D * 0.55;
  const F = [[x0, y0], [x0 + W, y0], [x0 + W, y0 + H], [x0, y0 + H]];
  const T = F.map((p) => [p[0] + dx, p[1] - dy]);
  let s = `<polygon points="${pt(F[0])} ${pt(T[0])} ${pt(T[1])} ${pt(F[1])}" fill="${col.t}" stroke="${col.s}" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<polygon points="${pt(F[1])} ${pt(T[1])} ${pt(T[2])} ${pt(F[2])}" fill="${col.t}" opacity=".75" stroke="${col.s}" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<polygon points="${F.map(pt).join(' ')}" fill="${col.f}" stroke="${col.s}" stroke-width="2" stroke-linejoin="round"/>`;
  s += line(F[3], T[3], col.s, 1.6, true) + line(T[3], T[0], col.s, 1.6, true) + line(T[3], T[2], col.s, 1.6, true);
  if (a) s += label(x0 + W / 2, y0 + H + 19, a);
  if (c) s += label(x0 - 8, y0 + H / 2 + 4, c, 'end');
  if (b) s += label(x0 + W + dx / 2 + 8, y0 + H - dy / 2 + 14, b, 'start');
  const WW = x0 + W + dx + 70;
  return wrap(WW, y0 + H + 34, s + tagTxt(WW, tag || '', col), 'Paralelepípedo');
}
/* silo: cilindro com teto cônico */
function SILO() {
  const cx = 120; const base = 250; const rx = 60; const ry = 16; const Hc = 150; const Hk = 70;
  let s = cylBody({ cx, cy: base, rx, ry, H: Hc, col: SOLID.d, h: '10 m' });
  s += coneBody({ cx, cy: base - Hc, rx, ry, H: Hk, col: SOLID.b, h: '4 m', r: '3 m' });
  return wrap(300, 282, s + tagTxt(300, 'silo de grãos', SOLID.d), 'Silo: cilindro de raio 3 m e altura 10 m com teto cônico de altura 4 m');
}
/* cilindro deitado (estação-tubo) */
function TUBE() {
  const col = SOLID.c;
  const x0 = 60; const x1 = 250; const cy = 110; const ry = 52; const rx = 18;
  let s = `<path d="M${x0},${cy - ry} L${x1},${cy - ry} A${rx},${ry} 0 0 1 ${x1},${cy + ry} L${x0},${cy + ry} Z" fill="${col.f}" stroke="${col.s}" stroke-width="2"/>`;
  for (let i = 1; i < 6; i++) { const x = x0 + ((x1 - x0) * i) / 6; s += `<path d="M${x},${cy - ry} A${rx},${ry} 0 0 1 ${x},${cy + ry}" fill="none" stroke="${col.s}" stroke-width="1" opacity=".35"/>`; }
  s += `<path d="M${x1},${cy - ry} A${rx},${ry} 0 0 0 ${x1},${cy + ry}" fill="none" stroke="${col.s}" stroke-width="2" stroke-dasharray="5 4"/>`;
  s += `<ellipse cx="${x0}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${col.t}" stroke="${col.s}" stroke-width="2"/>`;
  s += line([x0, cy - ry], [x0, cy + ry], RED, 2.4) + label(x0 - 12, cy + 4, '3 m', 'end', RED);
  s += `<path d="M${x0},${cy + ry + 18} H${x1}" stroke="#1B1D2E" stroke-width="1.4"/><path d="M${x0},${cy + ry + 13} V${cy + ry + 23} M${x1},${cy + ry + 13} V${cy + ry + 23}" stroke="#1B1D2E" stroke-width="1.4"/>`;
  s += label((x0 + x1) / 2, cy + ry + 38, '10 m');
  return wrap(310, 210, s + tagTxt(310, 'estação-tubo', col), 'Cilindro deitado com diâmetro de 3 m e comprimento de 10 m');
}
/* pirâmide de base heptagonal */
function HEPTA() {
  const n = 7; const cx = 130; const cy = 190; const R = 80; const k = 0.34; const H = 140;
  const col = SOLID.c;
  const B = [...Array(n)].map((_, i) => { const t = -Math.PI / 2 + 0.25 + (i * 2 * Math.PI) / n; return [cx + R * Math.cos(t), cy + k * R * Math.sin(t), t]; });
  const A = [cx, cy - H];
  let s = `<polygon points="${hull(B.concat([A])).map(pt).join(' ')}" fill="${col.f}" stroke="none"/>`;
  B.forEach((p, i) => { s += line(p, B[(i + 1) % n], col.s, 2, backEdge(B, i)); });
  B.forEach((p, i) => { const hid = backEdge(B, i) && backEdge(B, (i - 1 + n) % n); s += line(A, p, col.s, 2, hid); });
  return wrap(280, 230, s + tagTxt(280, '7 faces laterais', col), 'Pirâmide de base heptagonal');
}

    return `<section class="sum">
      <div class="bigstamp st${k}" style="--rc:${REGIONS[c.reg].cor}"><span class="e">${c.emoji}</span><b>${c.nome.toUpperCase()}</b><small>${k ? 'carimbo ' + STAMP[k] : 'visitada'}</small></div>
      <div>
        <h2>${k === 3 ? 'Carimbo de ouro!' : k === 2 ? 'Carimbo de prata!' : k === 1 ? 'Carimbo de bronze' : 'Cidade visitada'}</h2>
        <p>${k} de 3 desafios certos · ${ptsOf(v)} milhas nesta cidade.</p>
        <div class="row">
          <button class="go" data-act="map">Voltar ao mapa</button>
          ${canRetry ? '<button class="ghost" data-act="retry">Tentar de novo os erros (vale 50)</button>' : ''}
        </div>
      </div>
    </section>`;
  }

  function endView() {
    const t = total(); const per = [0, 0, 0, 0];
    CITIES.forEach((c) => { per[okCount(S.visits[c.id])]++; });
    const code = certCode();
    return `<main class="end">
      <section class="cert">
        <p class="kicker">Certificado de viajante · Geometria Espacial</p>
        <h1>${esc(S.name)}</h1>
        <p class="lead">deu a Volta ao Brasil, visitou 10 cidades e voltou para Itajubá.</p>
        <dl class="stats">
          <div><dt>Milhas</dt><dd>${fmt(t)}</dd></div>
          <div><dt>Distância</dt><dd>${fmt(S.km)} km</dd></div>
          <div><dt>Ouro</dt><dd>${per[3]}</dd></div>
          <div><dt>Prata</dt><dd>${per[2]}</dd></div>
          <div><dt>Bronze</dt><dd>${per[1]}</dd></div>
        </dl>
        <p class="code">Turma ${esc(S.turma)} · código <b>${code}</b></p>
      </section>
      <div class="row center">
        <button class="go" data-act="copy">Copiar resultado</button>
        <button class="ghost" data-act="map">Rever o passaporte</button>
        <button class="ghost" data-act="hall">Viajantes de destaque</button>
        <button class="ghost" data-act="newtrip">Nova viagem</button>
      </div>
    </main>`;
  }
  function certCode() {
    const base = `${norm(S.name)}|${S.turma}|${total()}|g9-volta-brasil`;
    return (fnv(base) % 46656).toString(36).toUpperCase().padStart(3, '0') + '-' + (fnv(base + '#') % 46656).toString(36).toUpperCase().padStart(3, '0');
  }

  const sortedHall = () => DB.hall.slice().sort((a, b) => b.pts - a.pts || a.t - b.t);
  function hallList(rows) {
    if (!rows.length) return '<p class="empty">Nenhum viajante terminou a volta neste computador ainda.</p>';
    return `<ol class="hall">${rows.map((h, k) => `<li><span class="pos">${k + 1}º</span><span class="nm">${esc(h.name)} <small>${esc(h.turma)}</small></span><span class="pz">${fmt(h.pts)} milhas</span><span class="dt">${esc(h.date)}</span></li>`).join('')}</ol>`;
  }
  function hallView() {
    return `<main class="page"><header class="bar"><h2>Viajantes de destaque</h2><button class="ghost sm" data-act="${S ? 'map' : 'home'}">Voltar</button></header>
      <p class="note">Quem completou a volta neste computador, por milhas.</p>${hallList(sortedHall().slice(0, 20))}</main>`;
  }
  function teacherView() {
    return `<main class="page">
      <header class="bar"><h2>Área do professor</h2><button class="ghost sm" data-act="${S ? 'map' : 'home'}">Voltar</button></header>
      <div class="tcards">
        <section><h3>Modo projeção</h3><p>Letras e figuras maiores para resolver com a turma no projetor.</p><button class="go" data-act="proj">${projection ? 'Desligar' : 'Ligar'}</button></section>
        <section><h3>Viagem da turma</h3><p>Começa uma viagem coletiva com o nome “Turma”.</p><div class="row">${TURMAS.map((t) => `<button class="ghost" data-act="classtrip" data-t="${t}">Com a ${t}</button>`).join('')}</div></section>
      </div>
      ${TURMAS.map((t) => `<h3 class="th">${t}</h3>${hallList(sortedHall().filter((h) => h.turma === t))}`).join('')}
      <details class="gab"><summary>Gabarito das 30 questões</summary>
        ${CITIES.map((c) => `<h4>${c.emoji} ${c.nome}</h4><ol>${c.qs.map((q) => `<li>${q.ask} <b>${q.opts[0]}</b></li>`).join('')}</ol>`).join('')}
      </details>
      <button class="ghost danger" data-act="wipe">Apagar viagem atual e destaques deste computador</button>
    </main>`;
  }

  function modalView() {
    if (!modal) return '';
    let inner = '';
    if (modal.type === 'travel') {
      const to = placeOf(modal.to); const d = km(placeOf(S.at), to);
      inner = `<h3>Viajar para ${to.nome}?</h3><p>${placeOf(S.at).nome} → ${to.nome}: cerca de <b>${fmt(d)} km</b>.</p><div class="row"><button class="go" data-act="fly">Embarcar ✈️</button><button class="ghost" data-act="close">Ficar aqui</button></div>`;
    }
    if (modal.type === 'pin') inner = `<h3>Área do professor</h3><form data-form="pin" autocomplete="off"><label>Senha<input name="pin" type="password" required></label>${modal.err ? '<p class="err">Senha incorreta.</p>' : ''}<div class="row"><button class="go" type="submit">Entrar</button><button class="ghost" type="button" data-act="close">Cancelar</button></div></form>`;
    if (modal.type === 'switch') inner = `<h3>Trocar de viajante?</h3><p>A viagem de <b>${esc(S.name)}</b> será encerrada neste computador. ${S.finished ? '' : 'Ela ainda não terminou e não entra nos destaques.'}</p><div class="row"><button class="go" data-act="switchYes">Trocar</button><button class="ghost" data-act="close">Cancelar</button></div>`;
    return `<div class="veil" data-act="veil"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`;
  }

  function render() {
    document.body.classList.toggle('proj', projection);
    let html = '';
    if (screen === 'home') html = homeView();
    else if (screen === 'map') html = mapView();
    else if (screen === 'city') html = cityView();
    else if (screen === 'end') html = endView();
    else if (screen === 'hall') html = hallView();
    else if (screen === 'teacher') html = teacherView();
    $app.innerHTML = html + modalView();
    const f = $app.querySelector('.modal input'); if (f) f.focus();
  }
  const go = (s) => { screen = s; modal = null; render(); window.scrollTo(0, 0); };

  /* ---------- ações ---------- */
  function openCity(id) { cityId = id; sel = null; showHint = false; cityAnswerOpen = null; visit(id); save(); go('city'); }
  function flyTo(id) {
    const from = S.at;
    modal = null;
    if (from === id) { openCity(id); return; }
    S.km += km(placeOf(from), placeOf(id));
    S.route.push(id);
    trip = { from, to: id };
    S.at = id; save();
    screen = 'map'; render();
    setTimeout(() => { trip = null; if (id === HOME.id) finishTrip(); else openCity(id); }, 1500);
  }
  function confirmAnswer() {
    const v = visit(cityId); const c = CITY[cityId];
    const qi = v.ans.findIndex((a) => !a || (v.retry && !a.ok && !a.re));
    if (qi < 0 || sel == null) return;
    const ok = v.ord[qi][sel] === 0;
    const pts = ok ? (v.retry ? (showHint ? PTS.retryHint : PTS.retry) : (showHint ? PTS.firstHint : PTS.first)) : 0;
    if (v.retry) v.ans[qi] = { ok, pts, hint: showHint, re: true };
    else v.ans[qi] = { ok, pts, hint: showHint };
    cityAnswerOpen = { q: qi, ok, pts };
    save(); render();
    const el = $app.querySelector('.verdict'); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return c;
  }
  function nextQ() {
    const v = visit(cityId);
    cityAnswerOpen = null; sel = null; showHint = false;
    if (v.retry && !v.ans.some((a) => !a.ok && !a.re)) { v.retry = false; v.ans.forEach((a) => { delete a.re; }); }
    save(); render(); window.scrollTo(0, 0);
  }
  function finishTrip() {
    S.finished = true;
    const d = new Date();
    DB.hall = DB.hall.filter((h) => !(h.id === S.t0 && h.name === S.name));
    DB.hall.push({ id: S.t0, name: S.name, turma: S.turma, pts: total(), km: Math.round(S.km), t: d.getTime(), date: d.toLocaleDateString('pt-BR') });
    save(); go('end');
  }
  function copyText() {
    const t = `Volta ao Brasil · Geometria Espacial\n${S.name} (${S.turma})\n${fmt(total())} milhas · ${fmt(S.km)} km · ${doneCount()}/10 cidades\nCódigo: ${certCode()}\n${new Date().toLocaleString('pt-BR')}`;
    const done = () => { const b = $app.querySelector('[data-act="copy"]'); if (b) b.textContent = 'Copiado!'; };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => window.prompt('Copie o resultado:', t));
    else window.prompt('Copie o resultado:', t);
  }

  function act(a, el, e) {
    switch (a) {
      case 'veil': if (e && e.target === el) { modal = null; render(); } break;
      case 'teacher': modal = { type: 'pin' }; render(); break;
      case 'hall': go('hall'); break;
      case 'home': go('home'); break;
      case 'map': if (S) go('map'); else go('home'); break;
      case 'close': modal = null; render(); break;
      case 'goto': {
        if (trip) return;
        const id = el.dataset.id;
        if (S.at === id) openCity(id); else { modal = { type: 'travel', to: id }; render(); }
        break;
      }
      case 'gohome': modal = { type: 'travel', to: HOME.id }; render(); break;
      case 'fly': flyTo(modal.to); break;
      case 'pick': sel = +el.dataset.k; render(); break;
      case 'hint': showHint = true; render(); break;
      case 'confirm': confirmAnswer(); break;
      case 'nextq': nextQ(); break;
      case 'retry': { const v = visit(cityId); v.retried = true; v.retry = true; v.ord = v.ord.map((o) => shuffled(o.length)); save(); sel = null; showHint = false; render(); break; }
      case 'switch': modal = { type: 'switch' }; render(); break;
      case 'switchYes': DB.cur = null; S = null; save(); go('home'); break;
      case 'newtrip': DB.cur = null; S = null; save(); go('home'); break;
      case 'copy': copyText(); break;
      case 'proj': projection = !projection; render(); break;
      case 'classtrip': newProfile('Turma', el.dataset.t); projection = true; go('map'); break;
      case 'wipe': if (window.confirm('Apagar a viagem atual e todos os destaques deste computador?')) { DB = { cur: null, hall: [] }; S = null; save(); go('home'); } break;
      default: break;
    }
  }
  $app.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (el) act(el.dataset.act, el, e); });
  $app.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g[data-act]')) { e.preventDefault(); act(e.target.dataset.act, e.target, e); } });
  $app.addEventListener('submit', (e) => {
    e.preventDefault(); const f = e.target;
    if (f.dataset.form === 'start') {
      const name = f.nome.value.trim().replace(/\s+/g, ' ');
      const tr = f.querySelector('input[name="turma"]:checked');
      if (!name || !tr) return;
      DB.last = { name, turma: tr.value };
      newProfile(name, tr.value); go('map');
    }
    if (f.dataset.form === 'pin') {
      if (fnv('missao:' + norm(f.pin.value)) === PIN_HASH) go('teacher');
      else { modal = { type: 'pin', err: true }; render(); }
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal) { modal = null; render(); } });
  if (S && S.finished) screen = 'end';
  render();
}());

</script>
</body>
</html>
