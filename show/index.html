<style>
:root {
  --ink: #0A0A26; --navy: #12114A; --plum: #2B1166; --violet: #4B22A8;
  --gold: #F6C445; --gold2: #FFE08A; --goldd: #B8860B;
  --paper: #FFFBF0; --text: #F3F1FF; --mute: #B9B4E0;
  --ok: #22C55E; --no: #EF4444;
  --fd: 'Bricolage Grotesque', system-ui, sans-serif;
  --fb: 'Plus Jakarta Sans', system-ui, sans-serif;
  --fm: 'DM Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(1200px 700px at 50% -10%, #3A1A86 0%, var(--plum) 30%, var(--navy) 62%, var(--ink) 100%) fixed, var(--ink);
  color: var(--text); font-family: var(--fb); font-size: 16px; line-height: 1.5; min-height: 100vh;
}
button { font: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--gold2); outline-offset: 2px; }
#app { max-width: 1180px; margin: 0 auto; padding: 16px; }
h1, h2, h3 { font-family: var(--fd); line-height: 1.1; margin: 0 0 .4em; }
.kicker { font-family: var(--fm); text-transform: uppercase; letter-spacing: .14em; font-size: 12px; color: var(--gold2); margin: 0 0 8px; }
.lead { color: var(--mute); font-size: 18px; max-width: 46ch; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

/* botões */
.gold { background: linear-gradient(180deg, var(--gold2), var(--gold) 55%, #E0A82A); color: #2A1A00; border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 800; box-shadow: 0 6px 0 var(--goldd), 0 10px 24px rgba(246,196,69,.25); transition: transform .08s; }
.gold:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--goldd); }
.gold.big { font-size: 19px; padding: 15px 30px; }
.ghost { background: rgba(255,255,255,.06); color: var(--text); border: 1.5px solid rgba(255,255,255,.22); border-radius: 999px; padding: 10px 18px; font-weight: 700; }
.ghost:hover:not(:disabled) { border-color: var(--gold); }
.ghost.sm { padding: 6px 14px; font-size: 14px; }
.ghost.danger { border-color: rgba(239,68,68,.5); color: #FCA5A5; margin-top: 24px; }
button:disabled.ghost { opacity: .4; }

/* home */
.home { position: relative; display: grid; gap: 28px; }
.spot { position: absolute; inset: -40px 0 auto; height: 420px; pointer-events: none; background: conic-gradient(from 200deg at 50% 0%, transparent 0 20deg, rgba(255,224,138,.09) 26deg, transparent 34deg 60deg, rgba(255,224,138,.07) 66deg, transparent 74deg 100deg, rgba(255,224,138,.08) 106deg, transparent 114deg); z-index: -1; -webkit-mask-image: linear-gradient(180deg, #000 40%, transparent); mask-image: linear-gradient(180deg, #000 40%, transparent); }
.home-top { display: flex; justify-content: space-between; align-items: center; }
.logo { height: 40px; width: auto; filter: brightness(0) invert(1); opacity: .9; }
.hero { text-align: center; display: grid; justify-items: center; padding-top: 10px; }
.hero h1 { font-size: clamp(48px, 11vw, 112px); letter-spacing: -.03em; font-weight: 800; text-transform: uppercase; }
.hero h1 { margin-bottom: 0; }
.hero h1 span { display: block; font-size: .42em; letter-spacing: .12em; color: var(--text); }
.hero h1 em { font-style: normal; background: linear-gradient(180deg, #FFF3C4, var(--gold) 50%, #C9901A); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
.enter { margin-top: 18px; width: min(420px, 100%); display: grid; gap: 14px; text-align: left; background: rgba(10,10,38,.55); border: 1.5px solid rgba(246,196,69,.35); border-radius: 22px; padding: 20px; }
.enter label { display: grid; gap: 6px; font-weight: 700; font-size: 14px; }
input[type=text], input:not([type]), input[type=password] { font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: var(--text); }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
.seg { display: flex; gap: 8px; }
.seg label { flex: 1; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: block; text-align: center; padding: 10px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,.25); font-weight: 800; font-family: var(--fm); }
.seg input:checked + span { background: var(--gold); color: #2A1A00; border-color: var(--gold); }
.seg input:focus-visible + span { outline: 3px solid var(--gold2); }
.rules { background: rgba(255,255,255,.04); border-radius: 22px; padding: 20px; border: 1px solid rgba(255,255,255,.1); }
.rules ul { margin: 0 0 16px; padding-left: 20px; color: var(--mute); }
.rules b { color: var(--text); }

/* jogo */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 14px; flex-wrap: wrap; }
.bar h2 { margin: 0; }
.who span, .qn { font-family: var(--fm); font-size: 13px; color: var(--mute); }
.who span { margin-left: 6px; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; padding: 1px 6px; }
.qn b { color: var(--gold2); }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start; }
.topic { font-family: var(--fm); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold2); margin: 0 0 8px; }
.qcard { background: var(--paper); color: #1B1A33; border-radius: 22px; padding: 20px 22px; box-shadow: 0 0 0 4px rgba(246,196,69,.55), 0 18px 50px rgba(0,0,0,.4); font-size: 18px; }
.qcard p { margin: 0 0 10px; }
.qcard .ask { font-family: var(--fd); font-weight: 700; font-size: 22px; margin: 10px 0 0; }
.fig { margin: 6px auto; max-width: 330px; }
.fig svg { width: 100%; height: auto; display: block; font-family: var(--fb); }
.solid text { fill: #1B1D2E; }
.final .qcard { box-shadow: 0 0 0 4px var(--gold), 0 0 60px rgba(246,196,69,.45); }
.opts { display: grid; gap: 10px; margin-top: 18px; }
.opt { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; padding: 12px 18px 12px 12px; color: var(--text); font-size: 18px; font-weight: 600; background: linear-gradient(180deg, #2A2380, #17135A); border: 2px solid rgba(246,196,69,.55); border-radius: 999px; transition: transform .1s, background .2s, border-color .2s; }
.opt:hover:not(:disabled) { transform: translateX(4px); border-color: var(--gold2); background: linear-gradient(180deg, #3A31A6, #211A78); }
.opt .let { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #2A1A00; font-family: var(--fd); font-weight: 800; }
.opt .txt { flex: 1; }
.opt.gone { opacity: .18; text-decoration: line-through; }
.opt.sel { background: linear-gradient(180deg, #F6C445, #D99B1E); color: #2A1A00; border-color: #FFF0B8; }
.opt.sel .let { background: #2A1A00; color: var(--gold); }
.suspense .opt.sel, .opt.sel:disabled { animation: none; }
.opt.right { background: linear-gradient(180deg, #34D671, #15803D); border-color: #BBF7D0; color: #fff; animation: flash .5s 3; }
.opt.right .let { background: #fff; color: #15803D; }
.opt.wrong { background: linear-gradient(180deg, #F87171, #B91C1C); border-color: #FECACA; color: #fff; }
.opt.wrong .let { background: #fff; color: #B91C1C; }
@keyframes flash { 50% { filter: brightness(1.35); } }
@keyframes pulse { 50% { filter: brightness(1.25); transform: scale(1.01); } }
.opt.sel:not(.right):not(.wrong):disabled { animation: pulse .7s infinite; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.1; }
.frac span:first-child { border-bottom: 1.5px solid currentColor; }

.hintbox { margin-top: 14px; background: rgba(255,255,255,.07); border: 1.5px dashed rgba(246,196,69,.5); border-radius: 16px; padding: 12px 16px; }
.hk { margin: 0 0 6px; font-family: var(--fm); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--gold2); }
.univ { margin: 0; padding-left: 18px; }
.bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: end; height: 130px; }
.barc { display: grid; grid-template-rows: 1fr auto; height: 100%; text-align: center; }
.bv { align-self: end; height: var(--p); min-height: 4px; background: linear-gradient(180deg, var(--gold2), var(--gold)); border-radius: 8px 8px 2px 2px; position: relative; }
.bv span { position: absolute; top: -20px; left: 0; right: 0; font-family: var(--fm); font-size: 13px; color: var(--text); }
.barc b { font-family: var(--fd); }

.verdict { margin-top: 18px; border-radius: 20px; padding: 16px 18px; background: rgba(255,255,255,.06); border: 2px solid; }
.verdict.ok { border-color: var(--ok); }
.verdict.no { border-color: var(--no); }
.verdict h3 { font-size: 24px; }
.verdict details { margin: 6px 0 14px; }
.verdict summary { cursor: pointer; font-weight: 700; color: var(--gold2); }
.steps { margin: 10px 0 0; padding-left: 22px; }
.steps li { margin: 4px 0; }
.steps b { color: var(--gold2); }

.side { display: grid; gap: 14px; position: sticky; top: 12px; }
.money { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.m { border-radius: 14px; padding: 8px 6px; text-align: center; background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.14); }
.m span { display: block; font-family: var(--fm); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); }
.m b { font-family: var(--fd); font-size: 17px; white-space: nowrap; }
.m.err b { color: #FCA5A5; }
.m.hit { border-color: var(--gold); background: rgba(246,196,69,.12); }
.m.hit b { color: var(--gold2); }
.helps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.help { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 14px; background: rgba(75,34,168,.55); border: 1.5px solid rgba(255,255,255,.2); color: var(--text); font-weight: 700; font-size: 14px; text-align: left; }
.help:hover:not(:disabled) { border-color: var(--gold); }
.help:disabled { opacity: .35; text-decoration: line-through; }
.help .ico { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,.12); font-size: 14px; flex: none; }
.help small { font-family: var(--fm); color: var(--gold2); }
.stopbtn { width: 100%; }
.ladder { list-style: none; margin: 0; padding: 8px; border-radius: 18px; background: rgba(10,10,38,.55); border: 1px solid rgba(255,255,255,.12); display: grid; gap: 2px; }
.ladder li { display: flex; justify-content: space-between; padding: 3px 12px; border-radius: 8px; font-family: var(--fm); font-size: 14px; color: var(--mute); }
.ladder li.mark { color: var(--text); }
.ladder li.done { color: rgba(185,180,224,.45); }
.ladder li.now { background: var(--gold); color: #2A1A00; font-weight: 700; }
.ladder li.top .v { color: var(--gold2); font-weight: 700; }
.ladder li.top.now .v { color: #2A1A00; }

/* fim */
.end { position: relative; text-align: center; display: grid; justify-items: center; padding-top: 40px; }
.prize { font-size: clamp(44px, 10vw, 96px); background: linear-gradient(180deg, #FFF3C4, var(--gold) 50%, #C9901A); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 18px 0 24px; width: min(560px, 100%); }
.stats div { background: rgba(255,255,255,.06); border-radius: 16px; padding: 10px; }
.stats dt { font-family: var(--fm); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); }
.stats dd { margin: 4px 0 0; font-family: var(--fd); font-weight: 700; font-size: 18px; }
.end .row { justify-content: center; }

/* páginas */
.page { max-width: 760px; margin: 0 auto; }
.note, .empty { color: var(--mute); }
.hall { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 6px; }
.hall li { display: grid; grid-template-columns: 44px 1fr auto auto; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.06); }
.hall .pos { font-family: var(--fd); font-weight: 800; color: var(--gold2); }
.hall small { font-family: var(--fm); color: var(--mute); margin-left: 6px; }
.hall .pz { font-family: var(--fd); font-weight: 800; }
.hall .dt { font-family: var(--fm); font-size: 12px; color: var(--mute); }
.tcards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
.tcards section { background: rgba(255,255,255,.05); border-radius: 18px; padding: 16px; border: 1px solid rgba(255,255,255,.12); }
.tcards p { color: var(--mute); margin-top: 0; }
.th { margin-top: 18px; color: var(--gold2); }

/* modal */
.veil { position: fixed; inset: 0; background: rgba(5,5,20,.72); display: grid; place-items: center; padding: 16px; z-index: 10; backdrop-filter: blur(3px); }
.modal { width: min(520px, 100%); background: linear-gradient(180deg, #241C78, #120F48); border: 2px solid var(--gold); border-radius: 24px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.modal h3 { font-size: 26px; }
.modal p { color: var(--mute); }
.modal form { display: grid; gap: 12px; }
.modal label { display: grid; gap: 6px; font-weight: 700; }
.err { color: #FCA5A5 !important; margin: 0; }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 8px 0 16px; }
.card { aspect-ratio: 2/3; border-radius: 14px; border: 2px solid var(--gold); padding: 0; position: relative; background: repeating-linear-gradient(45deg, #3B2AA6 0 8px, #2B1E86 8px 16px); color: var(--gold2); transition: transform .2s; }
.card:hover:not(:disabled) { transform: translateY(-4px); }
.card .back { font-family: var(--fd); font-weight: 800; font-size: 22px; }
.card .face { display: none; }
.card.open { background: var(--paper); color: #9B1C1C; }
.card.open .back { display: none; }
.card.open .face { display: grid; gap: 2px; font-family: var(--fd); font-weight: 800; font-size: 40px; line-height: 1; }
.card.open .face small { font-family: var(--fb); font-size: 12px; color: #1B1A33; }
.card.dim { opacity: .45; }

/* projeção */
body.proj #app { max-width: 1500px; }
body.proj .qcard { font-size: 24px; }
body.proj .qcard .ask { font-size: 30px; }
body.proj .fig { max-width: 440px; }
body.proj .opt { font-size: 24px; padding: 16px 22px 16px 14px; }
body.proj .stage { grid-template-columns: minmax(0, 1fr) 300px; }

@media (max-width: 860px) {
  .stage { grid-template-columns: 1fr; }
  .side { position: static; order: -1; }
  .ladder { display: none; }
  .helps { grid-template-columns: repeat(4, 1fr); }
  .help { flex-direction: column; gap: 2px; font-size: 12px; text-align: center; padding: 8px 4px; }
  .tcards { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .qcard { padding: 16px; font-size: 16px; }
  .qcard .ask { font-size: 19px; }
  .opt { font-size: 16px; padding: 10px 14px 10px 10px; gap: 10px; }
  .opt .let { width: 32px; height: 32px; }
  .stats { grid-template-columns: 1fr; }
  .hall li { grid-template-columns: 36px 1fr auto; }
  .hall .dt { display: none; }
  .m b { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

[hidden]{display:none!important}
</style>
</head>

/* ---------- Desenho dos sólidos (SVG, fora de escala) ---------- */
const SOLID = {
  a: { f: '#D6F3EE', t: '#B4E9E0', s: '#0B7C70' },
  b: { f: '#FFE3DE', t: '#FFC9BF', s: '#C2372A' },
  c: { f: '#E3E4FC', t: '#C9CBF8', s: '#4338CA' },
  d: { f: '#FFEFD2', t: '#FFE0A6', s: '#B86E00' },

const RED = '#E0322B';
const BLUE = '#2563EB';
const n1 = (v) => (Math.round(v * 10) / 10).toString();
const pt = (p) => `${n1(p[0])},${n1(p[1])}`;
function hull(points) {

  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);

const ROT = { 3: (3 * Math.PI) / 2, 4: Math.PI / 4 + 0.35, 5: (3 * Math.PI) / 2 + 0.2, 6: 0.26, 8: 0.2 };

const backEdge = (P, i) => { const a = P[i][2]; const b = P[(i + 1) % P.length][2]; let m = (a + b) / 2; if (b < a) m += Math.PI; return Math.sin(m) < -0.02; };

const label = (x, y, txt, anchor, color, size) => `<text x="${n1(x)}" y="${n1(y)}" text-anchor="${anchor || 'middle'}" font-size="${size || 13}" font-weight="700" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"${color ? ` style="fill:${color}"` : ''}>${txt}</text>`;
const tagTxt = (W, txt, col) => (txt ? `<g><rect x="${W - 8 - txt.length * 6.6 - 16}" y="6" rx="10" width="${txt.length * 6.6 + 16}" height="20" fill="${col.t}"/><text x="${W - 16}" y="20.5" text-anchor="end" font-size="11" font-weight="700" style="fill:${col.s}">${txt}</text></g>` : '');

/* prisma reto de base regular */
function prismBody(o) {
  const { n, cx = 130, cy = 186, R = 66, k = 0.36, H = 110, col, edge, height, edgeColor } = o;
  const B = basePts(n, cx, cy, R, k);
  const T = B.map((p) => [p[0], p[1] - H, p[2]]);
  let s = `<polygon points="${hull(B.concat(T)).map(pt).join(' ')}" fill="${col.f}" stroke="none"/>`;
  s += `<polygon points="${T.map(pt).join(' ')}" fill="${col.t}" stroke="${col.s}" stroke-width="2" stroke-linejoin="round"/>`;

  let fi = 0; let best = -9;

  const a = B[fi]; const b = B[(fi + 1) % n];

/* pirâmide reta de base regular */
function pyrBody(o) {

  B.forEach((p, i) => { const hid = backEdge(B, i) && backEdge(B, (i - 1 + n) % n); s += line(A, p, col.s, 2, hid); });

/* =========================================================
   BANCO DO SHOW — Geometria Espacial · 9º ano
   Questões inéditas geradas a partir de modelos: a cada partida
   as medidas mudam. Alternativas erradas = erros típicos.

const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const nf = (v, d) => {
  const dd = d == null ? 2 : d;
  const r = Math.round(v * 10 ** dd) / 10 ** dd;
  return r.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: dd });
};
const piS = (k, d) => `${k === 1 ? '' : nf(k, d == null ? 1 : d)}π`;
const fr = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const FIGW = (svg) => `<figure class="fig">${svg}</figure>`;

/* monta a questão: correta + erradas (únicas), embaralhadas em 4 alternativas */
function MQ(o) {
  const seen = new Set([o.correct]);
  const wrong = [];
  (o.wrong || []).forEach((w) => { if (wrong.length < 3 && !seen.has(w)) { seen.add(w); wrong.push(w); } });
  if (wrong.length < 3) return null;
  const opts = shuffle([o.correct].concat(wrong));
  return { lvl: o.lvl, topic: o.topic, body: o.body, fig: o.fig || '', ask: o.ask, opts, ans: opts.indexOf(o.correct), sol: o.sol, tip: o.tip || '' };
}
const steps = (arr) => `<ol class="steps">${arr.map((s) => `<li>${s}</li>`).join('')}</ol>`;
const NOMES = { 3: 'triangular', 4: 'quadrangular', 5: 'pentagonal', 6: 'hexagonal', 8: 'octogonal' };
const ELEM = { faces: 'faces', vertices: 'vértices', arestas: 'arestas' };
const QT = (k) => (k === 'vertices' ? 'Quantos' : 'Quantas');

/* sorteia uma questão do nível, evitando repetir o mesmo modelo na partida */
function drawQuestion(lvl, used) {
  const pool = POOL[lvl];
  const free = pool.filter((f) => !used.has(f));
  for (let t = 0; t < 30; t++) {
    const f = pick(free.length ? free : pool);
    const q = f();
    if (q) { used.add(f); return q; }
  }
  return null;
}

    const b = (act, label, ico, off, extra) => `<button class="help" data-act="${act}" ${off ? 'disabled' : ''}><span class="ico" aria-hidden="true">${ico}</span><span>${label}${extra || ''}</span></button>`;
    return `<div class="helps" role="group" aria-label="Ajudas">
      ${b('pular', 'Pular', '⤼', ph || fin || G.pulos === 0, ` <small>${G.pulos}×</small>`)}
      ${b('cartas', 'Cartas', '♠', ph || G.cartas)}
      ${b('univ', 'Universitários', '🎓', ph || G.univ)}
      ${b('placas', 'Placas', '▮▮', ph || G.placas)}
    </div>`;
  }

  function gameView() {
    const q = G.q;
    const v = vals();
    const lvlName = ['', 'Fácil', 'Médio', 'Difícil', 'Pergunta do milhão'][q.lvl];
    const opts = q.opts.map((o, k) => {
      let cls = 'opt';
      if (G.removed.has(k)) cls += ' gone';
      if (G.sel === k) cls += ' sel';
      if (G.phase === 'reveal') { if (k === q.ans) cls += ' right'; else if (k === G.sel) cls += ' wrong'; }
      const dis = G.phase !== 'ask' || G.removed.has(k);
      return `<button class="${cls}" data-act="pick" data-k="${k}" ${dis ? 'disabled' : ''}><span class="let">${L[k]}</span><span class="txt">${o}</span></button>`;
    }).join('');
    let after = '';
    if (G.phase === 'reveal') {
      const ok = G.sel === q.ans;
      after = `<section class="verdict ${ok ? 'ok' : 'no'}" aria-live="polite">
        <h3>${ok ? (G.i === 15 ? 'Você ganhou o milhão!' : `Certa resposta! ${money(v.acertar)}`) : `Que pena! A resposta certa era ${L[q.ans]}.`}</h3>
        <details ${ok ? '' : 'open'}><summary>Ver a resolução</summary>${q.sol}</details>
        <button class="gold" data-act="${ok ? (G.i === 15 ? 'finishWin' : 'next') : 'finishLose'}">${ok ? (G.i === 15 ? 'Ver resultado' : 'Próxima pergunta') : 'Ver resultado'}</button>
      </section>`;
    }
    return `<main class="game ${q.lvl === 4 ? 'final' : ''}">
      <header class="bar">
        <div class="who"><b>${esc(G.name)}</b> <span>${esc(G.turma)}</span></div>
        <div class="qn">Pergunta <b>${G.i + 1}</b> de 16 · ${lvlName}</div>
        <button class="ghost sm" data-act="quit">Sair</button>
      </header>
      <div class="stage">
        <section class="qbox">
          <p class="topic">${esc(q.topic)}</p>
          <div class="qcard">${q.body}${q.fig}<p class="ask">${q.ask}</p></div>
          ${G.hint ? `<div class="hintbox" aria-live="polite">${G.hint}</div>` : ''}
          <div class="opts">${opts}</div>
          ${after}
        </section>
        <aside class="side">
          <div class="money" aria-label="Valores">
            <div class="m err"><span>Errar</span><b>${moneyS(v.errar)}</b></div>
            <div class="m stop"><span>Parar</span><b>${moneyS(v.parar)}</b></div>
            <div class="m hit"><span>Acertar</span><b>${moneyS(v.acertar)}</b></div>
          </div>
          ${helpsView()}
          <button class="ghost stopbtn" data-act="stop" ${G.phase !== 'ask' ? 'disabled' : ''}>Parar e levar ${moneyS(v.parar)}</button>
          ${ladderView()}
        </aside>
      </div>
    </main>`;
  }

  function endView() {
    const r = G.result;
    const msg = r.prize >= 1000000 ? 'Milionário da Geometria Espacial!' : r.prize >= 100000 ? 'Que jogo! Você foi longe.' : r.prize >= 10000 ? 'Bom jogo! Revise as resoluções e tente de novo.' : 'Jogo de aquecimento. As medidas mudam: tente de novo!';
    return `<main class="end">
      <div class="spot" aria-hidden="true"></div>
      <p class="kicker">${esc(G.name)} · ${esc(G.turma)}</p>
      <h1 class="prize">${money(r.prize)}</h1>
      <p class="lead">${msg}</p>
      <dl class="stats"><div><dt>Acertos</dt><dd>${r.hits}</dd></div><div><dt>Chegou até</dt><dd>Pergunta ${r.reached}</dd></div><div><dt>Como terminou</dt><dd>${r.how}</dd></div></dl>
      <div class="row">
        <button class="gold" data-act="again">Jogar de novo</button>
        <button class="ghost" data-act="copy">Copiar resultado</button>
        <button class="ghost" data-act="hall">Hall da fama</button>
      </div>
    </main>`;
  }

  function hallList(rows) {
    if (!rows.length) return '<p class="empty">Ninguém jogou neste computador ainda.</p>';
    return `<ol class="hall">${rows.map((h, k) => `<li><span class="pos">${k + 1}º</span><span class="nm">${esc(h.name)} <small>${esc(h.turma)}</small></span><span class="pz">${moneyS(h.prize)}</span><span class="dt">${esc(h.date)}</span></li>`).join('')}</ol>`;
  }
  const sortedHall = () => S.hall.slice().sort((a, b) => b.prize - a.prize || b.hits - a.hits || a.t - b.t);
  function hallView() {
    return `<main class="page">
      <header class="bar"><h2>Hall da fama</h2><button class="ghost sm" data-act="home">Voltar</button></header>
      <p class="note">Melhores resultados jogados neste computador.</p>
      ${hallList(sortedHall().slice(0, 20))}
    </main>`;
  }
  function teacherView() {
    const by = (t) => sortedHall().filter((h) => h.turma === t);
    return `<main class="page">
      <header class="bar"><h2>Área do professor</h2><button class="ghost sm" data-act="home">Voltar</button></header>
      <div class="tcards">
        <section><h3>Modo projeção</h3><p>Aumenta letras e figuras para jogar com a turma no projetor. A turma vota e você clica na alternativa.</p>
          <button class="gold" data-act="proj">${projection ? 'Desligar' : 'Ligar'} modo projeção</button></section>
        <section><h3>Partida da turma</h3><p>Começa um jogo com o nome “Turma” para fazer coletivamente.</p>
          <div class="row">${TURMAS.map((t) => `<button class="ghost" data-act="classgame" data-t="${t}">Jogar com a ${t}</button>`).join('')}</div></section>
      </div>
      ${TURMAS.map((t) => `<h3 class="th">${t}</h3>${hallList(by(t))}`).join('')}
      <button class="ghost danger" data-act="clear">Apagar o hall da fama deste computador</button>
    </main>`;
  }

  function modalView() {
    if (!modal) return '';
    const m = modal;
    let inner = '';
    if (m.type === 'confirm') inner = `<h3>Está certo disso?</h3><p>Você escolheu <b>${L[G.sel]}</b>.</p><div class="row"><button class="gold" data-act="yes">Sim, estou certo</button><button class="ghost" data-act="no">Não, quero pensar</button></div>`;
    if (m.type === 'stop') inner = `<h3>Quer mesmo parar?</h3><p>Você leva <b>${money(vals().parar)}</b> para casa.</p><div class="row"><button class="gold" data-act="stopYes">Sim, parar</button><button class="ghost" data-act="close">Continuar jogando</button></div>`;
    if (m.type === 'quit') inner = `<h3>Sair da partida?</h3><p>O jogo atual não será salvo.</p><div class="row"><button class="gold" data-act="quitYes">Sair</button><button class="ghost" data-act="close">Voltar ao jogo</button></div>`;
    if (m.type === 'cards') {
      inner = `<h3>Escolha uma carta</h3><p>Rei elimina nenhuma, Ás elimina 1, 2 elimina 2 e 3 elimina 3 alternativas erradas.</p>
      <div class="cards">${m.deck.map((c, k) => `<button class="card ${m.open === k ? 'open' : ''} ${m.open != null && m.open !== k ? 'dim' : ''}" data-act="card" data-k="${k}" ${m.open != null ? 'disabled' : ''} aria-label="Carta ${k + 1}"><span class="back">G9</span><span class="face">${c.s}<small>${c.n === 0 ? 'nenhuma' : c.n === 1 ? 'elimina 1' : `elimina ${c.n}`}</small></span></button>`).join('')}</div>
      ${m.open != null ? '<div class="row"><button class="gold" data-act="close">Voltar à pergunta</button></div>' : ''}`;
    }
    if (m.type === 'pin') inner = `<h3>Área do professor</h3><form data-form="pin" autocomplete="off"><label>Senha<input name="pin" type="password" required autofocus></label>${m.err ? '<p class="err">Senha incorreta.</p>' : ''}<div class="row"><button class="gold" type="submit">Entrar</button><button class="ghost" type="button" data-act="close">Cancelar</button></div></form>`;
    return `<div class="veil" data-act="${m.type === 'cards' && m.open == null ? '' : 'veil'}"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`;
  }

  function render() {
    document.body.classList.toggle('proj', projection);
    let html = '';
    if (screen === 'home') html = homeView();
    else if (screen === 'game') html = gameView();
    else if (screen === 'end') html = endView();
    else if (screen === 'hall') html = hallView();
    else if (screen === 'teacher') html = teacherView();
    $app.innerHTML = html + modalView();
    const f = $app.querySelector('.modal input');
    if (f) f.focus();
  }
  const go = (s) => { screen = s; modal = null; render(); window.scrollTo(0, 0); };

  /* ---------- ajudas ---------- */
  const wrongIdx = () => [0, 1, 2, 3].filter((k) => k !== G.q.ans && !G.removed.has(k));
  function useUniv() {
    const acc = [0, 0.9, 0.75, 0.6, 0.5][G.q.lvl];
    const live = [0, 1, 2, 3].filter((k) => !G.removed.has(k));
    const names = ['Ana (Engenharia)', 'Caio (Arquitetura)', 'Bia (Matemática)'];
    const ops = names.map((n) => {
      const k = Math.random() < acc ? G.q.ans : pick(live.filter((x) => x !== G.q.ans).concat(G.q.ans));
      return `<li><b>${n}</b>: “Acho que é a <b>${L[k]}</b>.”</li>`;
    });
    G.univ = true;
    G.hint = `<p class="hk">Universitários</p><ul class="univ">${ops.join('')}</ul>`;
  }
  function usePlacas() {
    const acc = [0, 0.7, 0.55, 0.42, 0.35][G.q.lvl];
    const live = [0, 1, 2, 3].filter((k) => !G.removed.has(k));
    const w = {};
    let rest = 1 - acc;
    live.forEach((k) => { w[k] = k === G.q.ans ? acc : 0; });
    const others = live.filter((k) => k !== G.q.ans);
    others.forEach((k, j) => { const share = j === others.length - 1 ? rest : rest * (0.25 + Math.random() * 0.5); w[k] += share; rest -= share; });
    if (!others.length) w[G.q.ans] = 1;
    // ruído: às vezes a plateia se engana
    const pc = {};
    let tot = 0;
    live.forEach((k) => { pc[k] = Math.max(1, Math.round((w[k] + (Math.random() - 0.5) * 0.12) * 100)); tot += pc[k]; });
    live.forEach((k) => { pc[k] = Math.round((pc[k] * 100) / tot); });
    G.placas = true;
    G.hint = `<p class="hk">Placas da plateia</p><div class="bars">${[0, 1, 2, 3].map((k) => `<div class="barc"><div class="bv" style="--p:${pc[k] || 0}%"><span>${pc[k] || 0}%</span></div><b>${L[k]}</b></div>`).join('')}</div>`;
  }
  function openCards() {
    const deck = [{ s: 'K', n: 0 }, { s: 'A', n: 1 }, { s: '2', n: 2 }, { s: '3', n: 3 }].sort(() => Math.random() - 0.5);
    modal = { type: 'cards', deck, open: null };
    G.cartas = true;
  }
  function flipCard(k) {
    const c = modal.deck[k];
    modal.open = k;
    const w = wrongIdx().sort(() => Math.random() - 0.5).slice(0, c.n);
    w.forEach((x) => G.removed.add(x));
  }

  /* ---------- fluxo ---------- */
  function finish(prize, how) {
    G.result = { prize, how, hits: G.hits, reached: G.i + 1 };
    const d = new Date();
    S.hall.push({ name: G.name, turma: G.turma, prize, hits: G.hits, t: d.getTime(), date: d.toLocaleDateString('pt-BR') });
    if (S.hall.length > 300) S.hall = sortedHall().slice(0, 300);
    save();
    go('end');
  }
  function reveal() {
    G.phase = 'suspense';
    modal = null;
    render();
    setTimeout(() => {
      G.phase = 'reveal';
      if (G.sel === G.q.ans) G.hits++;
      render();
      const v = $app.querySelector('.verdict');
      if (v && v.scrollIntoView) v.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 1400);
  }
  function nextQ() {
    G.i++;
    G.q = drawQuestion(LEVEL_OF(G.i), G.used);
    G.removed = new Set(); G.sel = null; G.phase = 'ask'; G.hint = null;
    render();
    window.scrollTo(0, 0);
  }

  function copyText() {
    const r = G.result;
    const t = `Show do Milhão · Geometria Espacial\n${G.name} (${G.turma})\nPrêmio: ${money(r.prize)}\nAcertos: ${r.hits} · chegou até a pergunta ${r.reached}\n${new Date().toLocaleString('pt-BR')}`;
    const done = () => { const b = $app.querySelector('[data-act="copy"]'); if (b) b.textContent = 'Copiado!'; };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => window.prompt('Copie o resultado:', t));
    else window.prompt('Copie o resultado:', t);
  }

  $app.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const a = el.dataset.act;
    if (a === 'veil') { if (e.target === el && modal && modal.type !== 'cards') { modal = null; render(); } else if (e.target === el && modal && modal.type === 'cards' && modal.open != null) { modal = null; render(); } return; }
    if (!a) return;
    switch (a) {
      case 'teacher': modal = { type: 'pin' }; render(); break;
      case 'hall': go('hall'); break;
      case 'home': go('home'); break;
      case 'close': modal = null; render(); break;
      case 'pick': if (G.phase !== 'ask') return; G.sel = +el.dataset.k; modal = { type: 'confirm' }; render(); break;
      case 'yes': reveal(); break;
      case 'no': G.sel = null; modal = null; render(); break;
      case 'next': nextQ(); break;
      case 'finishWin': finish(1000000, 'Acertou tudo!'); break;
      case 'finishLose': finish(vals().errar, 'Errou'); break;
      case 'stop': modal = { type: 'stop' }; render(); break;
      case 'stopYes': finish(vals().parar, 'Parou'); break;
      case 'quit': modal = { type: 'quit' }; render(); break;
      case 'quitYes': G = null; go('home'); break;
      case 'pular': if (G.pulos > 0 && G.i < 15) { G.pulos--; G.q = drawQuestion(LEVEL_OF(G.i), G.used); G.removed = new Set(); G.hint = null; render(); } break;
      case 'cartas': openCards(); render(); break;
      case 'card': flipCard(+el.dataset.k); render(); break;
      case 'univ': useUniv(); render(); break;
      case 'placas': usePlacas(); render(); break;
      case 'again': newGame(G.name, G.turma); go('game'); break;
      case 'copy': copyText(); break;
      case 'proj': projection = !projection; render(); break;
      case 'classgame': newGame('Turma', el.dataset.t); projection = true; go('game'); break;
      case 'clear': if (window.confirm('Apagar todos os resultados deste computador?')) { S.hall = []; save(); render(); } break;
      default: break;
    }
  });
  $app.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.dataset.form === 'start') {
      const name = f.nome.value.trim().replace(/\s+/g, ' ');
      const tr = f.querySelector('input[name="turma"]:checked');
      if (!name || !tr) return;
      S.last = { name, turma: tr.value }; save();
      newGame(name, tr.value);
      go('game');
    }
    if (f.dataset.form === 'pin') {
      if (fnv('missao:' + norm(f.pin.value)) === PIN_HASH) go('teacher');
      else { modal = { type: 'pin', err: true }; render(); }
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal && !(modal.type === 'cards' && modal.open == null)) { modal = null; render(); return; }
    if (screen === 'game' && !modal && G && G.phase === 'ask') {
      const k = 'abcd'.indexOf(e.key.toLowerCase());
      if (k >= 0 && !G.removed.has(k) && !(e.target && e.target.tagName === 'INPUT')) { G.sel = k; modal = { type: 'confirm' }; render(); }
    }
  });
  render();
}());

</script>
</body>
</html>
