  }
  const totalStars = (p) => { const pr = p || P; return PHASES.reduce((s, x) => s + ((pr.ph[x.id] && pr.ph[x.id].stars) || 0), 0); };
  const badgeCount = (p) => Object.keys((p || P).badges).length;

  function answer(qid, L) {
    const q = Q[qid];
    const st = P.q[qid] || (P.q[qid] = { w: [], done: false, ft: false, xp: 0 });
    if (st.done || st.w.indexOf(L) !== -1) return null;
    const lvBefore = levelOf(P.xp).idx;
    const badges = [];
    const award = (id) => { if (!P.badges[id]) { P.badges[id] = Date.now(); badges.push(BADGES.find((b) => b.id === id)); } };
    if (L !== q.ans) {
      st.w.push(L);
      P.streak = 0;
      save();
      return { ok: false, L, wrongs: st.w.length };
    }
    const wrongs = st.w.length;
    const gained = stakeOf(q, wrongs);
    let combo = 0;
    if (wrongs === 0) {
      st.ft = true;
      P.streak += 1;
      P.best = Math.max(P.best, P.streak);
      if (P.streak >= COMBO_MIN) combo = COMBO_BONUS;
    }
    st.done = true; st.xp = gained + combo; st.at = Date.now();
    P.xp += gained + combo;
    award('start');
    if (P.streak >= 5) award('fire5');
    if (P.streak >= 10) award('fire10');
    if (wrongs >= 2) award('grit');
    if (doneCount() >= HALF) award('half');
    let phaseJust = null;
    if (phaseDone(q.ph) && !(P.ph[q.ph] && P.ph[q.ph].done)) {
      const qs = phaseQs(q.ph);
      const ft = qs.filter((x) => P.q[x.id].ft).length;
      const stars = starsFor(ft, qs.length);
      P.ph[q.ph] = { done: true, stars, ft, at: Date.now() };
      P.xp += PHASE_BONUS;
      P.pending = q.ph;
      phaseJust = q.ph;
      if (stars === 3) award('m_' + q.ph);
      if (ft === qs.length) award('perfect');
      if (doneCount() === TOTAL) { P.done = Date.now(); award('done'); }
    }
    if (levelOf(P.xp).idx === LEVELS.length - 1) award('legend');
    save();
    const lv = levelOf(P.xp);
    return { ok: true, L, wrongs, gained, combo, phaseJust, badges, levelUp: lv.idx > lvBefore ? lv : null };
  }

  /* ---------------- Navegação ---------------- */
  const APP = document.getElementById('app');
  let route = { view: 'welcome', id: null };
  const freshUI = () => ({ sel: null, hint: false, reveal: false, res: null, xpFrom: null });
  let ui = freshUI();

  function render() {
    if (!P && route.view !== 'welcome' && route.view !== 'teacher') route = { view: 'welcome', id: null };
    if (route.view === 'teacher' && !teacherOK) route = { view: P ? 'map' : 'welcome', id: null };
    if (route.view === 'phase' && !(PH[route.id] && phaseUnlocked(route.id))) route = { view: 'map', id: null };
    if (route.view === 'question' && !(Q[route.id] && phaseUnlocked(Q[route.id].ph))) route = { view: 'map', id: null };
    const views = { welcome: viewWelcome, map: viewMap, phase: viewPhase, question: viewQuestion, badges: viewBadges, cert: viewCert, teacher: viewTeacher };
    if (route.view !== 'teacher') stopRankTimer();
    APP.innerHTML = (views[route.view] || viewWelcome)(route.id);
    document.body.setAttribute('data-view', route.view);
    afterRender();
  }
  function go(view, id, opts) {
    const o = opts || {};
    route = { view, id: id || null };
    if (view === 'question') ui = freshUI();
    closeModal(true);
    render();
    if (!o.keepScroll) window.scrollTo(0, 0);
    const h = APP.querySelector('h1');
    if (h) { h.setAttribute('tabindex', '-1'); try { h.focus({ preventScroll: true }); } catch (e) { /* ok */ } }
  }
  function afterRender() {
    if (route.view === 'teacher' && !rank.timer) startRankTimer();
    if (ui.xpFrom != null) { const el = $('[data-xp]'); if (el) countUp(el, ui.xpFrom, P.xp); ui.xpFrom = null; }
    if (P && P.pending && (route.view === 'map' || route.view === 'phase')) {
      const pid = P.pending;
      setTimeout(() => { if (P && P.pending === pid) celebrate(pid); }, 260);
      return;
    }
    if (P && route.view === 'phase' && !P.intro[route.id]) {
      const pid = route.id;
      setTimeout(() => { if (route.view === 'phase' && route.id === pid && $('#modal-root').hidden) openTheory(pid); }, 220);
    }
  }

  /* ---------------- Peças de interface ---------------- */
  const AVC = ['var(--p1-deep)', 'var(--p2-deep)', 'var(--p3-deep)', 'var(--p4-deep)', 'var(--p5-deep)', 'var(--p6-deep)', 'var(--p7-deep)', 'var(--brand-deep)'];
  function avatar(p, size) {
    const parts = String(p.name || '?').trim().split(/\s+/);
    const ini = ((parts[0] || '?').charAt(0) + (parts.length > 1 ? parts[parts.length - 1].charAt(0) : '')).toUpperCase();
    return `<span class="avatar ${size || ''}" style="--av:${AVC[fnv(p.id || p.name || '') % AVC.length]}" aria-hidden="true">${esc(ini)}</span>`;
  }
  const sandboxBar = () => (sandbox ? `<div class="sandbox-bar"><div class="wrap sandbox-in"><span>${ic('gradCap')} Modo aula: tudo liberado, nada é salvo</span><button type="button" data-act="exit-sandbox">Sair</button></div></div>` : '');
  function topbar(o) {
    const opt = o || {};
    const left = opt.back
      ? `<button type="button" class="icon-btn" data-act="${opt.back.act}"${opt.back.id ? ` data-id="${opt.back.id}"` : ''} aria-label="${opt.back.label}">${ic('arrowLeft')}</button>`
      : `<div class="brand-mini"><span class="brand-dot">${ic('target')}</span><span class="bm-text">${COURSE.brandMini} <small class="bm-tag">${COURSE.serie}</small></span></div>`;
    const mid = opt.title ? `<div class="tb-title"><span class="tb-sub">${opt.sub || ''}</span><span class="tb-main">${opt.title}</span></div>` : '<div class="tb-spacer"></div>';
    const stats = P
      ? `<div class="tb-stats"><span class="stat-chip xp" title="XP total">${ic('zap', 'ic-fill')}<b data-xp>${fmt(P.xp)}</b><span class="u">XP</span></span><span class="stat-chip streak${P.streak >= COMBO_MIN ? ' hot' : ''}" title="Acertos de primeira em sequência">${ic('flame')}<b>${P.streak}</b><span class="sr-only"> acertos de primeira em sequência</span></span><button type="button" class="icon-btn" data-act="menu" aria-label="Abrir menu">${avatar(P, 'sm')}</button></div>`
      : '';
    return `${sandboxBar()}<header class="topbar${opt.ph ? ' ph-' + opt.ph : ''}"><div class="wrap topbar-in">${left}${mid}${stats}</div></header>`;
  }
  function ring(d, n) {
    const r = 22.5;
    const c = 2 * Math.PI * r;
    const fg = d > 0 ? `<circle class="r-fg" cx="27" cy="27" r="${r}" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - d / n)).toFixed(2)}"/>` : '';
    return `<span class="ring" aria-hidden="true"><svg viewBox="0 0 54 54"><circle class="r-bg" cx="27" cy="27" r="${r}" fill="none" stroke-width="5"/>${fg}</svg><b>${d}/${n}</b></span>`;
  }
  const starsHTML = (n) => `<span class="stars" role="img" aria-label="${n} de 3 estrelas">${[1, 2, 3].map((i) => `<span class="${i <= n ? 'on' : ''}">${ic('star', 'ic-fill')}</span>`).join('')}</span>`;

  /* ---------------- Tela: boas-vindas ---------------- */

          <div class="card">

              <li class="ph-b"><span class="how-n">2</span><div><b>Acerte para concluir</b><p>Errou? Tente de novo, mas a questão passa a valer menos XP. Depois do 2º erro, aparece uma dica.</p></div></li>
              <li class="ph-c"><span class="how-n">3</span><div><b>Libere a próxima fase</b><p>Ganhe estrelas e medalhas e suba de nível até ${LEVELS[LEVELS.length - 1].name}.</p></div></li>

  /* ---------------- Tela: trilha ---------------- */
  function phaseCard(ph) {
    const qs = phaseQs(ph.id);
    const d = qs.filter((q) => isDone(q.id)).length;
    const n = qs.length;
    const unlocked = phaseUnlocked(ph.id);
    const complete = d === n;
    const state = complete ? 'done' : !unlocked ? 'locked' : d ? 'active' : 'open';
    const prev = PHASES[ph.n - 2];
    const left = prev ? phaseQs(prev.id).filter((q) => !isDone(q.id)).length : 0;
    const stars = (P.ph[ph.id] && P.ph[ph.id].stars) || 0;
    const sheet = qs.map((q, i) => { const s = P.q[q.id]; return `<span class="mini-b${s && s.done ? ' done' : s && s.w && s.w.length ? ' tried' : ''}">${i + 1}</span>`; }).join('');
    const foot = state === 'locked'
      ? (prev && !seqUnlocked(ph.id)
        ? `<p class="ph-lock">${ic('lock')} Conclua ${prev.name} para liberar: ${plural(left, 'falta', 'faltam')} ${left} ${plural(left, 'questão', 'questões')}</p>`
        : `<p class="ph-lock">${ic('lock')} Aguardando o professor liberar esta fase na aula.</p>`)
      : `${complete ? starsHTML(stars) : `<span class="ph-status">${d ? `${d} de ${n} concluídas` : `${n} questões`}</span>`}<button type="button" class="btn btn-ph btn-sm" data-act="phase" data-id="${ph.id}">${complete ? 'Revisar' : d ? 'Continuar' : 'Começar'} ${ic('arrowRight')}</button>`;
    return `<li class="phase ph-${ph.id} is-${state}">
      <div class="ph-node" aria-hidden="true">${state === 'locked' ? ic('lock') : state === 'done' ? ic('check') : ph.n}</div>
      <article class="ph-card" aria-label="Fase ${ph.n}: ${ph.name}${state === 'locked' ? ' (bloqueada)' : ''}">
        <div class="ph-top"><span class="ph-icon">${ic(ph.icon)}</span><div><span class="eyebrow">Fase ${ph.n} · ${ph.aula}</span><h3 class="ph-name">${ph.name}</h3></div>${ring(d, n)}</div>
        <p class="ph-topics">${ph.topics.join(' · ')}</p>
        <div class="ph-sheet" role="img" aria-label="${d} de ${n} questões concluídas">${sheet}</div>
        <div class="ph-foot">${foot}</div>
      </article>
    </li>`;
  }
  function viewMap() {
    const done = doneCount();
    const lv = levelOf(P.xp);
    const span = lv.next ? lv.next.min - lv.min : 1;
    const pct = lv.next ? Math.max(0, Math.min(100, ((P.xp - lv.min) / span) * 100)) : 100;
    const nextPh = PHASES.find((ph) => !phaseDone(ph.id));
    const nextOk = nextPh && phaseUnlocked(nextPh.id);
    return `${topbar()}
    <main class="wrap map">
      <aside class="card player" aria-label="Seu perfil">
        <div class="pl-head">${avatar(P, 'lg')}<div><h1 class="pl-name">${esc(P.name)}</h1><span class="pl-turma">${sandbox ? 'Projeção em sala' : `Turma ${esc(P.turma)}`}</span></div></div>
        <div>
          <div class="level-top"><span class="level-badge">${ic(lv.icon)} Nível ${lv.idx + 1}</span><b class="level-name">${lv.name}</b></div>
          <div class="xpbar" role="progressbar" aria-label="Progresso de nível" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><span style="width:${pct.toFixed(1)}%"></span></div>
          <p class="level-note">${lv.next ? `<b>${fmt(P.xp)} XP</b> · faltam ${fmt(lv.next.min - P.xp)} para <b>${lv.next.name}</b>` : `<b>${fmt(P.xp)} XP</b> · nível máximo alcançado`}</p>
        </div>
        <dl class="pl-stats">
          <div><dt>Questões</dt><dd>${done}<small>/${TOTAL}</small></dd></div>
          <div><dt>De primeira</dt><dd>${ftCount()}</dd></div>
          <div><dt>Estrelas</dt><dd>${totalStars()}<small>/${MAXSTARS}</small></dd></div>
          <div><dt>Melhor sequência</dt><dd>${P.best}</dd></div>
        </dl>
        ${nextPh
          ? (nextOk
            ? `<button type="button" class="btn btn-primary btn-lg btn-block" data-act="phase" data-id="${nextPh.id}">${done ? 'Continuar' : 'Começar'}: ${nextPh.name} ${ic('arrowRight')}</button>`
            : `<p class="wait-note">${ic('lock')}<span><b>Fase ${nextPh.n} · ${nextPh.name}</b> será liberada pelo professor na aula.</span></p>`)
          : `<button type="button" class="btn btn-lime btn-lg btn-block" data-act="cert">${ic('award')} Ver meu certificado</button>`}
        <div class="pl-links">

      <section aria-labelledby="trail-h">

        <ol class="phases">${PHASES.map(phaseCard).join('')}</ol>
      </section>

  }

  /* ---------------- Tela: fase ---------------- */

  }
  function qRow(q, i) {

    const t = tierOf(q);
    const state = s && s.done ? 'done' : s && s.w && s.w.length ? 'tried' : 'new';
    const right = state === 'done'
      ? `<span class="qr-xp done">${ic('check')} +${s.xp} XP</span>`
      : `<span class="tier tier-${t.cls}">${t.label}</span><span class="qr-xp">${ic('zap')} ${stakeOf(q, (s && s.w && s.w.length) || 0)} XP</span>`;
    return `<li><button type="button" class="qrow is-${state}" data-act="q" data-id="${q.id}">
      <span class="qr-b" aria-hidden="true">${state === 'done' ? q.ans : String(i + 1).padStart(2, '0')}</span>
      <span class="qr-main"><span class="qr-title">${q.title}</span><span class="qr-meta">${q.src}${q.rate != null ? ` · ${q.rate}% acertaram` : ''}${state === 'tried' ? ` · ${s.w.length} ${plural(s.w.length, 'erro', 'erros')}` : ''}</span></span>
      <span class="qr-right">${right}</span>
    </button></li>`;
  }
  function viewPhase(pid) {
    const ph = PH[pid];
    const qs = phaseQs(pid);
    const d = qs.filter((q) => isDone(q.id)).length;
    const n = qs.length;
    const xpPh = qs.reduce((s, q) => s + ((P.q[q.id] && P.q[q.id].xp) || 0), 0) + (P.ph[pid] && P.ph[pid].done ? PHASE_BONUS : 0);
    const next = qs.find((q) => !isDone(q.id));
    return `${topbar({ back: { act: 'map', label: 'Voltar à trilha' }, title: ph.name, sub: `Fase ${ph.n} de ${PHASES.length}`, ph: pid })}
    <section class="ph-hero ph-${pid}">
      <div class="wrap ph-hero-in">
        <div class="ph-hero-icon">${ic(ph.icon)}</div>
        <div><span class="eyebrow on-dark">Fase ${ph.n} · ${ph.aula}</span><h1 class="ph-hero-title">${ph.name}</h1><ul class="ph-hero-topics">${ph.topics.map((t) => `<li>${t}</li>`).join('')}</ul></div>
        <div class="ph-hero-side">
          <div class="ph-progress"><div class="ph-progress-bar" role="progressbar" aria-label="Questões concluídas na fase" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${d}"><span style="width:${((d / n) * 100).toFixed(1)}%"></span></div><span>${d}/${n} concluídas · ${fmt(xpPh)} XP nesta fase</span></div>
          <div class="ph-hero-actions">
            <button type="button" class="btn btn-onhero" data-act="theory" data-id="${pid}">${ic('book')} Revisão relâmpago</button>
            ${next ? `<button type="button" class="btn btn-lime" data-act="q" data-id="${next.id}">${d ? 'Continuar' : 'Começar'} ${ic('arrowRight')}</button>` : ''}
          </div>

    <main class="wrap ph-body ph-${pid}">

      <ol class="qlist" aria-label="Questões da fase">${qs.map(qRow).join('')}</ol>

  }

  /* ---------------- Tela: questão ---------------- */
  function optHTML(q, L, s, finished) {
    const wrong = s.w.indexOf(L) !== -1;
    const right = finished && L === q.ans;
    const sel = !finished && !wrong && ui.sel === L;
    const dis = finished || wrong;
    const cls = `opt${wrong ? ' is-wrong' : ''}${right ? ' is-right' : ''}${sel ? ' is-sel' : ''}`;
    const mark = wrong ? `<span class="opt-mark">${ic('x')}</span>` : right ? `<span class="opt-mark">${ic('check')}</span>` : '';
    const label = `Alternativa ${L}${wrong ? ', descartada' : ''}${right ? ', correta' : ''}`;
    const attrs = `type="button" class="${cls}" data-act="pick" data-l="${L}" aria-pressed="${sel}"${dis ? ' aria-disabled="true"' : ''}`;
    if (q.imgOpts) {
      const im = IMG[q.id + L];
      return `<button ${attrs} aria-label="${label}"><span class="opt-head"><span class="bubble">${L}</span>${mark}</span><span class="opt-fig paper"><img src="${im.uri}" width="${im.w}" height="${im.h}" alt=""></span></button>`;
    }
    return `<button ${attrs}><span class="bubble" aria-hidden="true">${L}</span><span class="opt-text"><span class="sr-only">${label}: </span>${q.opts[L]}</span>${mark}</button>`;
  }
  function solutionHTML(q) {
    return `<section class="solution" aria-label="Resolução comentada">
      <h2 class="sol-title">${ic('book')} Resolução comentada</h2>
      <div class="sol-body">${q.sol}</div>
      ${q.trap ? `<p class="trap">${ic('alert')}<span><b>Pegadinha:</b> ${q.trap}</span></p>` : ''}
      <p class="sol-answer">Resposta: <span class="ans-b">${q.ans}</span>${q.imgOpts ? `<span>Figura ${q.ans}</span>` : `<span>${q.opts[q.ans]}</span>`}</p>
    </section>`;
  }
  function feedbackHTML(q, s) {
    const r = ui.res;
    if (s.done) {
      const fresh = r && r.ok;
      const tries = s.w.length + 1;
      const head = `<div class="fb-head"><span class="fb-ic">${ic('check')}</span><div><b>${fresh ? pickOne(PRAISE) : 'Questão concluída'}</b><span>Alternativa ${q.ans} · ${s.ft ? 'de primeira' : `na ${tries}ª tentativa`}</span></div></div>`;
      const gains = fresh
        ? `<span class="gain">${ic('zap', 'ic-fill')} +${r.gained} XP</span>${r.combo ? `<span class="gain combo">${ic('flame')} ${P.streak} seguidas: +${r.combo} XP</span>` : ''}${r.phaseJust ? `<span class="gain">${ic('trophy')} Bônus da fase: +${PHASE_BONUS} XP</span>` : ''}`
        : `<span class="gain">${ic('zap', 'ic-fill')} +${s.xp} XP</span>`;
      return `<div class="fb fb-ok" role="status">${head}<div class="fb-gains">${gains}</div></div>${solutionHTML(q)}`;
    }
    if (sandbox && ui.reveal) return solutionHTML(q);
    if (!s.w.length) return '';
    const fresh = r && !r.ok;
    const last = s.w[s.w.length - 1];
    const msg = fresh
      ? `<b>Ainda não: a ${last} não é a resposta.</b><span>Agora a questão vale ${stakeOf(q, s.w.length)} XP. Tente outra alternativa.</span>`
      : `<b>Você já descartou: ${s.w.join(', ')}</b><span>A questão vale ${stakeOf(q, s.w.length)} XP agora. Continue tentando.</span>`;
    let h = `<div class="fb fb-bad" role="status"><div class="fb-head"><span class="fb-ic">${ic('x')}</span><div>${msg}</div></div></div>`;
    if (s.w.length >= 2) {
      h += `<div class="hint${ui.hint ? ' open' : ''}"><button type="button" class="hint-toggle" data-act="hint" aria-expanded="${ui.hint}">${ic('lightbulb')}<b>Dica liberada</b><span>${ui.hint ? 'Esconder' : 'Ver dica'}</span></button>${ui.hint ? `<div class="hint-body">${q.hint}</div>` : ''}</div>`;
    } else {
      h += `<p class="fb-note">${ic('lightbulb')} Depois do 2º erro, uma dica é liberada.</p>`;
    }
    return h;
  }
  function nextQuestion(q) {
    if (sandbox) {
      const i = QUESTIONS.indexOf(q);
      return QUESTIONS[i + 1] || null;
    }
    const qs = phaseQs(q.ph);
    const i = qs.indexOf(q);
    for (let k = 1; k <= qs.length; k++) { const c = qs[(i + k) % qs.length]; if (!isDone(c.id)) return c; }
    return null;
  }

  /* ---------------- Tela: certificado ---------------- */
  function certCode(name, turma, xp, ft, stars) {
    const base = `${norm(name)}|${String(turma).toUpperCase()}|${xp}|${ft}|${stars}|${COURSE.certSalt}`;
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let x = fnv(base);
    let y = fnv(base.split('').reverse().join('') + '#');
    let out = '';
    for (let i = 0; i < 4; i++) { out += A[x % 32]; x = Math.floor(x / 32); }
    for (let i = 0; i < 4; i++) { out += A[y % 32]; y = Math.floor(y / 32); }
    return out.slice(0, 4) + '-' + out.slice(4);
  }

  let lastFocus = null;
  function openModal(html, o) {

    root.hidden = false;
    document.body.classList.add('has-modal');
    if (!opt.keepToasts) $$('#toast-root .toast').forEach((t) => t.remove());
    const f = root.querySelector('[data-autofocus]') || root.querySelector('.modal-card input, .modal-card .btn, .modal-card .menu-item');
    if (f) setTimeout(() => { try { f.focus({ preventScroll: true }); } catch (e) { /* ok */ } }, 40);

  /* ---------------- Toasts e XP flutuante ---------------- */
  function toast(html, o) {
    const opt = o || {};
    const el = document.createElement('div');
    el.className = `toast ${opt.kind || ''}`;
    el.innerHTML = `${opt.icon ? ic(opt.icon) : ''}<div>${html}</div>`;
    $('#toast-root').appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
    setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 320); }, opt.ms || 3400);
  }
  function floatXP(n) {
    if (!n) return;
    const chip = $('.stat-chip.xp');
    if (!chip) return;
    const r = chip.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'xp-float';
    el.textContent = `+${n} XP`;
    el.style.left = `${r.left + r.width / 2}px`;
    el.style.top = `${r.bottom + 8}px`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1300);
  }
  function countUp(el, from, to) {
    if (reduced() || from === to) { el.textContent = fmt(to); return; }
    const t0 = performance.now();
    const dur = 900;
    el.textContent = fmt(from);
    const step = (t) => {
      const k = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(Math.round(from + (to - from) * e));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /* ---------------- Confete ---------------- */
  const fxCanvas = document.getElementById('fx');
  const fx = fxCanvas.getContext('2d');
  let parts = [];
  let raf = 0;
  const CONF = ['#FF6347', '#F59E0B', '#E84B8A', '#7A5AF8', '#2D8CEB', '#0FAE95', '#3FA34D', '#FFC23D'];
  function sizeFx() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    fxCanvas.width = Math.round(window.innerWidth * dpr);
    fxCanvas.height = Math.round(window.innerHeight * dpr);
    fx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function confetti(x, y, n, power) {
    if (reduced()) return;
    if (!parts.length) sizeFx();
    const pw = power || 1;
    for (let i = 0; i < (n || 70); i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.15;
      const sp = (5 + Math.random() * 9) * pw;
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35, c: CONF[i % CONF.length], t: 0, ttl: 75 + Math.random() * 60, circ: Math.random() < 0.25 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    fx.clearRect(0, 0, W, H);
    parts = parts.filter((p) => p.t < p.ttl && p.y < H + 40);
    for (const p of parts) {
      p.t += 1; p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.32; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      fx.globalAlpha = Math.max(0, Math.min(1, (p.ttl - p.t) / 22));
      fx.fillStyle = p.c;
      fx.save(); fx.translate(p.x, p.y); fx.rotate(p.r);
      if (p.circ) { fx.beginPath(); fx.arc(0, 0, p.w / 2, 0, 6.283); fx.fill(); }
      else fx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.t * 0.12 + p.r)));
      fx.restore();
    }
    fx.globalAlpha = 1;
    if (parts.length) raf = requestAnimationFrame(tick);
    else { raf = 0; fx.clearRect(0, 0, W, H); }
  }
  function bigConfetti() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    confetti(W * 0.22, H * 0.5, 60, 1.25);
    confetti(W * 0.78, H * 0.5, 60, 1.25);
    setTimeout(() => confetti(W / 2, H * 0.4, 80, 1.35), 230);
  }
  window.addEventListener('resize', () => { if (parts.length) sizeFx(); });

  /* ---------------- Sons (gerados, sem arquivos) ---------------- */
  let actx = null;
  const SEQ = {
    tick: [[660, 0.05, 0, 'sine', 0.03]],
    right: [[784, 0.12, 0, 'triangle', 0.15], [1175, 0.24, 0.09, 'triangle', 0.13]],
    wrong: [[196, 0.16, 0, 'square', 0.045], [147, 0.24, 0.1, 'square', 0.04]],
    unlock: [[523, 0.12, 0, 'triangle', 0.13], [659, 0.12, 0.1, 'triangle', 0.13], [784, 0.12, 0.2, 'triangle', 0.13], [1047, 0.42, 0.3, 'triangle', 0.15]],
    level: [[587, 0.1, 0, 'triangle', 0.12], [880, 0.1, 0.09, 'triangle', 0.12], [1175, 0.32, 0.18, 'triangle', 0.13]],
  };
  function sfx(kind) {
    if (!store.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t0 = actx.currentTime + 0.01;
      (SEQ[kind] || []).forEach(([f, d, dl, type, vol]) => {
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, t0 + dl);
        g.gain.setValueAtTime(0.0001, t0 + dl);
        g.gain.exponentialRampToValueAtTime(vol, t0 + dl + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dl + d);
        o.connect(g); g.connect(actx.destination);
        o.start(t0 + dl); o.stop(t0 + dl + d + 0.03);
      });
    } catch (e) { /* sem áudio */ }
  }

  /* ---------------- Ações ---------------- */
  function pickOpt(L) {
    const q = Q[route.id];
    if (!q) return;
    const s = P.q[q.id] || { w: [], done: false };
    if (s.done || s.w.indexOf(L) !== -1 || (sandbox && ui.reveal)) return;
    ui.sel = L;
    sfx('tick');
    $$('.opt').forEach((b) => { const on = b.getAttribute('data-l') === L; b.classList.toggle('is-sel', on); b.setAttribute('aria-pressed', String(on)); });
    const bar = $('.actionbar-in');
    if (bar) bar.innerHTML = actionsHTML(q, s);
  }
  function submit() {
    const q = Q[route.id];
    if (!q || !ui.sel) return;
    const L = ui.sel;
    const from = P.xp;
    const res = answer(q.id, L);
    if (!res) return;
    ui.sel = null;
    ui.res = res;
    ui.hint = false;
    ui.xpFrom = res.ok ? from : null;
    {
      const ph = PH[q.ph];
      const tag = `${ph.n}.${phaseQs(q.ph).indexOf(q) + 1} · ${q.title}`;
      const now = Date.now();
      const evs = [res.ok
        ? { t: now, q: tag, fase: ph.name, res: 'Acertou', tent: res.wrongs + 1, xp: res.gained + res.combo }
        : { t: now, q: tag, fase: ph.name, res: 'Errou', tent: res.wrongs, xp: 0 }];
      if (res.ok && res.phaseJust) {
        evs.push({ t: now, q: `Fase ${ph.n} · ${ph.name} (${P.ph[q.ph].stars} ★)`, fase: ph.name, res: 'Concluiu a fase', tent: 0, xp: PHASE_BONUS });
        if (P.done) evs.push({ t: now, q: 'Missão concluída', fase: ph.name, res: 'Concluiu a missão', tent: 0, xp: 0 });
      }
      syncEvents(evs);
    }
    render();
    const optEl = $(`.opt[data-l="${L}"]`);
    if (res.ok) {
      sfx('right');
      if (optEl) { const r = optEl.getBoundingClientRect(); confetti(r.left + 34, r.top + r.height / 2, 70, 1); optEl.classList.add('bounce'); }
      floatXP(res.gained + res.combo + (res.phaseJust ? PHASE_BONUS : 0));
      setTimeout(() => { const fb = $('#feedback'); if (fb) fb.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); }, 420);
      let delay = 1000;
      if (res.levelUp) { const lv = res.levelUp; setTimeout(() => { toast(`<b>Novo nível: ${lv.name}!</b>Continue assim.`, { kind: 'level', icon: lv.icon }); sfx('level'); }, delay); delay += 800; }
      if (!sandbox) res.badges.forEach((b) => { setTimeout(() => toast(`<b>Medalha: ${b.name}</b>${b.desc}`, { kind: 'badge', icon: b.icon }), delay); delay += 900; });
    } else {
      sfx('wrong');
      if (optEl) { optEl.classList.remove('shake'); void optEl.offsetWidth; optEl.classList.add('shake'); }
      try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) { /* ok */ }
      if (res.wrongs === 2) { const h = $('.hint'); if (h) h.classList.add('pop'); }
      const fb = $('#feedback');
      if (fb) { const r = fb.getBoundingClientRect(); if (r.bottom > window.innerHeight - 90) fb.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' }); }
    }
  }
  function startGame(form) {
    const name = ($('#f-name').value || '').trim().replace(/\s+/g, ' ');
    const t = form.querySelector('input[name="turma"]:checked');
    const err = $('#f-err');
    const fail = (m) => { err.textContent = m; err.hidden = false; };
    if (name.length < 2) { fail('Digite seu nome para começar.'); $('#f-name').focus(); return; }
    if (name.split(' ').length < 2) { fail('Digite seu nome e sobrenome, para o professor saber quem é você.'); $('#f-name').focus(); return; }
    if (!t) { fail(`Escolha a sua turma: ${COURSE.turmasTxt.replace(' e ', ' ou ')}.`); return; }
    const id = slug(name) + '-' + t.value.toLowerCase();
    const existing = store.profiles[id];
    P = existing || newProfile(name, t.value);
    store.profiles[id] = P;
    store.cur = id;
    save();
    sfx('unlock');
    go('map');
    syncEvents(existing ? [] : [{ t: Date.now(), q: 'Entrou na missão', fase: '', res: 'Entrou na missão', tent: 0, xp: 0 }]);
    toast(existing ? `<b>Que bom te ver de novo, ${esc(firstName(P.name))}!</b>Seu progresso foi recuperado.` : `<b>Missão iniciada, ${esc(firstName(P.name))}!</b>Comece pela Fase 1: ${PHASES[0].name}.`, { icon: existing ? 'rotate' : 'flag', kind: 'info' });
  }
  function copyResult() {
    const lv = levelOf(P.xp);
    const text = `${COURSE.nome} (${COURSE.serie})\nAluno(a): ${P.name} (${P.turma})\nQuestões concluídas: ${doneCount()}/${TOTAL}\nXP: ${fmt(P.xp)} · Nível: ${lv.name}\nEstrelas: ${totalStars()}/${MAXSTARS} · De primeira: ${ftCount()}/${TOTAL}\nCódigo de verificação: ${certCode(P.name, P.turma, P.xp, ftCount(), totalStars())}`;
    const ok = () => toast('<b>Resultado copiado</b>Agora é só colar e enviar para o professor.', { icon: 'copy', kind: 'info' });
    const fallback = () => {
      const box = $('#copy-box');
      if (!box) return;
      box.hidden = false; box.value = text; box.focus(); box.select();
      toast('<b>Copie o texto abaixo do certificado</b>Ele já está selecionado.', { icon: 'copy', kind: 'info' });
    };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) {
      const z = e.target.closest('[data-zoom]');
      if (z && !z.closest('#modal-root')) openZoom(z);
      return;
    }
    if (el.getAttribute('aria-disabled') === 'true') {
      if (el.getAttribute('data-act') === 'cert') toast(`<b>Certificado bloqueado</b>Conclua as ${PHASES.length} fases para liberar.`, { icon: 'lock', kind: 'info' });
      return;
    }
    const act = el.getAttribute('data-act');
    const id = el.getAttribute('data-id');
    switch (act) {
      case 'map': go('map'); break;
      case 'phase':
        if (phaseUnlocked(id)) go('phase', id);
        else toast('<b>Fase bloqueada</b>Conclua a fase anterior para liberar.', { icon: 'lock', kind: 'info' });
        break;
      case 'q': go('question', id); break;
      case 'pick': pickOpt(el.getAttribute('data-l')); break;
      case 'submit': submit(); break;
      case 'hint': {
        ui.hint = !ui.hint;
        const q = Q[route.id];
        const fb = $('#feedback');
        if (q && fb) fb.innerHTML = feedbackHTML(q, P.q[q.id] || { w: [], done: false });
        const tg = $('.hint-toggle');
        if (tg) tg.focus({ preventScroll: true });
        break;
      }
      case 'reveal':
        ui.reveal = true; ui.sel = null; render();
        setTimeout(() => { const fb = $('#feedback'); if (fb) fb.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); }, 80);
        break;
      case 'celebrate': celebrate(id); break;
      case 'theory': openTheory(id); break;
      case 'badges': go('badges'); break;
      case 'cert': go('cert'); break;
      case 'menu': openMenu(); break;
      case 'close-modal': closeModal(); break;
      case 'toggle-sound': store.sound = !store.sound; save(); openMenu(); if (store.sound) sfx('right'); break;
      case 'switch': store.cur = null; P = null; save(); go('welcome'); break;
      case 'use-profile': if (store.profiles[id]) { P = store.profiles[id]; store.cur = id; save(); go('map'); } break;
      case 'ask-reset':
        confirmBox('Recomeçar do zero?', `Todo o progresso de <b>${esc(P.name)}</b> neste aparelho (XP, estrelas e medalhas) será apagado. Isso não pode ser desfeito.`, 'do-reset', null, `${ic('rotate')} Recomeçar`);
        break;
      case 'do-reset': {
        const fresh = newProfile(P.name, P.turma);
        fresh.created = P.created;
        store.profiles[P.id] = fresh;
        P = fresh;
        save();
        go('map');
        syncEvents([{ t: Date.now(), q: 'Recomeçou do zero', fase: '', res: 'Recomeçou', tent: 0, xp: 0 }]);
        toast('<b>Progresso zerado</b>Boa missão!', { icon: 'rotate', kind: 'info' });
        break;
      }
      case 'teacher': openPin(); break;
      case 'teacher-back': go(P ? 'map' : 'welcome'); break;
      case 'teacher-lock': teacherOK = false; teacherKey = ''; stopRankTimer(); go(P ? 'map' : 'welcome'); break;
      case 'gate-toggle': {
        if (!teacherKey || !PH[id]) break;
        const fases = Object.assign(Object.fromEntries(PHASES.map((x) => [x.id, true])), store.gates || {});
        fases[id] = !gateOpen(id);
        store.gates = fases;
        rank.gatePending = true;
        save();
        renderGateBox();
        const ph = PH[id];
        fetch(SYNC_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: 'fases', p: COURSE.projeto, chave: teacherKey, fases }) })
          .then(() => { toast(`<b>Fase ${ph.n} ${fases[id] ? 'liberada' : 'bloqueada'}</b>${fases[id] ? 'Os alunos já podem entrar nela.' : 'Os alunos não conseguem entrar até você liberar.'}`, { icon: fases[id] ? 'unlock' : 'lock', kind: 'info' }); },
            () => toast('<b>Não consegui salvar</b>Confira a internet e tente de novo.', { icon: 'alert', kind: 'info' }))
          .finally(() => setTimeout(() => { rank.gatePending = false; loadGates(); }, 1500));
        break;
      }
      case 'rank-filter': rank.filtro = id || 'todas'; renderRankBox(); break;
      case 'rank-refresh': loadRanking(); renderRankBox(); break;
      case 'rank-del': {
        const a = rank.data && rank.data.alunos.find((x) => String(x.id) === id);
        if (a) confirmBox('Remover do ranking?', `<b>${esc(a.nome)}</b> (${esc(a.turma)}) sai do ranking e da planilha. Se o aluno continuar jogando, ele volta a aparecer.`, 'do-rank-del', id, `${ic('trash')} Remover`);
        break;
      }
      case 'do-rank-del':
        closeModal(true);
        try { fetch(SYNC_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: 'remover', p: COURSE.projeto, chave: teacherKey, id }) }).then(() => setTimeout(loadRanking, 1500), () => toast('<b>Não consegui remover</b>Confira a internet e tente de novo.', { icon: 'alert', kind: 'info' })); } catch (e) { /* ok */ }
        if (rank.data) rank.data.alunos = rank.data.alunos.filter((x) => String(x.id) !== id);
        renderRankBox();
        toast('<b>Aluno removido do ranking</b>', { icon: 'trash', kind: 'info' });
        break;
      case 'start-sandbox':
        sandbox = true;
        P = newProfile('Modo aula', 'Prof');
        P.id = 'modo-aula';
        go('map');
        toast('<b>Modo aula aberto</b>Todas as fases estão liberadas.', { icon: 'play', kind: 'info' });
        break;
      case 'exit-sandbox':
        sandbox = false;
        P = store.cur && store.profiles[store.cur] ? store.profiles[store.cur] : null;
        go(teacherOK ? 'teacher' : P ? 'map' : 'welcome');
        break;
      case 'ask-del': {
        const pr = store.profiles[id];
        if (pr) confirmBox('Apagar este perfil?', `O progresso de <b>${esc(pr.name)}</b> (${esc(pr.turma)}) neste aparelho será apagado. Isso não pode ser desfeito.`, 'do-del', id, `${ic('trash')} Apagar`);
        break;
      }
      case 'do-del':
        delete store.profiles[id];
        if (store.cur === id) { store.cur = null; if (!sandbox) P = null; }
        save();
        go('teacher', null, { keepScroll: true });
        toast('<b>Perfil apagado</b>', { icon: 'trash', kind: 'info' });
        break;
      case 'copy-result': copyResult(); break;
      default: break;
    }
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.id === 'start-form') startGame(f);
    else if (f.id === 'pin-form') {
      const v = ($('#pin-in').value || '');
      if (fnv('missao:' + norm(v)) === PIN_HASH) { teacherOK = true; teacherKey = norm(v); closeModal(true); go('teacher'); }
      else { const er = $('#pin-err'); er.hidden = false; $('#pin-in').select(); }
    } else if (f.id === 'verify-form') {
      const num = (s) => parseInt(String(s || '').replace(/\D/g, ''), 10) || 0;
      const name = $('#v-name').value;
      const out = $('#verify-out');
      if (!name.trim()) { out.hidden = false; out.innerHTML = '<span>Digite o nome do aluno.</span>'; return; }
      const code = certCode(name, $('#v-turma').value, num($('#v-xp').value), num($('#v-ft').value), num($('#v-stars').value));
      out.hidden = false;
      out.innerHTML = `<span>Código esperado</span>${code}`;
    }
  });

  document.addEventListener('keydown', (e) => {
    const root = $('#modal-root');
    if (!root.hidden) {
      if (e.key === 'Escape') { closeModal(); return; }
      if (e.key === 'Tab') {
        const f = $$('button, input, select, textarea, [href]', root).filter((x) => !x.disabled && !x.hidden && x.offsetParent !== null);
        if (!f.length) return;
        const first = f[0];
        const last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if (route.view !== 'question' || e.metaKey || e.ctrlKey || e.altKey) return;
    const tg = e.target;
    if (tg && /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)) return;
    const k = (e.key || '').toUpperCase();
    if (LETTERS.indexOf(k) !== -1 && Q[route.id] && Q[route.id].opts[k] != null) { pickOpt(k); e.preventDefault(); return; }
    if (e.key === 'Enter') {
      const a = document.activeElement;
      if (a && a.matches && a.matches('button:not(.opt)')) return;
      const b = $('.actionbar-in .btn-primary:not([disabled]), .actionbar-in .btn-lime');
      if (b) { e.preventDefault(); b.click(); }
    }
  });

  /* ---------------- Início ---------------- */
  try {
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ route: route.view === 'teacher' || sandbox ? { view: 'map', id: null } : route }));
  } catch (e) { /* ok */ }
  function start(data) {
    if (store.cur && store.profiles[store.cur]) P = store.profiles[store.cur];
    const r = data && data.route;
    route = P && r && r.view ? { view: r.view, id: r.id || null } : { view: P ? 'map' : 'welcome', id: null };
    render();
    loadGates();
    if (P && syncOn() && !(store.outbox[P.id] && store.outbox[P.id].last)) syncEvents([]);
    else setTimeout(flush, 2500);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});
})();

</script>
