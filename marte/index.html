<style>
:root {
  --bg: #120A08; --bg2: #1C110E; --panel: #211512; --panel2: #2B1B17; --line: #43291F; --line2: #5C3829;
  --ink: #F6E9DD; --mute: #BFA595; --dim: #8C7062;
  --rust: #E2552B; --rust2: #FF7A45; --amber: #FFB067; --sand: #F2C79B; --teal: #36D3C2; --bp: #7CC4FF; --ok: #4CD38A; --bad: #FF5A5F;
  --fd: "Chakra Petch", "Trebuchet MS", sans-serif; --fb: "IBM Plex Sans", system-ui, sans-serif; --fm: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--fb); }
body { min-height: 100vh; background: radial-gradient(1200px 600px at 80% -10%, #3A1A10 0%, transparent 60%), radial-gradient(900px 500px at -10% 110%, #2A120B 0%, transparent 60%), var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
.ic { width: 1.1em; height: 1.1em; flex: none; vertical-align: -0.18em; }
.muted { color: var(--mute); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
.row.center, .center .row { justify-content: center; }
.err { color: #FFB3B5; background: rgba(255, 90, 95, .12); border: 1px solid rgba(255, 90, 95, .4); padding: 8px 12px; border-radius: 6px; margin: 0; font-size: 14px; }

/* botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 6px; padding: 11px 18px; font-family: var(--fd); font-weight: 700; letter-spacing: .04em; border: 1px solid var(--line2); background: var(--panel2); transition: transform .12s, background .2s, box-shadow .2s; text-transform: uppercase; font-size: 14px; }
.btn:hover { transform: translateY(-1px); }
.btn.hot { background: linear-gradient(180deg, var(--rust2), var(--rust)); border-color: #FF8E5E; color: #1A0905; box-shadow: 0 6px 20px -6px rgba(226, 85, 43, .7), inset 0 1px 0 rgba(255,255,255,.35); }
.btn.big { padding: 14px 22px; font-size: 15px; }
.btn.sm { padding: 7px 12px; font-size: 12px; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: rgba(255, 90, 95, .5); color: #FFB3B5; }
.link { background: none; border: 0; color: var(--sand); text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; font-size: 14px; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* capa */
.cover { position: relative; min-height: 100vh; overflow: hidden; display: grid; place-items: center; padding: 28px 16px; }
.stars { position: absolute; inset: 0; background-image: radial-gradient(1px 1px at 20px 30px, #fff8, transparent), radial-gradient(1px 1px at 120px 80px, #fff6, transparent), radial-gradient(1.5px 1.5px at 200px 160px, #fffa, transparent), radial-gradient(1px 1px at 280px 40px, #fff5, transparent), radial-gradient(1px 1px at 330px 220px, #fff7, transparent); background-size: 360px 260px; opacity: .7; }
.planet { position: absolute; width: 900px; height: 900px; right: -420px; bottom: -560px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F08A55 0%, #C24F27 38%, #6E2512 70%, #2A0E07 100%); box-shadow: 0 0 120px 30px rgba(226, 85, 43, .25); }
.cover-in { position: relative; width: min(560px, 100%); }
.cover-brand { display: flex; align-items: center; gap: 12px; font-family: var(--fm); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.logo { height: 34px; background: #fff; padding: 4px 8px; border-radius: 6px; }
.kicker { margin: 26px 0 0; font-family: var(--fm); color: var(--amber); letter-spacing: .2em; font-size: 13px; text-transform: uppercase; }
.title { margin: 4px 0 0; font: 700 clamp(56px, 13vw, 112px)/.86 var(--fd); letter-spacing: .02em; }
.title span { color: var(--rust); text-shadow: 0 0 40px rgba(226, 85, 43, .45); }
.lede { color: var(--mute); max-width: 46ch; font-size: 17px; }
.resume { background: rgba(54, 211, 194, .08); border: 1px solid rgba(54, 211, 194, .35); border-radius: 10px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.resume p { margin: 0; font-size: 14px; }
.crew { margin-top: 18px; display: grid; gap: 14px; background: rgba(28, 17, 14, .82); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.fld { display: grid; gap: 6px; }
.fld span, .seg legend { font-family: var(--fm); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.fld input { background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; padding: 12px; color: var(--ink); font: 16px var(--fb); }
.seg { border: 0; padding: 0; margin: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.seg legend { margin-bottom: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: inline-block; padding: 9px 18px; border: 1px solid var(--line2); border-radius: 6px; font-family: var(--fd); font-weight: 700; }
.seg input:checked + span { background: var(--rust); color: #1A0905; border-color: var(--rust); }
.seg input:focus-visible + span { outline: 2px solid var(--amber); }
.cover-links { display: flex; gap: 18px; margin-top: 14px; }

/* HUD */
.hud { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: rgba(18, 10, 8, .9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.hud-brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; font: 700 15px var(--fd); letter-spacing: .14em; color: var(--rust2); padding: 0; }
.hud-brand .logo { height: 26px; }
.hud-cells { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.hud-cell { display: grid; padding: 4px 10px; border-left: 1px solid var(--line); min-width: 74px; }
.hud-cell span { font: 10px var(--fm); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 4px; }
.hud-cell b { font: 700 15px var(--fd); }
.hud-cell.o2 { min-width: 120px; }
.o2bar { height: 5px; background: #0A2F2B; border-radius: 3px; overflow: hidden; margin: 3px 0 1px; }
.o2bar i { display: block; height: 100%; background: var(--teal); transition: width .6s; }
.o2.low .o2bar i { background: var(--bad); } .o2.low b { color: #FFB3B5; }
.proj-tag { font: 700 11px var(--fm); letter-spacing: .14em; color: #1A0905; background: var(--amber); padding: 3px 8px; border-radius: 4px; }
@media (max-width: 640px) { .hud { flex-wrap: wrap; gap: 6px; padding: 8px 12px; } .hud-cells { width: 100%; margin: 0; justify-content: space-between; gap: 2px; } .hud-cell { min-width: 0; padding: 2px 6px; } .hud-cell:first-child { display: none; } .hud-cell b { font-size: 14px; } }

/* console (painéis de transmissão) */
.console { --c: var(--rust); margin: 22px auto; width: min(860px, calc(100% - 32px)); background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 12px; padding: 22px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.8); }
.console.center { text-align: center; overflow: hidden; }
.console h2 { font: 700 26px var(--fd); margin: 0 0 6px; }
.console-h { font: 600 12px var(--fm); letter-spacing: .16em; color: var(--c); display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
.console.center .console-h { justify-content: center; }
.tw { font: 18px/1.65 var(--fb); min-height: 6.6em; margin: 14px 0; }
.tw.typing::after { content: '▌'; color: var(--c, var(--rust)); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.rules { margin: 0 0 18px; padding: 14px 16px 14px 34px; background: rgba(0,0,0,.25); border-radius: 8px; border: 1px dashed var(--line2); color: var(--mute); }
.rules li { margin: 3px 0; }
.rules b { color: var(--ink); }
.ref-h { font: 600 12px var(--fm); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin: 18px 0 8px; }
.ref { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.ref div { background: rgba(0,0,0,.28); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; text-align: left; }
.ref span { font: 11px var(--fm); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.ref b { font: 600 17px var(--fd); color: var(--amber); }

/* base */
.base { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto 1fr; min-height: 100vh; }
.base > .hud { grid-column: 1 / -1; }
.colony-wrap { position: relative; padding: 16px; }
.colony { position: relative; height: calc(100vh - 120px); min-height: 380px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: radial-gradient(ellipse at 50% 120%, #7A3016 0%, #3A160B 45%, #120806 80%); }
.colony.tall { height: 58vh; }
.colony-cap { margin: 8px 4px 0; font: 12px var(--fm); color: var(--dim); }
.sols { padding: 16px 16px 30px 0; }
.sols h2 { font: 600 12px var(--fm); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); margin: 4px 0 10px; }
.sols ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.sol-card { --c: var(--rust); width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); position: relative; overflow: hidden; }
.sol-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.sol-card.locked { opacity: .5; cursor: not-allowed; }
.sol-card.open { border-color: var(--line2); box-shadow: 0 0 0 1px rgba(226, 85, 43, .15), 0 10px 30px -18px var(--c); }
.sol-card.open:hover { background: var(--panel2); }
.sol-ic { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; background: rgba(0,0,0,.35); color: var(--c); font-size: 22px; }
.sol-t { display: grid; flex: 1; min-width: 0; }
.sol-t small { font: 10px var(--fm); letter-spacing: .14em; color: var(--dim); }
.sol-t b { font: 700 17px var(--fd); }
.sol-p { font-size: 13px; color: var(--mute); }
.done .sol-p { color: var(--amber); }
.sol-go { font: 700 18px var(--fd); color: var(--c); }
.sols .btn.big { width: 100%; margin-top: 14px; }
@media (max-width: 900px) { .base { grid-template-columns: 1fr; } .colony { height: 52vh; min-height: 300px; } .sols { padding: 0 16px 30px; } }

/* 3D */
.v3d { position: relative; }
.v3d canvas { width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
.v3d-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; background: #0E0806; color: #fff; font: 700 13px var(--fm); padding: 2px 7px; border-radius: 4px; white-space: nowrap; border: 1px solid #000; }
.lbl.r { background: #E5322D; } .lbl.b { background: #2457F5; }
.lbl.tag { background: rgba(14, 8, 6, .75); border-color: var(--bp); color: var(--bp); font-size: 11px; letter-spacing: .06em; }
.lbl.tag.on { border-color: var(--amber); color: var(--amber); }
.v3d-tip { position: absolute; left: 12px; bottom: 10px; font: 12px var(--fm); color: var(--dim); pointer-events: none; transition: opacity .4s; }
.v3d-tip.gone { opacity: 0; }
.nogl-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); padding: 20px; text-align: center; }

/* bancada (desafio) */
.stage-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: min(1180px, calc(100% - 32px)); margin: 16px auto 0; }
.pips { display: flex; gap: 6px; }
.pip { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line2); font: 700 13px var(--fd); color: var(--dim); }
.pip.ok { background: var(--teal); border-color: var(--teal); color: #04201C; }
.pip.cur { border-color: var(--amber); color: var(--amber); box-shadow: 0 0 0 3px rgba(255, 176, 103, .2); }
.pip.ok.cur { color: #04201C; }
.bench { width: min(1180px, calc(100% - 32px)); margin: 12px auto 40px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.lab { position: relative; height: min(70vh, 600px); min-height: 340px; border-radius: 14px; overflow: hidden; border: 1px solid #1E3A55; background: radial-gradient(circle at 50% 40%, #12304A 0%, #0A1828 70%), #0A1828; background-image: linear-gradient(rgba(124, 196, 255, .08) 1px, transparent 1px), linear-gradient(90deg, rgba(124, 196, 255, .08) 1px, transparent 1px), radial-gradient(circle at 50% 40%, #12304A 0%, #0A1828 70%); background-size: 28px 28px, 28px 28px, auto; }
.lab .v3 { position: absolute; inset: 0; }
.lab-tag { position: absolute; top: 12px; left: 12px; font: 700 11px var(--fm); letter-spacing: .16em; color: var(--bp); border: 1px solid var(--bp); padding: 3px 8px; border-radius: 4px; background: rgba(10, 24, 40, .7); }
.lab-tag.ok { color: #04201C; background: var(--teal); border-color: var(--teal); }
.lab-tag.pop { animation: pop .5s; }
@keyframes pop { 40% { transform: scale(1.25); } }
.unroll { position: absolute; top: 10px; right: 10px; background: rgba(10, 24, 40, .7); }
.task { background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; }
.task.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.task-k { font: 11px var(--fm); letter-spacing: .14em; color: var(--dim); }
.task h2 { margin: -6px 0 0; font: 700 26px var(--fd); }
.ask { margin: 0; font-size: 17px; line-height: 1.55; }
.ask b { color: var(--amber); }
.mc { display: grid; gap: 8px; }
.mc-o { display: flex; gap: 10px; align-items: center; text-align: left; padding: 12px; border-radius: 8px; border: 1px solid var(--line2); background: rgba(0,0,0,.25); }
.mc-o span { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line2); font: 700 13px var(--fd); }
.mc-o.sel { border-color: var(--amber); background: rgba(255, 176, 103, .1); }
.mc-o.sel span { background: var(--amber); color: #1A0905; border-color: var(--amber); }
.fb:empty { display: none; }
.fb { display: grid; gap: 8px; }
.fb-box { border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; font-size: 15px; }
.fb-box.good { background: rgba(76, 211, 138, .1); border: 1px solid rgba(76, 211, 138, .45); }
.fb-box.good b { color: var(--ok); }
.fb-box.bad { background: rgba(255, 90, 95, .1); border: 1px solid rgba(255, 90, 95, .4); }
.fb-box.bad b { color: #FFB3B5; }
.fb-box.hint { background: rgba(255, 176, 103, .1); border: 1px solid rgba(255, 176, 103, .45); display: flex; gap: 8px; align-items: flex-start; }
.fb-box.hint .ic { color: var(--amber); margin-top: 3px; }
.steps { margin: 4px 0 0; padding-left: 20px; }
.steps li { margin: 2px 0; }
.steps b { color: var(--amber); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
@media (max-width: 860px) { .bench { grid-template-columns: 1fr; } .lab { height: 46vh; min-height: 280px; } .task h2 { font-size: 22px; } .actions .btn.big { flex: 1; } }

/* teclado */
.kp { display: grid; gap: 8px; }
.kp-screen { background: #070403; border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; }
.kp-l { font: 11px var(--fm); letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }
.kp-v { display: flex; align-items: baseline; gap: 4px; font-family: var(--fd); min-height: 44px; }
.kp-num { font-size: 34px; color: var(--amber); font-weight: 700; }
.kp-num.empty { width: 18px; border-bottom: 3px solid var(--amber); animation: blink 1s steps(2) infinite; }
.kp-pi { font-size: 30px; color: var(--amber); font-style: normal; font-weight: 700; }
.kp-u { color: var(--mute); font-size: 18px; margin-left: 6px; }
.kp-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.kp-keys button { padding: 10px 0; font: 700 21px var(--fd); border: 1px solid var(--line2); background: var(--panel2); border-radius: 8px; box-shadow: 0 3px 0 #0A0504; }
.kp-keys button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0A0504; }
.locked .kp-keys button { pointer-events: none; opacity: .5; }

/* sol concluído e final */
.stamp { display: inline-block; margin: 8px auto 4px; padding: 12px 22px; border: 3px solid var(--teal); color: var(--teal); border-radius: 8px; font: 700 16px/1.3 var(--fd); letter-spacing: .12em; text-transform: uppercase; transform: rotate(-3deg); animation: stamp .5s cubic-bezier(.2, 1.6, .4, 1); }
.stamp b { font-size: 28px; }
@keyframes stamp { from { transform: scale(2.2) rotate(-3deg); opacity: 0; } }
.big-stars { font-size: 46px; color: var(--amber); margin: 6px 0; letter-spacing: .1em; }
.big-stars span { color: #3A2620; }
.final .colony-wrap { width: min(1180px, 100%); margin: 0 auto; }
.final-t { font: 700 34px var(--fd) !important; color: var(--amber); margin-top: 8px !important; }
.final-ref { margin-top: 14px; }
.copy { width: 100%; min-height: 110px; margin-top: 12px; background: #070403; color: var(--ink); border: 1px solid var(--line2); border-radius: 8px; padding: 10px; font: 13px var(--fm); }

/* hall, professor, modal */
.page .console { width: min(820px, calc(100% - 32px)); }
.hall { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 6px; }
.hall li { display: grid; grid-template-columns: 30px 1fr auto auto auto; gap: 10px; align-items: center; padding: 8px 12px; background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
.h-n { font: 700 14px var(--fd); color: var(--dim); }
.h-p { font: 700 16px var(--fd); color: var(--amber); }
@media (max-width: 560px) { .hall li { grid-template-columns: 26px 1fr auto; } .hall li span:nth-of-type(3) { display: none; } .hall li span:nth-of-type(2) { display: none; } }
.tcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 12px 0; }
.tcards > div { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.tcards h3 { margin: 0 0 6px; font: 700 17px var(--fd); }
.tcards p { color: var(--mute); font-size: 14px; }
.veil { position: fixed; inset: 0; z-index: 50; background: rgba(5, 2, 1, .78); display: grid; place-items: center; padding: 16px; }
.modal { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; padding: 20px; }
.modal h3 { margin: 0 0 12px; font: 700 20px var(--fd); }
.modal form { display: grid; gap: 12px; }
.menu { display: grid; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 30px); opacity: 0; z-index: 60; background: #070403; border: 1px solid var(--amber); color: var(--ink); padding: 10px 16px; border-radius: 8px; transition: .3s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; font-size: 14px; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* projeção */
body.proj .ask { font-size: 22px; }
body.proj .task h2 { font-size: 32px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- ranking online ---------- */
.pod-box { margin: 18px auto 4px; max-width: 620px; text-align: left; background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.pod-box h3 { margin: 0 0 10px; font: 600 12px var(--fm); letter-spacing: .14em; text-transform: uppercase; color: var(--amber); display: flex; gap: 8px; align-items: center; }
.podium { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.podium li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); font-size: 15px; }
.podium.prof li { grid-template-columns: 34px minmax(0, 1fr) auto auto auto auto; }
.podium li.top { border-color: rgba(255, 176, 103, .45); }
.podium li.me { background: rgba(54, 211, 194, .14); border-color: var(--teal); }
.podium .p-n { font: 700 18px var(--fd); text-align: center; color: var(--dim); }
.podium b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.podium .p-t { font: 12px var(--fm); color: var(--mute); }
.podium .p-r { font-size: 12px; color: var(--mute); }
.podium .p-p { font: 700 18px var(--fd); color: var(--amber); }
.podium:not(.prof) li { grid-template-columns: 34px minmax(0, 1fr) auto auto; }
.podium:not(.prof) li .p-r { display: none; }
.p-mine { margin: 10px 0 0; font-size: 14px; color: var(--teal); }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.pod-links { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; }
.pod-links span { font: 600 11px var(--fm); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-right: 4px; }
.modal #podio-m { max-height: 60vh; overflow: auto; }
.live-h { display: flex; align-items: center; gap: 8px; font: 700 20px var(--fd); margin: 22px 0 8px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #4A3A34; flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(76, 211, 138, .2); animation: pulse 1.6s infinite; }
.dot.fim { background: var(--amber); }
.prof-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.live-tag { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--fm); }
.seg-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.seg-tabs button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line2); background: transparent; font: 600 13px var(--fd); }
.seg-tabs button.on { background: var(--rust); border-color: var(--rust); color: #1A0905; }
.seg-tabs.big { margin: 4px 0 12px; }
.seg-tabs.big button { padding: 8px 14px; font-size: 14px; }
.tscroll { overflow-x: auto; }
table.live { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 620px; }
table.live th { text-align: left; font: 600 11px var(--fm); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.live td { padding: 8px; border-bottom: 1px solid rgba(67, 41, 31, .6); vertical-align: middle; }
table.live td small { display: block; color: var(--mute); font-size: 12px; }
table.live tr.on td { background: rgba(76, 211, 138, .05); }
table.live .num { font: 600 15px var(--fd); white-space: nowrap; }
table.live .ok { color: var(--amber); }
.mini-o2 { display: inline-block; width: 36px; height: 5px; border-radius: 3px; background: #0A2F2B; overflow: hidden; margin-right: 6px; vertical-align: middle; }
.mini-o2 i { display: block; height: 100%; background: var(--teal); }
.feed-h { margin: 18px 0 6px; font: 600 12px var(--fm); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.feed { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 14px; }
.feed li { padding: 6px 10px; border-radius: 6px; background: rgba(0,0,0,.2); }
details.local { margin-top: 18px; color: var(--mute); }
details.local summary { cursor: pointer; font-size: 14px; }
@media (max-width: 560px) { .podium.prof li { grid-template-columns: 30px minmax(0, 1fr) auto; } .podium.prof .p-r, .podium.prof .muted, .podium.prof .p-t { display: none; } }

function M(color, opacity, extra) {
  return new THREE.MeshStandardMaterial(Object.assign({
    color, roughness: 0.6, metalness: 0.02, transparent: opacity < 1, opacity: opacity == null ? 1 : opacity,

}

   Medidas sorteadas por aluno. Respostas inteiras.
   pi:true  → o aluno digita só o número que multiplica π.
   ========================================================= */
const pickOf = (rnd, a) => a[Math.floor(rnd() * a.length)];
const nf = (v) => Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 2 });

/* sorteio das medidas da partida (tudo guardado no progresso do aluno) */
function rollParams(rnd) {
  const m = pickOf(rnd, [[8, 5, 3], [10, 6, 3], [9, 4, 3], [12, 5, 3], [10, 4, 3]]);
  const roof = pickOf(rnd, [[3, 4], [4, 5], [3, 8], [6, 2], [2, 9]]);
  const tank = pickOf(rnd, [[2, 2], [3, 2], [2, 3], [4, 1]]);
  const pyr = pickOf(rnd, [[6, 4, 5], [8, 3, 5], [12, 8, 10], [10, 12, 13], [16, 6, 10]]);
  const silo = pickOf(rnd, [[2, 5], [3, 5], [3, 4], [4, 3], [2, 6], [4, 5]]);
  const cone = pickOf(rnd, [[6, 8, 10], [3, 4, 5], [9, 12, 15], [8, 6, 10], [12, 9, 15]]);
  const rk = pickOf(rnd, [[3, 4, 5, 10], [3, 4, 5, 8], [6, 8, 10, 12], [3, 4, 5, 12]]);
  const pp = pickOf(rnd, [[6, 9], [5, 6], [4, 12], [9, 4], [6, 5]]);
  const fuel = pickOf(rnd, [[1, 4, 1500], [2, 2, 3000], [1, 5, 2500], [2, 3, 4000], [1, 6, 2000]]);
  return {
    mod: { a: m[0], b: m[1], c: m[2] }, roof: { p: roof[0], q: roof[1] }, tank: { s: tank[0], h: tank[1] },
    pyr: { l: pyr[0], h: pyr[1], g: pyr[2] }, silo: { r: silo[0], h: silo[1] },
    cone: { r: cone[0], h: cone[1], g: cone[2] }, rk: { r: rk[0], hc: rk[1], g: rk[2], H: rk[3] },
    pp: { l: pp[0], h: pp[1] }, fuel: { r: fuel[0], h: fuel[1], c: fuel[2] },
  };
}

/* prisma de base triângulo retângulo (catetos p e q), comprimento L */
function triPrism(S) {

  const x0 = -L / 2; const x1 = L / 2; const z0 = -p / 2; const z1 = p / 2; const y0 = -q / 2; const y1 = q / 2;

  const res = poly(v, f, { color: S.color, size, opacity: S.opacity });

  if (S.lp) dim(res.group, labels, V3(x1 + o, y0 - o, z0), V3(x1 + o, y0 - o, z1), S.lp, C3.red, V3(o * 2.2, -o, 0));

}
/* cone e cilindro lado a lado (mesma base e altura) */
function pairCC(S) {

/* pirâmide dentro do prisma de mesma base e altura */
function pyrInPrism(S) {

const sortedHall = () => DB.hall.slice().sort((a, b) => b.pts - a.pts || a.t - b.t);
function hallList(rows) { return rows.length ? `<ol class="hall">${rows.map((h, i) => `<li><span class="h-n">${i + 1}</span><b>${esc(h.name)}</b><span>${esc(h.turma)}</span><span>${esc(h.rank)}</span><b class="h-p">${h.pts}</b></li>`).join('')}</ol>` : '<p class="muted">Nenhuma missão concluída neste aparelho ainda.</p>'; }
function hallView() { return `<main class="page">${hud()}<section class="console"><h2>Tripulação de destaque</h2><p class="muted">Missões concluídas neste aparelho.</p>${hallList(sortedHall().slice(0, 20))}<p><button class="btn ghost" data-act="${S ? (S.finished ? 'final' : 'base') : 'cover'}">← Voltar</button></p></section></main>`; }
function teacherView() {
  return `<main class="page">${hud()}<section class="console">
    <h2>Área do professor</h2>
    <div class="tcards"><div><h3>Modo projeção</h3><p>Libera todos os sóis e mostra o botão “Mostrar resposta” em cada peça, para resolver com a turma no projetor.</p><button class="btn hot" data-act="proj">${projection ? 'Desligar' : 'Ligar'} projeção</button></div>
    <div><h3>Como os alunos jogam</h3><p>Cada aluno recebe medidas sorteadas, então o gabarito muda de um para outro. A resolução aparece depois de cada peça. O resultado copiado traz um código de verificação.</p></div></div>
    <h3 class="live-h"><span class="dot on"></span> Tripulação ao vivo</h3>
    <div id="prof-live"></div>
    <details class="local"><summary>Missões concluídas neste aparelho</summary>${TURMAS.map((t) => `<h3>${t}</h3>${hallList(sortedHall().filter((h) => h.turma === t))}`).join('')}</details>
    <p class="row"><button class="btn ghost" data-act="${S ? (S.finished ? 'final' : 'base') : 'cover'}">← Voltar</button><button class="btn ghost danger" data-act="wipe">Apagar missão atual e destaques deste aparelho</button></p>
  </section></main>`;
}
function modalView() {
  let inner = '';
  if (modal.type === 'pin') inner = `<h3>Área do professor</h3><form data-form="pin" autocomplete="off"><label class="fld"><span>Senha</span><input name="pin" type="password" required></label>${modal.err ? '<p class="err">Senha incorreta.</p>' : ''}<div class="row"><button class="btn hot" type="submit">Entrar</button><button class="btn ghost" type="button" data-act="close">Cancelar</button></div></form>`;
  if (modal.type === 'podio') inner = `<h3>Pódio do Sol ${modal.i + 1} · ${SOLS[modal.i].nome}</h3><div id="podio-m"></div><div class="row"><button class="btn ghost" data-act="close">Fechar</button></div>`;
  if (modal.type === 'menu') inner = `<h3>Menu</h3><div class="menu"><button class="btn ghost" data-act="brief">Rever a transmissão inicial</button><button class="btn ghost" data-act="cover">Tela inicial</button><button class="btn ghost" data-act="pin">Área do professor</button><button class="btn ghost" data-act="close">Fechar</button></div>`;
  return `<div class="veil" data-act="close-veil"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`;
}

/* ---------- render ---------- */
function killViews() { stopProf(); if (viewer) { viewer.dispose(); viewer = null; } if (colonyV) { colonyV.dispose(); colonyV = null; } clearKeyHandlers(); kp = null; }
function render() {
  killViews();
  const V = { cover: coverView, brief: briefView, base: baseView, solintro: solIntroView, stage: stageView, soldone: solDoneView, final: finalView, hall: hallView, teacher: teacherView }[screen] || coverView;
  $app.innerHTML = V() + '<div class="toast" id="toast" role="status"></div>' + (modal ? modalView() : '');
  document.body.dataset.screen = screen; document.body.classList.toggle('proj', projection);
  mount();
  const prevWhere = onlineWhere;
  onlineWhere = screen === 'stage' ? `Sol ${SOL[solId].n} · ${SOL[solId].stages[stIdx].titulo}` : screen === 'solintro' ? `Sol ${SOL[solId].n} · manual técnico` : screen === 'soldone' ? `Sol ${SOL[solId].n} · concluído` : 'Na base';
  if (S && !S.finished && onlineWhere !== prevWhere && ['stage', 'solintro', 'base', 'soldone'].includes(screen)) syncPost([], true);
  if (!hbTimer) heartbeat();
  if (screen === 'soldone') fillPodium(document.getElementById('podio'), SOL[solId].n - 1, 'sol', 10);
  if (screen === 'final') fillPodium(document.getElementById('podio'), 0, 'final', 50);
  if (modal && modal.type === 'podio') fillPodium(document.getElementById('podio-m'), modal.i, 'sol', 15);
  if (screen === 'teacher') startProf();
}
const doneSet = () => new Set(STAGES.filter((st) => isDone(st.id)).map((st) => st.id));
function mount() {
  if (screen === 'brief') typewrite(document.getElementById('tw'), BRIEF);
  if (screen === 'solintro') typewrite(document.getElementById('tw'), SOL[solId].radio);
  if (screen === 'base' || screen === 'final') {
    const host = document.getElementById('colony');
    colonyV = new Viewer(host, { yaw: 0.6, tilt: 0.55, fit: 0.62 });
    if (!colonyV.dead) colonyV.set(buildColony(screen === 'final' ? new Set(STAGES.map((s) => s.id)) : doneSet()));
    if (screen === 'final') launch();
  }
  if (screen === 'stage') {
    const st = SOL[solId].stages[stIdx]; const r = rec(st.id);
    viewer = new Viewer(document.getElementById('v3'), { yaw: 0.6, tilt: 0.38, fit: 1.08 });
    if (!viewer.dead) viewer.set(makeSolid(Object.assign(st.spec(S.P), r.done ? { color: st.built, opacity: 0.96 } : { color: BLUE_PRINT, opacity: 0.42 })));
    if (!r.done && !st.mc) {
      kp = keypad(document.getElementById('kp'), { unit: st.unit, pi: !!st.pi, label: st.pi ? 'Sua resposta (o número antes do π)' : 'Sua resposta', int: false });
      const kb = (e) => { if (e.key === 'Enter' && !document.querySelector('.veil')) { e.preventDefault(); send(); } };
      document.addEventListener('keydown', kb); KEYHANDLERS.push(() => document.removeEventListener('keydown', kb));
    }
  }
  const f = document.querySelector('[data-autofocus]'); if (f) f.focus();
}
function launch() {
  if (!colonyV || colonyV.dead) return;
  const g = colonyV.pivot.children[0]; if (!g) return;
  let rocket = null; g.children.forEach((c) => { if (c.position.x === 0 && c.position.z === 0 && c.children.length > 4) rocket = c; });
  if (!rocket) return;
  let t = 0;
  colonyV.frame.push(() => { t += 1; if (t < 90) return; const k = t - 90; rocket.position.y = Math.min(40, 0.0016 * k * k); });
}
const go = (s) => { screen = s; modal = null; render(); window.scrollTo(0, 0); };

/* ---------- ações ---------- */
function send() {
  if (busy) return;
  const st = SOL[solId].stages[stIdx]; const r = rec(st.id); if (r.done) return;
  let ok;
  if (st.mc) { if (mcSel == null) { toast('Escolha uma alternativa.'); return; } ok = !!st.opts(S.P)[mcSel][1]; } else {
    const v = kp ? kp.get() : NaN; if (Number.isNaN(v)) { toast('Digite um número no teclado.'); return; }
    ok = Math.abs(v - st.ans(S.P)) < 1e-6;
  }
  const sol = SOL[solId]; const tag = `Sol ${sol.n} · ${st.titulo}`;
  const closeSol = () => { if (solDone(solId) && !S.solAt[solId]) { S.solAt[solId] = Date.now(); save(); return [{ ev: 'Concluiu o sol', det: `Sol ${sol.n} · ${sol.nome}`, pts: sol.stages.reduce((a, x) => a + rec(x.id).pts, 0) }]; } return []; };
  if (ok) {
    r.done = true; r.ok = true; r.pts = ptsFor(r); save(); mcSel = null; reveal = false;
    syncEv([{ ev: 'Acertou', det: tag, pts: r.pts }].concat(closeSol()));
    render(); celebratePiece();
  } else {
    r.w += 1; S.o2 = Math.max(0, S.o2 - 5); buzz();
    if (r.w >= 3) { r.done = true; r.ok = false; r.pts = 0; save(); mcSel = null; reveal = false; syncEv([{ ev: 'Corrigida', det: tag, pts: 0 }].concat(closeSol())); render(); return; }
    save(); syncEv([{ ev: 'Errou', det: `${tag} · ${r.w}º erro`, pts: 0 }]); const keep = kp ? kp.raw() : null; const sel = mcSel; render(); if (kp && keep != null) kp.set(keep); mcSel = sel;
    const k = document.querySelector('.task'); if (k) { k.classList.remove('shake'); void k.offsetWidth; k.classList.add('shake'); }
  }
}
function celebratePiece() {
  const tag = document.querySelector('.lab-tag'); if (tag) tag.classList.add('pop');
  if (viewer && !viewer.dead) { const g = viewer.pivot.children[0]; if (g) { g.scale.setScalar(0.6); let k = 0; viewer.frame.push(() => { if (k > 1) return; k += 0.05; const e = 1 - Math.pow(1 - Math.min(1, k), 3); g.scale.setScalar(0.6 + 0.4 * e); }); } }
}
function unroll() {
  const st = SOL[solId].stages[stIdx]; if (!viewer || viewer.dead) return;
  const sp = st.spec(S.P);
  const obj = sp.k === 'cyl' ? unrollCylinder(sp.r, sp.h, st.built) : unrollCone(sp.r, sp.h, st.built);
  viewer.set(obj); obj.set(1); viewer.fitTo(obj.group); viewer.radius *= 1.08; viewer.place(); obj.set(0); viewer.face(0, 0.25); let t = 0;
  viewer.frame.push(() => { if (t >= 1) return; t = Math.min(1, t + 0.012); obj.set(t * t * (3 - 2 * t)); });
}
function finish() {
  if (!S.finished) {
    S.finished = true; S.t1 = Date.now();
    DB.hall.push({ name: S.name, turma: S.turma, pts: score(), rank: rankOf(score()), t: Date.now() });
    if (DB.hall.length > 200) DB.hall = sortedHall().slice(0, 200);
    save();
    syncEv([{ ev: 'Concluiu a missão', det: rankOf(score()), pts: score() }]);
  }
  go('final');
}
function copyResult() {
  const txt = `Missão Marte · Colônia Ares-9 (9º ano)\n${S.name} · ${S.turma}\nPontos: ${score()} de ${MAXPTS} · ${rankOf(score())}\nPeças de primeira: ${STAGES.filter((st) => S.st[st.id] && S.st[st.id].ok && !S.st[st.id].w).length}/${STAGES.length} · Oxigênio restante: ${Math.round(S.o2)}%\nCódigo de verificação: ${certCode()}`;
  const fall = () => { const b = document.getElementById('copy-box'); b.hidden = false; b.value = txt; b.select(); toast('Copie o texto selecionado.'); };
  try { navigator.clipboard.writeText(txt).then(() => toast('Resultado copiado. Agora é só colar e enviar.'), fall); } catch (e) { fall(); }
}

$app.addEventListener('click', (e) => {
  const veil = e.target.closest('[data-act="close-veil"]'); if (veil && e.target === veil) { modal = null; render(); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.getAttribute('aria-disabled') === 'true') { if (b) toast('Conclua o sol anterior para liberar este.'); return; }
  const a = b.dataset.act;
  if (a === 'base') { if (S) go('base'); else go('cover'); }
  else if (a === 'cover') go('cover');
  else if (a === 'brief') go('brief');
  else if (a === 'sol') { solId = b.dataset.id; go('solintro'); }
  else if (a === 'stage') { stIdx = +b.dataset.i; mcSel = null; reveal = false; go('stage'); }
  else if (a === 'mc') { mcSel = +b.dataset.i; document.querySelectorAll('.mc-o').forEach((x, i) => x.classList.toggle('sel', i === mcSel)); }
  else if (a === 'send') send();
  else if (a === 'hint') { const r = rec(SOL[solId].stages[stIdx].id); r.hint = true; save(); const keep = kp ? kp.raw() : null; render(); if (kp && keep) kp.set(keep); }
  else if (a === 'reveal') { reveal = true; const keep = kp ? kp.raw() : null; render(); if (kp && keep) kp.set(keep); }
  else if (a === 'unroll') unroll();
  else if (a === 'soldone') go('soldone');
  else if (a === 'final') { if (SOLS.every((s) => solDone(s.id))) finish(); }
  else if (a === 'hall') go('hall');
  else if (a === 'pin') { modal = { type: 'pin' }; render(); setTimeout(() => { const i = document.querySelector('.modal input'); if (i) i.focus(); }, 30); }
  else if (a === 'menu') { modal = { type: 'menu' }; render(); }
  else if (a === 'close') { modal = null; render(); }
  else if (a === 'proj') { projection = !projection; render(); }
  else if (a === 'podio') { modal = { type: 'podio', i: +b.dataset.i }; render(); }
  else if (a === 'prof-filtro') { prof.filtro = b.dataset.id; renderProf(); }
  else if (a === 'prof-aba') { prof.aba = b.dataset.id; renderProf(); }
  else if (a === 'prof-pod') { prof.pod = +b.dataset.i; renderProf(); }
  else if (a === 'copy') copyResult();
  else if (a === 'again') { DB.cur = null; S = null; save(); go('cover'); }
  else if (a === 'wipe') { if (confirm('Apagar a missão atual e os destaques deste aparelho?')) { DB = { cur: null, hall: [] }; S = null; save(); go('cover'); } }
});
$app.addEventListener('submit', (e) => {
  e.preventDefault(); const f = e.target;
  if (f.dataset.form === 'start') {
    const name = f.nome.value.trim().replace(/\s+/g, ' '); const t = f.querySelector('input[name=turma]:checked');
    const err = document.getElementById('f-err');
    if (name.split(' ').length < 2) { err.textContent = 'Digite nome e sobrenome.'; err.hidden = false; return; }
    if (!t) { err.textContent = 'Escolha sua turma.'; err.hidden = false; return; }
    newGame(name, t.value); go('brief');
  }
  if (f.dataset.form === 'pin') { if (fnv('missao:' + norm(f.pin.value)) === PIN_HASH) { teacherKey = norm(f.pin.value); modal = null; go('teacher'); } else { modal = { type: 'pin', err: true }; render(); } }
});
render();

</script>
</body>
</html>
